<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện đề CCDV-F</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e3e1da; --soft:#efede6;
  --accent:#c4552d; --accent-ink:#ffffff; --ok:#1f7a4d; --ok-bg:#e6f4ec; --bad:#b3261e; --bad-bg:#fbeae8;
  --warn:#8a5a00; --warn-bg:#fff4dc; --code:#f1efe8; --link:#2457a6;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --muted:#a19f97; --line:#34332f; --soft:#2a2926;
  --accent:#e0794f; --accent-ink:#161614; --ok:#5cc58f; --ok-bg:#183326; --bad:#f08a80; --bad-bg:#3a1d1a;
  --warn:#f0c065; --warn-bg:#3a2e14; --code:#2c2b27; --link:#8fb4f0;
}}
:root[data-theme="dark"]{
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --muted:#a19f97; --line:#34332f; --soft:#2a2926;
  --accent:#e0794f; --accent-ink:#161614; --ok:#5cc58f; --ok-bg:#183326; --bad:#f08a80; --bad-bg:#3a1d1a;
  --warn:#f0c065; --warn-bg:#3a2e14; --code:#2c2b27; --link:#8fb4f0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:.88em;background:var(--code);padding:.08em .35em;border-radius:4px;word-break:break-word}
a{color:var(--link)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;padding:0 8px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.grp{margin-top:18px}
.grp h4{margin:0 8px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ex{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:8px;font-size:14px}
.ex:hover{background:var(--soft)}
.ex.on{background:var(--accent);color:var(--accent-ink)}
.ex .n{opacity:.7;font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.ex .done{font-size:11.5px}
main{padding:28px 32px 80px;max-width:980px;width:100%}
.mobilebar{display:none}
.head h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em;line-height:1.25}
.head .sub{color:var(--muted);font-size:13.5px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;margin-bottom:6px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--muted)}
.spacer{flex:1}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
select.btn{padding:6px 10px}
.result{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0}
.result .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.result .pass{color:var(--ok)} .result .fail{color:var(--bad)}
.bars{display:grid;grid-template-columns:minmax(150px,240px) 1fr 60px;gap:6px 12px;align-items:center;margin-top:12px;font-size:13.5px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0}
.q.correct{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.q.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.qtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.qnum{font-weight:700;font-size:15px;margin-right:4px}
.tag{font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted)}
.tag.multi{background:var(--warn-bg);color:var(--warn);font-weight:600}
.tag.Hard{color:var(--bad)} .tag.Medium{color:var(--warn)} .tag.Easy{color:var(--ok)}
.stem{font-size:16px;margin:2px 0 12px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--muted)}
.opt input{margin:4px 0 0;accent-color:var(--accent);flex:none}
.opt .L{font-weight:700;min-width:18px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .mark{margin-left:auto;font-weight:700;flex:none}
details{margin-top:10px}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;list-style:none;display:inline-flex;align-items:center;gap:6px;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";transition:transform .15s;display:inline-block}
details[open]>summary::before{transform:rotate(90deg)}
details.en>summary{color:var(--muted);font-weight:500;font-size:13px}
.enbox{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 12px;margin-top:6px}
.enbox ol{margin:6px 0 0;padding-left:22px}
.ans{border-top:1px dashed var(--line);margin-top:10px;padding-top:12px}
.ansline{font-weight:600;color:var(--ok);margin-bottom:8px}
.ans p{margin:0 0 10px}
.notes{list-style:none;padding:0;margin:8px 0 10px;display:flex;flex-direction:column;gap:6px}
.notes li{font-size:14px;padding:7px 10px;border-radius:8px;background:var(--soft)}
.notes li.ok{background:var(--ok-bg)}
.notes li b{margin-right:4px}
.kc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kc span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-family:ui-monospace,Consolas,monospace}
.flag{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px;margin:8px 0}
.flag b{color:var(--warn)}
.orig{font-size:13px;color:var(--muted);font-style:italic;margin:6px 0}
.refs{margin:8px 0 0;padding-left:20px;font-size:14px}
.refs li{margin-bottom:7px}
.refs .s{color:var(--muted);font-size:12.5px}
.refs .nv{display:block;color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.theme{margin:22px 8px 0;font-size:12.5px;color:var(--muted)}
.theme button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:12px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:16px 16px 70px}
  .mobilebar{display:block;margin-bottom:12px}
  .mobilebar select{width:100%}
  .head h1{font-size:21px}
  .bars{grid-template-columns:1fr 1fr 48px}
}
@media print{aside,.toolbar,.mobilebar{display:none}.app{display:block}details{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main>
    <div class="mobilebar"><select class="btn" id="msel" aria-label="Chọn đề"></select></div>
    <div class="head">
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="submit">Nộp bài &amp; chấm điểm</button>
      <button class="btn" id="reset">Làm lại</button>
      <button class="btn" id="showall" aria-pressed="false">Hiện tất cả đáp án</button>
      <button class="btn" id="wrongonly" aria-pressed="false" hidden>Chỉ xem câu sai</button>
      <select class="btn" id="dfilter" hidden aria-label="Lọc theo domain"></select>
      <span class="spacer"></span>
      <span class="timer" id="timer"></span>
    </div>
    <div id="result"></div>
    <div id="list"></div>
  </main>
</div>
<script id="data" type="application/json">{"Q": {"Q001": {"d": 1, "sv": "Hai (TWO) thực hành nào được khuyến nghị khi xây dựng agent?", "se": "Which TWO practices are recommended when building agents?", "oe": ["Add as many agents as possible", "Give tools clear documentation and test them thoroughly", "Hide tool descriptions to save tokens", "Keep the design as simple as possible", "Skip sandbox testing to ship faster"], "ov": ["Thêm càng nhiều agent càng tốt", "Viết tài liệu rõ ràng cho tool và test chúng kỹ lưỡng", "Ẩn mô tả tool để tiết kiệm token", "Giữ thiết kế đơn giản nhất có thể", "Bỏ qua bước test trong sandbox để ship nhanh hơn"], "on": ["Sai — Thêm agent làm tăng latency, chi phí và rủi ro lỗi cộng dồn; Anthropic khuyên chỉ tăng độ phức tạp khi thực sự cần.", "Đúng — Đây là nguyên tắc chăm chút agent-computer interface (ACI): tài liệu tool rõ ràng và test kỹ giúp model dùng tool chính xác.", "Sai — Mô tả tool là thông tin duy nhất giúp model chọn và gọi tool đúng; ẩn nó đi sẽ khiến model gọi sai.", "Đúng — Simplicity là nguyên tắc số một: bắt đầu từ giải pháp đơn giản nhất và chỉ thêm phức tạp khi đo được lợi ích.", "Sai — Agent tự chủ có thể gây lỗi cộng dồn; Anthropic khuyên test kỹ trong sandbox và đặt guardrail trước khi triển khai."], "c": [1, 3], "x": "Câu này kiểm tra ba nguyên tắc cốt lõi trong bài \"Building effective agents\" của Anthropic: (1) giữ thiết kế agent đơn giản (simplicity), (2) minh bạch (transparency) bằng cách cho agent thể hiện rõ các bước planning, và (3) đầu tư kỹ vào agent-computer interface (ACI), tức là viết tài liệu tool thật rõ và test tool thật kỹ.\n\nHai đáp án đúng khớp trực tiếp với nguyên tắc (1) và (3). Về simplicity: Anthropic khuyên bắt đầu từ giải pháp đơn giản nhất (thậm chí chỉ một LLM call có retrieval), chỉ thêm workflow hoặc agent khi đo được là cần. Về ACI: model chỉ biết dùng tool qua `name`, `description` và `input_schema`, nên mô tả tool phải giống như docstring tốt dành cho một junior developer, ví dụ nêu rõ định dạng tham số, khi nào nên dùng, edge case. Anthropic còn kể rằng khi làm agent cho SWE-bench, họ tốn thời gian tối ưu tool nhiều hơn tối ưu prompt tổng thể, và chạy nhiều input mẫu để xem model dùng sai tool ở đâu.\n\nBẫy thường gặp: nghĩ rằng \"nhiều agent hơn = thông minh hơn\" hoặc \"ẩn mô tả tool để tiết kiệm token\". Mẹo nhớ: Simple, Transparent, Well-documented tools. Bất kỳ phương án nào đi ngược lại (thêm phức tạp vô cớ, giảm thông tin cho model, bỏ test) gần như chắc chắn sai.", "k": ["agent", "simplicity", "transparency", "agent-computer interface (ACI)", "tool documentation"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Summary", "n": "Phần tổng kết nêu ba nguyên tắc: giữ thiết kế đơn giản, ưu tiên transparency và chăm chút ACI qua tài liệu và test tool."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Appendix 2: Prompt engineering your tools", "n": "Hướng dẫn cách viết định nghĩa tool như docstring tốt và test cách model sử dụng tool."}, {"u": "https://www.anthropic.com/engineering/writing-tools-for-agents", "t": "Writing effective tools for agents — with agents", "s": "", "n": "Bài viết chi tiết về cách thiết kế, mô tả và đánh giá tool cho agent."}], "f": "", "ke": ["Simplicity, transparency and a carefully crafted agent-computer interface are the core principles for effective agents."], "ap": ["D1#1", "PD#4"]}, "Q002": {"d": 1, "sv": "Một team đề xuất dùng framework năm agent để trả lời câu hỏi dựa trên một tài liệu FAQ dài 30 trang. Phản hồi tốt nhất là gì?", "se": "A team proposes a five-agent framework to answer questions from a 30-page FAQ. What is the best response?", "oe": ["Add a sixth agent to supervise the other five", "Start with a single call that includes or retrieves the FAQ content, and add complexity only if it falls short", "Approve it; more agents always improve quality", "Fine-tune a model first"], "ov": ["Thêm agent thứ sáu để giám sát năm agent còn lại", "Bắt đầu bằng một call duy nhất có đưa vào hoặc retrieve nội dung FAQ, và chỉ thêm độ phức tạp nếu cách này chưa đạt", "Duyệt luôn; càng nhiều agent thì chất lượng càng cao", "Fine-tune một model trước"], "on": ["Sai — Thêm một tầng giám sát chỉ làm hệ thống phức tạp hơn mà không giải quyết vấn đề gốc là bài toán vốn đơn giản.", "Đúng — Một call có retrieval hoặc nhét FAQ vào context thường là đủ; chỉ thêm workflow hay agent khi eval cho thấy cần.", "Sai — Nhiều agent làm tăng chi phí, latency và điểm lỗi; không có quy tắc 'càng nhiều agent càng tốt'.", "Sai — Fine-tuning tốn kém và không cần thiết khi nội dung FAQ có thể đưa trực tiếp vào prompt hoặc qua retrieval."], "c": [1], "x": "Nguyên tắc được kiểm tra: \"complexity should be earned\" (độ phức tạp phải được chứng minh là cần thiết). Bài \"Building effective agents\" khuyên tìm giải pháp đơn giản nhất có thể, và chỉ tăng độ phức tạp khi cần. Với nhiều ứng dụng, tối ưu một LLM call duy nhất kèm retrieval và in-context examples là đủ.\n\nFAQ 30 trang chỉ vào khoảng vài chục nghìn token, hoàn toàn vừa trong context window của Claude. Vì vậy cách hợp lý là: đưa toàn bộ FAQ vào system prompt (có thể kết hợp prompt caching để giảm chi phí cho các câu hỏi lặp lại), hoặc dùng retrieval lấy các đoạn liên quan, rồi hỏi Claude trong một call. Sau đó chạy eval trên bộ câu hỏi thực tế; nếu chất lượng chưa đạt mới cân nhắc thêm bước như routing hoặc prompt chaining. Agent system đánh đổi latency và chi phí để lấy hiệu năng, nên chỉ đáng dùng khi bài toán thực sự open-ended.\n\nBẫy thường gặp: bị hấp dẫn bởi framework nhiều agent hoặc fine-tuning. Fine-tuning tốn kém, chậm vòng lặp và không cần cho bài toán tra cứu kiến thức có sẵn trong tài liệu. Mẹo đi thi: khi đề bài mô tả một tác vụ đơn giản, định nghĩa rõ, đáp án đúng gần như luôn là \"bắt đầu đơn giản, đo lường, rồi mới thêm phức tạp\".", "k": ["simplicity", "single LLM call", "retrieval", "agent", "complexity should be earned"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "When (and when not) to use agents", "n": "Khuyên tìm giải pháp đơn giản nhất; với nhiều ứng dụng, một LLM call kèm retrieval và in-context examples là đủ."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#long-context-prompting", "t": "Prompting best practices — Long context prompting", "s": "", "n": "Mẹo đặt tài liệu dài vào prompt để Claude trả lời chính xác dựa trên nội dung đó."}], "f": "", "ke": ["For many applications, a single well-prompted call with retrieval and examples is enough. Complexity should be earned."], "ap": ["D1#2", "M2#3"]}, "Q003": {"d": 1, "sv": "Một công cụ code review chạy đồng thời ba call riêng biệt, mỗi call phụ trách một khía cạnh: security, performance và style, sau đó gộp các phát hiện lại. Đây là pattern nào?", "se": "A code review tool runs three separate calls at the same time, one each for security, performance and style, then combines the findings. Which pattern is this?", "oe": ["Evaluator-optimizer", "Routing", "Parallelization (sectioning)", "Orchestrator-workers"], "ov": ["Evaluator-optimizer", "Routing", "Parallelization (sectioning)", "Orchestrator-workers"], "on": ["Sai — Evaluator-optimizer là vòng lặp một call sinh kết quả và một call đánh giá, phản hồi để cải thiện dần; không phải ba call song song.", "Sai — Routing phân loại input rồi chuyển đến MỘT nhánh xử lý chuyên biệt, không chạy nhiều nhánh đồng thời.", "Đúng — Ba subtask độc lập, biết trước và chạy song song rồi gộp kết quả chính là parallelization dạng sectioning.", "Sai — Orchestrator-workers dùng LLM trung tâm quyết định subtask động theo input; ở đây các subtask đã cố định từ trước."], "c": [2], "x": "Câu này kiểm tra khả năng phân biệt các workflow pattern trong \"Building effective agents\". Parallelization có hai biến thể: sectioning (chia tác vụ thành các subtask độc lập và chạy song song) và voting (chạy cùng một tác vụ nhiều lần để lấy kết quả đa dạng hoặc biểu quyết).\n\nỞ đây, ba subtask (security, performance, style) đã được xác định TRƯỚC, độc lập với nhau và chạy cùng lúc, sau đó kết quả được gộp lại bằng code. Đó chính xác là sectioning. Lợi ích: mỗi call tập trung vào một khía cạnh nên chất lượng cao hơn (LLM thường làm tốt hơn khi mỗi yếu tố được xử lý bằng một call riêng), đồng thời giảm latency vì chạy song song. Ví dụ thực tế: `asyncio.gather(review_security(diff), review_perf(diff), review_style(diff))` rồi merge kết quả.\n\nBẫy thường gặp: nhầm với orchestrator-workers. Điểm khác biệt then chốt: trong orchestrator-workers, các subtask KHÔNG được định nghĩa trước mà do một LLM trung tâm quyết định động theo từng input. Còn routing chỉ chọn MỘT nhánh xử lý theo loại input, không chạy nhiều nhánh cùng lúc. Mẹo nhớ: subtask cố định + chạy song song = sectioning; cùng một task chạy nhiều lần để so sánh = voting; subtask do LLM tự lập kế hoạch = orchestrator-workers.", "k": ["parallelization", "sectioning", "voting", "workflow", "orchestrator-workers"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Parallelization", "n": "Mô tả hai biến thể sectioning và voting, kèm ví dụ chạy nhiều khía cạnh đánh giá trong các call riêng biệt."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Orchestrator-workers", "n": "Giải thích điểm khác với parallelization: subtask không được định nghĩa trước mà do orchestrator quyết định."}], "f": "", "ke": ["Sectioning splits a task into independent subtasks known in advance and runs them in parallel."], "ap": ["D1#3", "M2#6"]}, "Q004": {"d": 1, "sv": "Một trợ lý nghiên cứu phải thu thập thông tin từ nhiều nguồn, nhưng nguồn nào và bao nhiêu nguồn lại tùy thuộc vào câu hỏi. Một LLM trung tâm lập kế hoạch tìm kiếm và tổng hợp kết quả. Đây là pattern nào?", "se": "A research assistant must gather information from several sources, but which sources and how many depends on the question. A central LLM plans the searches and combines the findings. Which pattern is this?", "oe": ["Orchestrator-workers", "Routing", "Parallelization (sectioning)", "Prompt chaining"], "ov": ["Orchestrator-workers", "Routing", "Parallelization (sectioning)", "Prompt chaining"], "on": ["Đúng — LLM trung tâm quyết định động cần tìm những nguồn nào, giao việc cho worker rồi tổng hợp kết quả chính là orchestrator-workers.", "Sai — Routing chỉ phân loại input và chuyển đến một nhánh xử lý cố định, không lập kế hoạch nhiều subtask.", "Sai — Sectioning yêu cầu subtask biết trước; ở đây số lượng và loại nguồn thay đổi theo từng câu hỏi.", "Sai — Prompt chaining là chuỗi bước tuần tự cố định, không có LLM trung tâm lập kế hoạch động."], "c": [0], "x": "Câu này kiểm tra đặc điểm nhận diện orchestrator-workers: một LLM trung tâm (orchestrator) phân rã tác vụ một cách ĐỘNG, giao các subtask cho các worker LLM, rồi tổng hợp (synthesize) kết quả. Điểm mấu chốt là số lượng và nội dung subtask không thể biết trước mà phụ thuộc vào từng input.\n\nĐề bài nói rõ \"nguồn nào và bao nhiêu nguồn tùy thuộc vào câu hỏi\" và \"LLM trung tâm lập kế hoạch tìm kiếm và tổng hợp\". Ví dụ: câu hỏi \"So sánh chính sách thuế crypto của Việt Nam, Singapore và Nhật\" có thể sinh ra 3 worker tìm kiếm, nhưng câu \"Định nghĩa stablecoin là gì\" có thể chỉ cần 1. Đây cũng chính là kiến trúc multi-agent research system của Anthropic: lead agent lập kế hoạch và tạo các subagent tìm kiếm song song, rồi tổng hợp kết quả.\n\nBẫy thường gặp: chọn parallelization (sectioning) vì cũng có nhiều tác vụ chạy song song. Hãy nhớ: sectioning áp dụng khi subtask cố định, biết trước (ví dụ luôn luôn kiểm tra security, performance, style). Khi subtask do model quyết định theo input, đó là orchestrator-workers. Prompt chaining là chuỗi bước cố định tuần tự, còn routing chỉ chọn một nhánh. Từ khóa nhận diện trong đề: \"depends on the input\", \"central LLM plans\", \"synthesizes\".", "k": ["orchestrator-workers", "dynamic task decomposition", "synthesis", "multi-agent", "subagent"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Orchestrator-workers", "n": "Định nghĩa pattern và nhấn mạnh subtask không được định nghĩa trước mà do orchestrator xác định theo input."}, {"u": "https://www.anthropic.com/engineering/multi-agent-research-system", "t": "How we built our multi-agent research system", "s": "", "n": "Mô tả hệ thống research của Anthropic với lead agent lập kế hoạch và các subagent tìm kiếm song song."}], "f": "", "ke": ["When subtasks are not predefined but decided per input, an orchestrator delegates to workers and synthesises their results."], "ap": ["D1#4", "PD#44"]}, "Q005": {"d": 1, "sv": "Loại bài toán nào phù hợp nhất với một autonomous agent?", "se": "Which kind of problem is the best fit for an autonomous agent?", "oe": ["An open-ended problem where the number of steps cannot be predicted and a fixed path cannot be hard-coded", "A lookup of one database row", "A single classification", "A two-step task that never changes"], "ov": ["Một bài toán mở, không thể dự đoán số bước cần thiết và không thể hard-code một lộ trình cố định", "Tra cứu một dòng trong database", "Một lần phân loại duy nhất", "Một tác vụ hai bước không bao giờ thay đổi"], "on": ["Đúng — Agent phù hợp nhất cho bài toán mở, không dự đoán được số bước và không thể hard-code lộ trình.", "Sai — Tra cứu một dòng database là thao tác xác định, chỉ cần một query hoặc một tool call, không cần agent.", "Sai — Phân loại đơn lẻ chỉ cần một LLM call được prompt tốt, dùng agent là lãng phí.", "Sai — Tác vụ hai bước cố định phù hợp với prompt chaining (workflow), vì lộ trình hoàn toàn biết trước."], "c": [0], "x": "Câu này kiểm tra ranh giới giữa workflow và agent. Theo Anthropic, workflow là hệ thống mà LLM và tool được điều phối qua các đường code định sẵn; còn agent là hệ thống mà LLM tự điều khiển quá trình và cách dùng tool. Agent phù hợp với bài toán open-ended, nơi khó hoặc không thể dự đoán số bước cần thiết và không thể hard-code một lộ trình cố định.\n\nĐáp án đúng mô tả chính xác điều kiện đó. Ví dụ điển hình: sửa một issue GitHub trên codebase lạ (agent phải đọc file, chạy test, sửa nhiều file, lặp lại cho đến khi test pass), hoặc computer use. Trong các tình huống này bạn phải \"tin\" vào quyết định của model ở mỗi bước, nên cần một môi trường có thể kiểm soát (sandbox), guardrail và điều kiện dừng như số vòng lặp tối đa.\n\nBẫy thường gặp: dùng agent cho mọi thứ. Tra cứu một dòng database chỉ cần một tool call hoặc một query; phân loại chỉ cần một LLM call; tác vụ hai bước cố định nên dùng prompt chaining. Agent đánh đổi chi phí cao hơn, latency lớn hơn và rủi ro lỗi cộng dồn để lấy tính linh hoạt, nên chỉ đáng dùng khi tính linh hoạt đó thực sự cần. Mẹo đi thi: thấy cụm \"cannot predict the number of steps\" hoặc \"open-ended\" là nghĩ ngay đến agent.", "k": ["autonomous agent", "workflow vs agent", "open-ended problem", "guardrails", "sandbox"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Agents", "n": "Nêu khi nào nên dùng agent: bài toán mở, khó dự đoán số bước, không thể hard-code lộ trình cố định."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Building blocks, workflows, and agents", "n": "Phân biệt workflow (đường code định sẵn) với agent (LLM tự điều khiển quá trình và tool)."}], "f": "", "ke": ["Agents suit open-ended problems where you cannot predict the required steps and must trust the model's decisions."], "ap": ["D1#5", "M1#1", "PD#20"]}, "Q006": {"d": 1, "sv": "Một bản dịch văn học được tạo bởi một call, được một call khác phê bình về sắc thái ngôn từ, và được chỉnh sửa lặp lại cho đến khi bản phê bình đạt yêu cầu. Đây là pattern nào?", "se": "A literary translation is produced by one call, critiqued for nuance by another, and revised until the critique passes. Which pattern is this?", "oe": ["Evaluator-optimizer", "Parallelization (sectioning)", "Prompt chaining", "Routing"], "ov": ["Evaluator-optimizer", "Parallelization (sectioning)", "Prompt chaining", "Routing"], "on": ["Đúng — Một call sinh bản dịch, một call đánh giá và phản hồi, lặp lại đến khi đạt chuẩn là đúng định nghĩa evaluator-optimizer.", "Sai — Sectioning chạy các subtask độc lập song song, không có vòng lặp phản hồi giữa hai call.", "Sai — Prompt chaining là chuỗi bước cố định một chiều; đề bài có vòng lặp sửa đến khi đạt nên không phải chaining thuần.", "Sai — Routing phân loại input để chọn một nhánh xử lý, không liên quan đến đánh giá và tinh chỉnh lặp lại."], "c": [0], "x": "Câu này kiểm tra pattern evaluator-optimizer: một LLM call sinh kết quả (optimizer/generator), một LLM call khác đánh giá và đưa feedback (evaluator), và hai bên chạy trong VÒNG LẶP cho đến khi đạt tiêu chí. Anthropic lấy chính ví dụ dịch văn học làm minh họa: model dịch ban đầu có thể bỏ sót sắc thái, còn evaluator có thể chỉ ra những điểm đó để cải thiện.\n\nPattern này hiệu quả khi thỏa hai điều kiện: (1) có tiêu chí đánh giá rõ ràng, và (2) việc tinh chỉnh lặp lại mang lại giá trị đo được, giống như một dịch giả con người sửa bản thảo sau khi nhận góp ý. Luồng điển hình: `draft = generate(text)` rồi lặp `feedback = evaluate(draft)`; nếu `feedback.pass` thì dừng, nếu không thì `draft = revise(draft, feedback)`. Nên đặt số vòng tối đa để tránh lặp vô hạn và kiểm soát chi phí.\n\nBẫy thường gặp: nhầm với prompt chaining vì cũng có nhiều call nối tiếp. Khác biệt then chốt là prompt chaining đi theo các bước cố định, một chiều, không quay lại; còn evaluator-optimizer có vòng phản hồi quay lại bước sinh. Từ khóa nhận diện: \"critique\", \"feedback\", \"revise until\", \"iterative refinement\".", "k": ["evaluator-optimizer", "iterative refinement", "feedback loop", "evaluation criteria"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Evaluator-optimizer", "n": "Định nghĩa pattern, điều kiện áp dụng và ví dụ dịch văn học cần evaluator nắm bắt sắc thái."}], "f": "", "ke": ["A generator and an evaluator in a loop fit tasks with clear criteria where iterative refinement adds measurable value."], "ap": ["D1#6", "PD#7"]}, "Q007": {"d": 1, "sv": "Điều gì giúp một agent bám sát thực tế (grounded) trong khi thực hiện một tác vụ?", "se": "What keeps an agent grounded while it works through a task?", "oe": ["A high temperature", "A very long system prompt", "Feedback from the environment at each step, such as tool results or code execution output", "Running without tools"], "ov": ["Một giá trị temperature cao", "Một system prompt rất dài", "Feedback từ môi trường ở mỗi bước, chẳng hạn kết quả tool hoặc output thực thi code", "Chạy mà không có tool"], "on": ["Sai — Temperature cao chỉ làm output đa dạng và ngẫu nhiên hơn, không cung cấp thông tin thực tế nào về môi trường.", "Sai — System prompt dài không thay thế được dữ liệu thực tế phát sinh trong quá trình chạy, còn có thể làm loãng context.", "Đúng — Kết quả tool và output thực thi code là ground truth giúp agent đánh giá tiến độ và quyết định bước tiếp theo.", "Sai — Không có tool thì agent không quan sát được môi trường, dễ hallucinate và không tự kiểm chứng được."], "c": [2], "x": "Câu này kiểm tra khái niệm \"ground truth from the environment\". Theo \"Building effective agents\", trong quá trình thực thi, agent cần nhận được thông tin thực tế từ môi trường ở MỖI bước (kết quả tool call, output khi chạy code, kết quả test) để đánh giá tiến độ và quyết định bước tiếp theo. Đây là điều phân biệt agent đáng tin với một model chỉ \"tưởng tượng\" ra kết quả.\n\nVí dụ: agent sửa bug chạy `pytest`, nhận về `2 failed, 18 passed` kèm stack trace. Đó là dữ liệu thật để agent biết bản sửa chưa đủ và cần đọc lại file nào. Trong Messages API, feedback này quay về dưới dạng block `tool_result` gắn với `tool_use_id` tương ứng. Nếu không có vòng feedback này, agent dễ hallucinate rằng tác vụ đã xong, và lỗi bị cộng dồn qua các bước.\n\nBẫy thường gặp: nghĩ rằng system prompt dài hơn hoặc temperature cao giúp agent \"thông minh hơn\". Temperature cao làm output ngẫu nhiên hơn, không grounded hơn. System prompt dài không thay thế được dữ liệu thực tế phát sinh trong lúc chạy. Chạy không có tool thì agent mất hẳn kênh quan sát môi trường. Mẹo nhớ: agent = LLM dùng tool trong một vòng lặp dựa trên environmental feedback.", "k": ["agent", "environmental feedback", "ground truth", "tool_result", "agent loop"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Agents", "n": "Nêu rằng agent cần ground truth từ môi trường ở mỗi bước, như kết quả tool hoặc thực thi code, để đánh giá tiến độ."}, {"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "t": "Define tools", "s": "", "n": "Mô tả cách trả kết quả tool về cho Claude bằng block tool_result trong vòng lặp tool use."}], "f": "", "ke": ["Agents rely on ground truth from the environment at each step to assess progress and decide what to do next."], "ap": ["D1#7", "M1#17", "PD#46"]}, "Q008": {"d": 1, "sv": "Một pipeline viết nội dung marketing rồi dịch sang tiếng Việt, ở giữa có một bước kiểm tra bằng code để đảm bảo nội dung dưới 100 từ. Đây là pattern nào?", "se": "A pipeline writes marketing copy and then translates it into Vietnamese, with a code check in between that the copy stays under 100 words. Which pattern is this?", "oe": ["Routing", "An autonomous agent", "Prompt chaining with a programmatic gate", "Orchestrator-workers"], "ov": ["Routing", "Một autonomous agent", "Prompt chaining với một programmatic gate", "Orchestrator-workers"], "on": ["Sai — Routing phân loại input để chọn một nhánh xử lý, còn đây là chuỗi bước cố định áp dụng cho mọi input.", "Sai — Lộ trình đã được code định sẵn, model không tự quyết định bước tiếp theo nên không phải autonomous agent.", "Đúng — Hai bước tuần tự cố định (viết rồi dịch) với một bước kiểm tra bằng code ở giữa là prompt chaining có programmatic gate.", "Sai — Orchestrator-workers cần LLM trung tâm lập kế hoạch subtask động; ở đây các bước đã cố định."], "c": [2], "x": "Câu này kiểm tra pattern prompt chaining: phân rã một tác vụ thành chuỗi các bước TUẦN TỰ, CỐ ĐỊNH, trong đó output của call trước là input của call sau. Giữa các bước có thể chèn \"gate\", tức một bước kiểm tra bằng code (programmatic check) để đảm bảo quá trình vẫn đúng hướng trước khi đi tiếp.\n\nĐề bài khớp hoàn toàn: bước 1 viết copy, gate kiểm tra `len(copy.split()) < 100`, bước 2 dịch sang tiếng Việt. Nếu gate thất bại, pipeline có thể yêu cầu viết lại hoặc dừng thay vì tốn tiền dịch một bản không đạt. Chính Anthropic dùng ví dụ \"viết marketing copy rồi dịch sang ngôn ngữ khác\" để minh họa prompt chaining. Lợi ích: mỗi call là một tác vụ dễ hơn nên độ chính xác cao hơn, đánh đổi bằng latency tăng nhẹ; ngoài ra dễ debug vì biết chính xác bước nào hỏng.\n\nBẫy thường gặp: chọn autonomous agent vì có nhiều bước. Nhưng ở đây lộ trình hoàn toàn biết trước và do code điều khiển, model không tự quyết định bước tiếp theo, nên đây là workflow, không phải agent. Orchestrator-workers cần LLM tự lập kế hoạch subtask; routing chỉ phân loại để chọn nhánh. Mẹo nhớ: các bước cố định nối tiếp + kiểm tra bằng code ở giữa = prompt chaining with gate.", "k": ["prompt chaining", "programmatic gate", "workflow", "task decomposition"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Prompt chaining", "n": "Định nghĩa prompt chaining, vai trò của gate kiểm tra bằng code và ví dụ viết marketing copy rồi dịch."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#chain-complex-prompts", "t": "Prompting best practices — Chain complex prompts", "s": "", "n": "Hướng dẫn chia tác vụ phức tạp thành chuỗi prompt, truyền output của bước trước sang bước sau."}], "f": "", "ke": ["Prompt chaining decomposes a task into fixed sequential steps, and a gate between steps verifies the intermediate output."], "ap": ["D1#8", "M2#8", "PD#3"]}, "Q009": {"d": 2, "sv": "Tham số `max_tokens` kiểm soát điều gì?", "se": "What does the max_tokens parameter control?", "oe": ["The total size of the context window", "The number of requests per minute", "The maximum number of tokens the model may generate in this response", "The number of input tokens allowed"], "ov": ["Tổng kích thước của context window", "Số lượng request mỗi phút", "Số token tối đa mà model được phép sinh ra trong response này", "Số input token được phép"], "on": ["Sai — Context window là giới hạn cố định của model cho tổng input và output, `max_tokens` không thay đổi nó.", "Sai — Số request mỗi phút là rate limit (RPM) cấp tổ chức, không phải tham số của từng request.", "Đúng — `max_tokens` là tham số bắt buộc giới hạn số token output tối đa của một response.", "Sai — `max_tokens` không giới hạn input; input bị giới hạn bởi context window và kích thước request."], "c": [2], "x": "Câu này kiểm tra hiểu biết về `max_tokens` trong Messages API: đây là tham số BẮT BUỘC, quy định số token tối đa model được sinh ra trong MỘT response. Nó giới hạn output, không giới hạn input và không thay đổi kích thước context window.\n\nKhi model chạm giới hạn này, response bị cắt ngang và có `\"stop_reason\": \"max_tokens\"`. Ví dụ request `{\"model\": \"...\", \"max_tokens\": 1024, \"messages\": [...]}` nghĩa là Claude sẽ dừng sau tối đa 1024 token output dù câu trả lời chưa xong. Lưu ý: context window là tổng ngân sách cho input cộng output; `max_tokens` chỉ là phần output bạn cho phép trong ngân sách đó. Mỗi model còn có mức output tối đa riêng, và khi bật extended thinking thì `budget_tokens` phải nhỏ hơn `max_tokens`.\n\nBẫy thường gặp: nhầm `max_tokens` với context window hoặc với giới hạn input. Số request mỗi phút là rate limit (RPM) do tổ chức quy định, không phải tham số của request. Mẹo đi thi: thấy câu trả lời bị cụt giữa chừng thì kiểm tra `stop_reason`, nếu là `\"max_tokens\"` thì tăng `max_tokens` hoặc yêu cầu model viết ngắn gọn hơn.", "k": ["max_tokens", "output tokens", "context window", "stop_reason"], "r": [{"u": "https://platform.claude.com/docs/en/api/messages", "t": "Messages - Claude API Reference", "s": "Create a Message", "n": "Tài liệu tham số của endpoint Messages, trong đó `max_tokens` là tham số bắt buộc giới hạn số token sinh ra."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons", "t": "Stop reasons and fallback", "s": "max_tokens", "n": "Giải thích `stop_reason` bằng `max_tokens` nghĩa là response bị cắt do chạm giới hạn output."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/context-windows", "t": "Context windows", "s": "", "n": "Phân biệt context window (tổng input và output) với giới hạn output của từng request."}], "f": "", "ke": ["max_tokens caps the output of a single response. It is a required parameter and separate from the context window."], "ap": ["D2#1", "M1#4", "PD#27"]}, "Q010": {"d": 2, "sv": "Bạn dùng phần nào của response từ Messages API để theo dõi chi phí của từng request?", "se": "Which part of a Messages API response do you use to track the cost of each request?", "oe": ["The usage object, with input and output token counts", "The id field", "The role field", "The stop_sequence field"], "ov": ["Object `usage`, chứa số input token và output token", "Trường `id`", "Trường `role`", "Trường `stop_sequence`"], "on": ["Đúng — `usage` báo `input_tokens`, `output_tokens` và các trường cache token, là cơ sở để tính chi phí.", "Sai — `id` chỉ là định danh của message, không chứa thông tin về lượng token sử dụng.", "Sai — `role` của response luôn là `\"assistant\"`, không liên quan đến chi phí.", "Sai — `stop_sequence` chỉ cho biết chuỗi dừng tùy chỉnh nào đã khớp, không phản ánh lượng token."], "c": [0], "x": "Câu này kiểm tra cấu trúc response của Messages API. Chi phí được tính theo token, và object `usage` báo chính xác số token đã dùng: `input_tokens`, `output_tokens`, và khi dùng prompt caching thì thêm `cache_creation_input_tokens` (token ghi vào cache) và `cache_read_input_tokens` (token đọc từ cache).\n\nVí dụ: `\"usage\": {\"input_tokens\": 120, \"output_tokens\": 450, \"cache_read_input_tokens\": 8000}`. Nhân các con số này với đơn giá của model (output thường đắt hơn input nhiều lần, cache read rẻ hơn nhiều so với input thường, cache write đắt hơn input thường) là ra chi phí của request. Trong production, bạn nên log `usage` cùng request ID và model cho mỗi call để dựng dashboard chi phí, phát hiện prompt phình to hoặc cache không hit.\n\nBẫy thường gặp: các trường còn lại đều có trong response nhưng không liên quan chi phí. `id` là định danh message, `role` luôn là `\"assistant\"`, `stop_sequence` chỉ cho biết chuỗi dừng nào đã khớp (nếu có). Mẹo nhớ: cost = usage × pricing. Với streaming, số liệu `usage` đến qua sự kiện `message_start` và được cập nhật ở `message_delta`.", "k": ["usage", "input_tokens", "output_tokens", "cost tracking", "prompt caching"], "r": [{"u": "https://platform.claude.com/docs/en/api/messages", "t": "Messages - Claude API Reference", "s": "Create a Message", "n": "Mô tả cấu trúc response, bao gồm object `usage` với các trường token và cache token."}, {"u": "https://platform.claude.com/docs/en/about-claude/pricing", "t": "Pricing", "s": "", "n": "Bảng giá theo token input, output, cache write và cache read của từng model để quy đổi `usage` ra chi phí."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "t": "Prompt caching", "s": "", "n": "Giải thích các trường `cache_creation_input_tokens` và `cache_read_input_tokens` trong `usage`."}], "f": "", "ke": ["usage reports input_tokens and output_tokens, plus cache token counts when caching is used."], "ap": ["D2#2", "PD#26"]}, "Q011": {"d": 2, "sv": "Phát biểu nào về mảng `messages` là đúng?", "se": "Which statement about the messages array is correct?", "oe": ["It must start with an assistant turn", "It carries the conversation as user and assistant turns, starting with a user turn", "It is optional when a system prompt is set", "It may contain only one message"], "ov": ["Nó phải bắt đầu bằng một lượt assistant", "Nó chứa cuộc hội thoại dưới dạng các lượt user và assistant, bắt đầu bằng một lượt user", "Nó là tùy chọn khi đã có system prompt", "Nó chỉ được chứa một message"], "on": ["Sai — Theo quy tắc chuẩn, hội thoại mở đầu bằng lượt `user`; lượt `assistant` chỉ dùng cho câu trả lời trước đó hoặc prefill.", "Đúng — `messages` mang lịch sử hội thoại dưới dạng các lượt `user` và `assistant` xen kẽ, mở đầu bằng `user`.", "Sai — `messages` là tham số bắt buộc; `system` chỉ bổ sung bối cảnh chứ không thay thế lượt user.", "Sai — Mảng có thể chứa nhiều message để biểu diễn hội thoại nhiều lượt, vì API là stateless."], "c": [1], "x": "Câu này kiểm tra cách Messages API biểu diễn hội thoại. API là stateless: mỗi request bạn phải gửi lại TOÀN BỘ lịch sử hội thoại trong mảng `messages`, gồm các lượt `user` và `assistant` xen kẽ, mở đầu bằng lượt `user`. System prompt không nằm trong mảng này mà được truyền qua tham số `system` riêng ở top-level.\n\nVí dụ hội thoại nhiều lượt: `\"messages\": [{\"role\": \"user\", \"content\": \"Xin chào\"}, {\"role\": \"assistant\", \"content\": \"Chào bạn!\"}, {\"role\": \"user\", \"content\": \"Giải thích RAG\"}]`. Các lượt assistant trước đó không nhất thiết phải do Claude sinh ra; bạn có thể tự viết (synthetic assistant message) để định hướng. Mảng `messages` là bắt buộc, và nó có thể chứa nhiều message chứ không giới hạn một.\n\nBẫy thường gặp: nghĩ rằng đã có `system` thì không cần `messages`. Thực tế `system` chỉ đặt bối cảnh và vai trò; model vẫn cần ít nhất một lượt user để có gì đó trả lời. Mẹo nhớ: system ở ngoài, messages bắt đầu bằng user và xen kẽ user/assistant, mỗi lần gọi gửi lại toàn bộ lịch sử.", "k": ["messages array", "user/assistant turns", "stateless API", "system prompt"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/working-with-messages", "t": "Using the Messages API", "s": "Multiple conversational turns", "n": "Giải thích API là stateless, phải gửi toàn bộ lịch sử hội thoại và có thể dùng synthetic assistant message."}, {"u": "https://platform.claude.com/docs/en/api/messages", "t": "Messages - Claude API Reference", "s": "Create a Message", "n": "Tham chiếu chính thức về cấu trúc tham số `messages` (role, content) và tham số `system` riêng."}], "f": "Trang working-with-messages hiện hành không còn nhắc rõ quy tắc 'phải bắt đầu bằng user' (chỉ nói message `system` có content không được đứng đầu); ngoài ra prefill lượt assistant cuối không còn được hỗ trợ trên Claude 4.6 trở lên. Khi thi vẫn chọn theo đáp án chuẩn: bắt đầu bằng lượt user.", "ke": ["The array holds the conversation history, beginning with a user message."], "ap": ["D2#3", "M2#20", "PD#51"]}, "Q012": {"d": 2, "sv": "Cặp nào gọi đúng tên sự kiện đầu tiên và sự kiện cuối cùng của một message được stream?", "se": "Which pair correctly names the first and last events of a streamed message?", "oe": ["message_delta and message_start", "ping and error", "content_block_start and content_block_stop", "message_start and message_stop"], "ov": ["`message_delta` và `message_start`", "`ping` và `error`", "`content_block_start` và `content_block_stop`", "`message_start` và `message_stop`"], "on": ["Sai — Thứ tự bị đảo; `message_delta` đến gần cuối (mang `stop_reason`, `usage`), còn `message_start` luôn là sự kiện đầu.", "Sai — `ping` có thể xuất hiện bất kỳ lúc nào để giữ kết nối, `error` chỉ xuất hiện khi có lỗi; không phải mốc đầu và cuối.", "Sai — Đây là ranh giới của từng content block bên trong message, có thể lặp lại nhiều lần trong một stream.", "Đúng — Stream luôn mở bằng `message_start` và kết thúc bằng `message_stop`."], "c": [3], "x": "Câu này kiểm tra thứ tự sự kiện (server-sent events) khi bật `\"stream\": true`. Luồng chuẩn là: `message_start` (chứa object Message ban đầu với `content` rỗng) → với mỗi content block: `content_block_start`, một hoặc nhiều `content_block_delta`, `content_block_stop` → một hoặc nhiều `message_delta` (cập nhật top-level như `stop_reason` và `usage` cộng dồn) → `message_stop`.\n\nVì vậy sự kiện mở đầu là `message_start` và sự kiện kết thúc là `message_stop`. Ví dụ client đơn giản: khi nhận `content_block_delta` có `delta.type == \"text_delta\"` thì nối `delta.text` vào màn hình; khi nhận `message_delta` thì đọc `stop_reason`; khi nhận `message_stop` thì đóng stream. Ngoài ra có thể xuất hiện sự kiện `ping` xen kẽ bất kỳ lúc nào để giữ kết nối, và sự kiện `error` (ví dụ `overloaded_error`) nếu có lỗi giữa chừng.\n\nBẫy thường gặp: chọn `content_block_start` và `content_block_stop` vì chúng cũng là cặp start/stop, nhưng đó là ranh giới của từng content block bên trong message, có thể lặp nhiều lần. `message_delta` đến gần cuối, không phải đầu. Mẹo nhớ: message bọc ngoài cùng, content block nằm bên trong, delta mang nội dung.", "k": ["streaming", "server-sent events", "message_start", "message_stop", "content_block_delta", "message_delta"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/streaming", "t": "Streaming messages", "s": "Event types", "n": "Liệt kê luồng sự kiện: message_start, các sự kiện content block, message_delta và cuối cùng là message_stop."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/streaming", "t": "Streaming messages", "s": "Basic streaming request", "n": "Ví dụ đầy đủ một stream thô với thứ tự các sự kiện thực tế."}], "f": "", "ke": ["A stream opens with message_start, carries content block events and a message_delta, and closes with message_stop."], "ap": ["D2#4", "M1#5"]}, "Q013": {"d": 2, "sv": "Một request thất bại với HTTP 403 và error type `permission_error`. Điều này có nghĩa là gì?", "se": "A request fails with HTTP 403 and error type permission_error. What does it mean?", "oe": ["The request was rate limited", "The API key does not have permission to use the requested resource", "The API is overloaded", "The JSON body is malformed"], "ov": ["Request bị rate limit", "API key không có quyền sử dụng resource được yêu cầu", "API đang quá tải", "JSON body bị sai định dạng"], "on": ["Sai — Rate limit trả về 429 `rate_limit_error`, không phải 403.", "Đúng — 403 `permission_error` nghĩa là API key không có quyền dùng resource được yêu cầu.", "Sai — API quá tải trả về 529 `overloaded_error`.", "Sai — JSON sai định dạng thuộc 400 `invalid_request_error`."], "c": [1], "x": "Câu này kiểm tra bảng mã lỗi HTTP của Claude API. 403 `permission_error` nghĩa là API key của bạn hợp lệ (đã xác thực được) nhưng KHÔNG có quyền sử dụng resource được chỉ định. Tài liệu khuyên kiểm tra quyền truy cập của tổ chức và cấu hình workspace trong Claude Console.\n\nCần phân biệt rõ với 401 `authentication_error`: 401 là vấn đề với chính API key (sai định dạng, bị thu hồi, hết hạn), tức \"bạn là ai thì hệ thống không xác nhận được\"; còn 403 là \"biết bạn là ai nhưng bạn không được phép làm điều này\". Ví dụ thực tế: key thuộc một workspace bị giới hạn không được dùng một model hoặc một tính năng nhất định. Lỗi 403 không nên retry tự động vì có retry bao nhiêu lần cũng sẽ thất bại, cần sửa quyền.\n\nCác mã khác để đối chiếu: 400 `invalid_request_error` (format hoặc nội dung request sai, ví dụ JSON hỏng), 429 `rate_limit_error` (vượt rate limit), 529 `overloaded_error` (API quá tải tạm thời). Mẹo nhớ: 401 = authentication (danh tính), 403 = permission (quyền hạn); chỉ 429, 500, 529 mới là nhóm nên retry với backoff.", "k": ["HTTP errors", "permission_error", "authentication_error", "403 vs 401"], "r": [{"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "HTTP errors", "n": "Bảng mã lỗi chính thức: 403 `permission_error` nghĩa là API key không có quyền dùng resource được chỉ định."}, {"u": "https://support.claude.com/en/articles/9767949-api-key-best-practices-keeping-your-keys-safe-and-secure", "t": "API Key Best Practices: Keeping Your Keys Safe and Secure", "s": "", "n": "Thực hành quản lý API key và phân quyền theo workspace để tránh lỗi quyền truy cập."}], "f": "", "ke": ["403 means the credential is valid but not allowed to access that resource."], "ap": ["D2#5", "PD#19"]}, "Q014": {"d": 2, "sv": "Vì sao nên thêm random jitter vào exponential backoff?", "se": "Why add random jitter to exponential backoff?", "oe": ["So that many clients do not all retry at the same moment", "To skip the retry-after header", "To make retries cheaper", "To make responses more creative"], "ov": ["Để nhiều client không cùng retry vào một thời điểm", "Để bỏ qua header `retry-after`", "Để retry rẻ hơn", "Để response sáng tạo hơn"], "on": ["Đúng — Jitter rải thời điểm retry ngẫu nhiên, tránh các đợt retry đồng loạt làm hệ thống quá tải lần nữa.", "Sai — Jitter không thay thế `retry-after`; khi có header này, client nên chờ ít nhất bằng giá trị được chỉ định.", "Sai — Jitter không thay đổi chi phí mỗi request; nó chỉ thay đổi thời điểm gửi lại.", "Sai — Độ sáng tạo của response do temperature và prompt quyết định, không liên quan đến chiến lược retry."], "c": [0], "x": "Câu này kiểm tra chiến lược retry chuẩn cho lỗi tạm thời như 429 `rate_limit_error` hoặc 529 `overloaded_error`. Exponential backoff tăng thời gian chờ theo cấp số nhân sau mỗi lần thất bại (1s, 2s, 4s, 8s...). Nhưng nếu hàng trăm client cùng gặp lỗi tại một thời điểm và cùng dùng một công thức, chúng sẽ retry đồng loạt tại 1s, 2s, 4s..., tạo ra các đợt burst đồng bộ (thundering herd) khiến hệ thống lại quá tải và lại trả 429.\n\nJitter thêm một khoảng ngẫu nhiên vào thời gian chờ để rải đều các lần retry theo thời gian. Ví dụ \"full jitter\": `sleep = random.uniform(0, min(cap, base * pow(2, attempt)))`. Bài viết của AWS Builders' Library phân tích rằng backoff có jitter giảm đáng kể tranh chấp so với backoff thuần.\n\nBẫy thường gặp: nghĩ jitter dùng để bỏ qua `retry-after`. Ngược lại, khi API trả header `retry-after`, bạn nên tôn trọng nó (chờ ít nhất bằng giá trị đó). Jitter không làm retry rẻ hơn (mỗi request vẫn tính phí như cũ, và request lỗi thì không sinh output) và hoàn toàn không liên quan đến độ sáng tạo của response (đó là temperature). Lưu ý thêm: các SDK chính thức của Anthropic đã tự động retry một số lỗi với exponential backoff.", "k": ["exponential backoff", "jitter", "thundering herd", "retry-after", "rate limit"], "r": [{"u": "https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter", "t": "Timeouts, retries, and backoff with jitter", "s": "", "n": "Phân tích vì sao backoff kèm jitter giúp tránh các đợt retry đồng bộ và giảm tranh chấp tài nguyên."}, {"u": "https://platform.claude.com/docs/en/api/rate-limits", "t": "Rate limits", "s": "", "n": "Mô tả lỗi 429 và header `retry-after` cho biết cần chờ bao lâu trước khi retry."}, {"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "HTTP errors", "n": "Khuyên retry lỗi nội bộ và quá tải với exponential backoff."}], "f": "", "ke": ["Jitter spreads retries out in time, which avoids synchronized bursts that would trigger the limit again."], "ap": ["D2#6", "PD#29"]}, "Q015": {"d": 2, "sv": "Bạn cần Anthropic support hỗ trợ một request bị lỗi. Thông tin nào giúp định danh request đó?", "se": "You need help from Anthropic support with a failing request. Which piece of information identifies it?", "oe": ["The system prompt", "The value of max_tokens", "The request-id response header", "The local time on your server"], "ov": ["System prompt", "Giá trị của `max_tokens`", "Response header `request-id`", "Giờ địa phương trên server của bạn"], "on": ["Sai — Rất nhiều request dùng chung một system prompt, nên nó không định danh được một request cụ thể.", "Sai — `max_tokens` chỉ là tham số giới hạn output, không phải định danh request.", "Đúng — Mỗi response có header `request-id` duy nhất mà support dùng để truy vết request.", "Sai — Giờ server không duy nhất, có thể lệch múi giờ và không đủ để tìm chính xác một request."], "c": [2], "x": "Câu này kiểm tra cách định danh một request để debug và làm việc với support. Mọi response của Claude API đều kèm một header `request-id` duy nhất toàn cục, có dạng `req_018EeWyXxfu5pfWkrYcMdjWG`. Với response lỗi, cùng giá trị đó còn xuất hiện trong trường `request_id` của error body. Khi liên hệ support về một request cụ thể, bạn gửi ID này để họ truy vết chính xác request trong hệ thống phía Anthropic.\n\nTrong code, các SDK Python và TypeScript expose giá trị này qua thuộc tính `_request_id` trên object response, ví dụ `print(message._request_id)`. Thực hành tốt trong production là log `request-id` cho MỌI call (cùng model, `usage`, `stop_reason`, error type) để khi có sự cố bạn có ngay dữ liệu cần thiết, thay vì phải tái hiện lại lỗi.\n\nBẫy thường gặp: nghĩ rằng gửi system prompt hoặc thời điểm gọi là đủ để support tìm ra request. Hàng triệu request có thể dùng cùng system prompt và cùng thời điểm; giờ server của bạn còn có thể lệch múi giờ. `max_tokens` chỉ là tham số cấu hình. Mẹo nhớ: lỗi nào cũng cần \"số vận đơn\", và số vận đơn của Claude API là `request-id`.", "k": ["request-id", "request_id", "debugging", "logging", "support"], "r": [{"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "Request ID", "n": "Mỗi response có header `request-id` duy nhất, cũng xuất hiện trong trường `request_id` của error body; gửi ID này khi liên hệ support."}, {"u": "https://platform.claude.com/docs/en/cli-sdks-libraries/overview", "t": "SDKs, CLI, and libraries", "s": "", "n": "Các SDK chính thức cho phép truy cập request ID từ object response."}], "f": "", "ke": ["Every API response carries a unique request ID that support can use to trace the request."], "ap": ["D2#7", "M1#16", "PD#28"]}, "Q016": {"d": 2, "sv": "Một request thất bại với HTTP 404 và error type `not_found_error`. Nguyên nhân nào có khả năng cao nhất?", "se": "A request fails with HTTP 404 and error type not_found_error. Which cause is most likely?", "oe": ["The model ID or resource in the request does not exist", "The prompt contains unsafe content", "The API is overloaded", "The organization hit its rate limit"], "ov": ["Model ID hoặc resource trong request không tồn tại", "Prompt chứa nội dung không an toàn", "API đang quá tải", "Tổ chức đã chạm rate limit"], "on": ["Đúng — 404 `not_found_error` nghĩa là resource không tồn tại; model ID gõ sai hoặc đã retire là nguyên nhân phổ biến.", "Sai — Nội dung không an toàn không trả về 404; model có thể từ chối trong một response bình thường.", "Sai — API quá tải trả về 529 `overloaded_error`.", "Sai — Chạm rate limit trả về 429 `rate_limit_error`."], "c": [0], "x": "Câu này kiểm tra ý nghĩa của mã 404 `not_found_error`: resource được yêu cầu không tồn tại. Với Claude API, nguyên nhân phổ biến nhất là model ID gõ sai hoặc model đã bị retire, ngoài ra có thể là endpoint path sai hoặc ID của resource khác (file, batch) không tồn tại.\n\nVí dụ: gửi `\"model\": \"claude-sonet-4\"` (thiếu chữ n) hoặc dùng một model ID cũ đã ngừng hoạt động sẽ nhận 404. Cách khắc phục: đối chiếu model ID với trang Models overview, dùng ID chính xác (hoặc alias được hỗ trợ), và theo dõi lịch deprecation để chuyển model kịp thời. Tương tự, gọi `GET /v1/files/{file_id}` với một `file_id` đã bị xóa cũng trả 404. Đây là lỗi phía client nên retry không giúp ích gì; phải sửa request.\n\nBẫy thường gặp: nhầm lẫn giữa các mã lỗi. Quá tải là 529 `overloaded_error`, rate limit là 429 `rate_limit_error`. Nội dung không an toàn không gây ra 404; tùy trường hợp model có thể từ chối trong response bình thường (với các model mới có thể là `stop_reason` dạng `\"refusal\"`), chứ không phải lỗi \"không tìm thấy\". Mẹo nhớ: 404 = \"sai địa chỉ hoặc sai tên\", kiểm tra lại chuỗi model ID và đường dẫn trước tiên.", "k": ["HTTP errors", "not_found_error", "model ID", "model deprecation"], "r": [{"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "HTTP errors", "n": "404 `not_found_error` nghĩa là resource được yêu cầu không tồn tại; kiểm tra endpoint và các resource ID."}, {"u": "https://platform.claude.com/docs/en/models/overview", "t": "Models overview", "s": "", "n": "Danh sách model ID và alias hiện hành để đối chiếu khi gặp lỗi model không tồn tại."}], "f": "", "ke": ["404 means the requested resource was not found; a mistyped or retired model ID is a common cause."], "ap": ["D2#8", "M2#16", "PD#37"]}, "Q017": {"d": 2, "sv": "Ứng dụng của bạn gửi ít request mỗi phút, nhưng mỗi request có prompt rất lớn, và bạn vẫn nhận lỗi 429. Vì sao?", "se": "Your application sends few requests per minute, but each has a very large prompt, and you still receive 429 errors. Why?", "oe": ["The API key is invalid", "Rate limits also apply to tokens per minute, not only to requests per minute", "Large prompts are not allowed", "429 errors are random"], "ov": ["API key không hợp lệ", "Rate limit còn áp dụng cho số token mỗi phút, không chỉ số request mỗi phút", "Prompt lớn không được phép", "Lỗi 429 xảy ra ngẫu nhiên"], "on": ["Sai — API key không hợp lệ trả về 401 `authentication_error`, không phải 429.", "Đúng — Rate limit đo riêng RPM, ITPM và OTPM; prompt lớn có thể vượt input tokens per minute dù số request thấp.", "Sai — Prompt lớn vẫn hợp lệ nếu vừa context window và giới hạn kích thước request; vượt kích thước bytes sẽ là 413.", "Sai — 429 có nguyên nhân cụ thể là vượt một trong các giới hạn rate limit hoặc spend, không phải ngẫu nhiên."], "c": [1], "x": "Câu này kiểm tra cấu trúc rate limit của Claude API. Rate limit được đo riêng theo nhiều chiều cho từng model class: requests per minute (RPM), input tokens per minute (ITPM) và output tokens per minute (OTPM). Vượt BẤT KỲ chiều nào cũng trả về 429 `rate_limit_error`, kèm header `retry-after` cho biết cần chờ bao lâu.\n\nVí dụ: giả sử tổ chức có giới hạn 50 RPM và 30.000 ITPM. Bạn chỉ gửi 5 request mỗi phút nhưng mỗi request 10.000 token input, tổng 50.000 token/phút, vượt ITPM dù RPM còn rất dư. Cách xử lý: đọc các response header như `anthropic-ratelimit-input-tokens-remaining` để biết chiều nào đang cạn; giảm kích thước prompt; dùng prompt caching (với hầu hết model hiện hành, token đọc từ cache không tính vào ITPM); chuyển tác vụ không gấp sang Message Batches API; hoặc nâng usage tier.\n\nBẫy thường gặp: chỉ nghĩ đến số request. API key không hợp lệ trả về 401, không phải 429. Prompt lớn vẫn hợp lệ miễn là vừa context window và giới hạn kích thước request (vượt kích thước bytes thì là 413). 429 không ngẫu nhiên; nó có nguyên nhân cụ thể là một trong các giới hạn bị vượt. Mẹo nhớ: RPM, ITPM, OTPM, ba chiều độc lập, chạm chiều nào cũng 429.", "k": ["rate limit", "RPM", "ITPM", "OTPM", "rate_limit_error", "retry-after"], "r": [{"u": "https://platform.claude.com/docs/en/api/rate-limits", "t": "Rate limits", "s": "Rate limits", "n": "Giải thích rate limit được đo theo RPM, ITPM và OTPM cho từng model class; vượt chiều nào cũng trả 429."}, {"u": "https://platform.claude.com/docs/en/api/rate-limits", "t": "Rate limits", "s": "Response headers", "n": "Các header `anthropic-ratelimit-*` cho biết lượng request và token còn lại để xác định chiều nào đang bị chạm."}, {"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "HTTP errors", "n": "429 `rate_limit_error` nghĩa là tổ chức đã chạm rate limit."}], "f": "", "ke": ["Limits are measured separately for requests and for input and output tokens. Exceeding any one of them returns 429."], "ap": ["D2#9", "PD#9"]}, "Q018": {"d": 2, "sv": "Một request thất bại với HTTP 413 và error type `request_too_large`. Nguyên nhân là gì?", "se": "A request fails with HTTP 413 and error type request_too_large. What is the cause?", "oe": ["The response would be too long", "The model's output limit was reached", "The request body exceeds the maximum allowed size", "The API key has expired"], "ov": ["Response sẽ quá dài", "Đã chạm giới hạn output của model", "Request body vượt kích thước tối đa cho phép", "API key đã hết hạn"], "on": ["Sai — Độ dài response không gây 413; output dài chỉ bị cắt theo `max_tokens`.", "Sai — Chạm giới hạn output vẫn trả HTTP 200 với `stop_reason` là `\"max_tokens\"`, không phải lỗi.", "Đúng — 413 `request_too_large` nghĩa là request vượt số byte tối đa (ví dụ 32 MB với Messages API).", "Sai — API key hết hạn trả về 401 `authentication_error`."], "c": [2], "x": "Câu này kiểm tra ý nghĩa của 413 `request_too_large`: bản thân request vượt quá số BYTE tối đa cho phép. Đây là giới hạn kích thước payload HTTP, khác với giới hạn token. Theo tài liệu, Messages API và Token Counting API giới hạn 32 MB mỗi request, Batch API 256 MB, Files API 500 MB. Trên Claude API trực tiếp, lỗi này thậm chí bị chặn ở tầng Cloudflare trước khi request đến API server.\n\nTình huống điển hình: bạn nhúng nhiều PDF hoặc ảnh dưới dạng base64 vào cùng một request Messages, base64 còn làm dữ liệu phình thêm khoảng 33%, dẫn đến vượt 32 MB. Cách khắc phục: upload file một lần qua Files API rồi tham chiếu bằng `file_id` (ví dụ `{\"type\": \"document\", \"source\": {\"type\": \"file\", \"file_id\": \"file_abc\"}}`), giảm số lượng hoặc độ phân giải ảnh, hoặc chia nhỏ thành nhiều request.\n\nBẫy thường gặp: nhầm 413 với các giới hạn liên quan đến output. Khi model chạm giới hạn output, request vẫn thành công (HTTP 200) với `stop_reason` là `\"max_tokens\"`, không phải lỗi 413. API key hết hạn trả về 401. Mẹo nhớ: 413 = \"gói hàng quá nặng\" (bytes của request), không liên quan đến độ dài câu trả lời.", "k": ["request_too_large", "request size limits", "Files API", "base64", "payload size"], "r": [{"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "Request size limits", "n": "Bảng giới hạn kích thước theo endpoint: Messages 32 MB, Batch 256 MB, Files 500 MB; vượt sẽ nhận 413 `request_too_large`."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/files", "t": "Files API", "s": "", "n": "Hướng dẫn upload file một lần và tham chiếu bằng `file_id` để giảm kích thước request."}], "f": "", "ke": ["413 means the request itself is too large in bytes. Reduce the payload, for example by referencing files through the Files API."], "ap": ["D2#10", "M2#19", "PD#11"]}, "Q019": {"d": 3, "sv": "Team của bạn muốn có một lệnh `/review` dùng lại được trong Claude Code, chạy cùng một prompt review cho mọi người mở repository. Bạn cung cấp nó bằng cách nào?", "se": "Your team wants a reusable /review command in Claude Code that runs the same review prompt for everyone who opens the repository. How do you provide it?", "oe": ["Ask each person to type the full prompt every time", "Add a Markdown file for the command under .claude/commands/ in the repository", "Put the prompt in package.json", "Rename README.md to review.md"], "ov": ["Yêu cầu mỗi người tự gõ toàn bộ prompt mỗi lần", "Thêm một file Markdown cho lệnh đó trong `.claude/commands/` của repository", "Đặt prompt vào `package.json`", "Đổi tên `README.md` thành `review.md`"], "on": ["Sai — Gõ tay mỗi lần không tái sử dụng được và dễ khiến mỗi người dùng một phiên bản prompt khác nhau.", "Đúng — File Markdown trong `.claude/commands/` trở thành slash command cấp project, chia sẻ cho cả team qua version control.", "Sai — Claude Code không đọc prompt hay slash command từ `package.json`.", "Sai — Đổi tên `README.md` không tạo ra slash command nào; lệnh phải nằm trong thư mục `.claude/commands/`."], "c": [1], "x": "Câu này kiểm tra cơ chế custom slash command cấp project trong Claude Code. Mỗi file Markdown đặt trong `.claude/commands/` ở gốc repository trở thành một slash command, tên lệnh lấy theo tên file. Ví dụ file `.claude/commands/review.md` tạo ra lệnh `/review`. Vì thư mục này nằm trong repo và được commit vào version control, mọi thành viên clone repo đều có cùng lệnh, cùng prompt.\n\nNội dung file chính là prompt, có thể kèm frontmatter (ví dụ `description`, `allowed-tools`) và placeholder `$ARGUMENTS` để nhận tham số. Ví dụ: \"Review the staged changes for security issues, performance problems and style violations. Focus on: $ARGUMENTS\". Khi gõ `/review auth module`, Claude nhận prompt đã thay `$ARGUMENTS` bằng \"auth module\". Lệnh cá nhân (chỉ dùng cho riêng bạn ở mọi project) thì đặt trong `~/.claude/commands/`.\n\nBẫy thường gặp: chọn các cách không có cơ chế nào trong Claude Code đọc tới, như `package.json` hay đổi tên `README.md`. Bắt mỗi người tự gõ prompt thì không nhất quán và không tái sử dụng được. Mẹo nhớ: project = `.claude/` trong repo (chia sẻ qua git), personal = `~/.claude/` trong thư mục home.", "k": ["custom slash commands", ".claude/commands/", "$ARGUMENTS", "skills", "version control"], "r": [{"u": "https://code.claude.com/docs/en/commands", "t": "Commands", "s": "Where skills live", "n": "Mô tả file Markdown trong `.claude/commands/` tạo slash command; định dạng này vẫn hoạt động, song song với skills."}, {"u": "https://code.claude.com/docs/en/skills", "t": "Extend Claude with skills", "s": "", "n": "Tài liệu skills, định dạng mới tương đương custom command với thư mục `.claude/skills/<tên>/SKILL.md`."}], "f": "Tài liệu Claude Code hiện hành cho biết custom commands đã được gộp vào skills: `.claude/commands/review.md` và `.claude/skills/review/SKILL.md` đều tạo `/review` và hoạt động như nhau; `.claude/commands/` vẫn dùng được nhưng được coi là định dạng cũ, khuyến nghị dùng skill cho việc mới. Khi thi vẫn chọn `.claude/commands/`.", "ke": ["Project slash commands are Markdown files in .claude/commands/, shared with the team through version control."], "ap": ["D3#1", "PD#2"]}, "Q020": {"d": 3, "sv": "Team của bạn muốn Claude Code của mọi người đều kết nối tới cùng một integration với issue tracker khi mở repository. Việc đó được chia sẻ như thế nào?", "se": "Your team wants everyone's Claude Code to connect to the same issue tracker integration when they open the repository. How is that shared?", "oe": ["Configure the MCP server in a project-level .mcp.json checked into the repository", "Each person pastes the API documentation into chat", "It cannot be shared", "Add the tracker URL to README.md"], "ov": ["Cấu hình MCP server trong file `.mcp.json` cấp project và commit vào repository", "Mỗi người dán tài liệu API vào chat", "Không thể chia sẻ được", "Thêm URL của tracker vào `README.md`"], "on": ["Đúng — MCP server project scope được khai báo trong `.mcp.json` ở gốc repo và chia sẻ cho team qua version control.", "Sai — Dán tài liệu chỉ cung cấp thông tin, không tạo tool kết nối thật, và phải lặp lại ở mỗi phiên.", "Sai — Claude Code hỗ trợ chia sẻ MCP server qua project scope với file `.mcp.json`.", "Sai — `README.md` không phải file cấu hình; Claude Code không tự kết nối tới URL ghi trong đó."], "c": [0], "x": "Câu này kiểm tra các installation scope của MCP server trong Claude Code. Có ba scope: local (chỉ bạn, project hiện tại, lưu trong `~/.claude.json`), project (cả team, lưu trong `.mcp.json` ở gốc project và commit vào version control), và user (chỉ bạn nhưng dùng cho mọi project, lưu trong `~/.claude.json`).\n\nMuốn cả team cùng có integration với issue tracker thì dùng project scope. Lệnh: `claude mcp add --transport http tracker --scope project https://tracker.example.com/mcp`. Claude Code tự tạo hoặc cập nhật `.mcp.json` dạng `{\"mcpServers\": {\"tracker\": {\"type\": \"http\", \"url\": \"https://tracker.example.com/mcp\"}}}`, sau đó bạn commit file này. Lưu ý bảo mật: vì `.mcp.json` đến từ repo, Claude Code sẽ hỏi phê duyệt trong phiên interactive trước khi dùng server project-scoped (có thể reset bằng `claude mcp reset-project-choices`). Không nên ghi secret trực tiếp vào file; dùng biến môi trường (`.mcp.json` hỗ trợ cú pháp `${VAR}`).\n\nBẫy thường gặp: dán tài liệu API vào chat chỉ cho Claude \"biết\" về API chứ không cho nó tool để gọi, và phải lặp lại mỗi phiên. Ghi URL vào `README.md` không cấu hình gì cả. Mẹo nhớ: thứ gì muốn chia sẻ cho team trong Claude Code thì đặt trong repo: `CLAUDE.md`, `.claude/settings.json`, `.claude/commands/`, `.mcp.json`.", "k": ["MCP", "MCP server", ".mcp.json", "project scope", "installation scopes"], "r": [{"u": "https://code.claude.com/docs/en/mcp", "t": "Connect Claude Code to tools via MCP", "s": "MCP installation scopes", "n": "Bảng ba scope local, project, user; project scope lưu trong `.mcp.json` ở gốc project và chia sẻ qua version control."}, {"u": "https://modelcontextprotocol.io/docs/learn/architecture", "t": "Architecture overview", "s": "", "n": "Giải thích kiến trúc host, client, server của MCP, nền tảng để Claude Code kết nối tới các integration bên ngoài."}], "f": "", "ke": ["Project-scoped MCP servers are declared in .mcp.json, which the team shares through version control."], "ap": ["D3#2", "PD#17"]}, "Q021": {"d": 3, "sv": "Claude Code hỏi xin phép mỗi lần muốn chạy `npm test`, và bạn muốn riêng lệnh đó chạy mà không cần hỏi. Thay đổi phù hợp là gì?", "se": "Claude Code asks for permission every time it wants to run npm test, and you want that one command to run without a prompt. What is the appropriate change?", "oe": ["Run Claude Code as administrator", "Turn off every permission check", "Delete CLAUDE.md", "Add an allow rule for that command in the Claude Code permission settings"], "ov": ["Chạy Claude Code với quyền administrator", "Tắt mọi kiểm tra permission", "Xóa `CLAUDE.md`", "Thêm một allow rule cho lệnh đó trong permission settings của Claude Code"], "on": ["Sai — Quyền administrator của hệ điều hành không liên quan đến permission prompt của Claude Code và còn tăng rủi ro.", "Sai — Tắt mọi kiểm tra vi phạm least privilege, cho phép cả lệnh nguy hiểm chạy mà không hỏi.", "Sai — `CLAUDE.md` là file memory chứa hướng dẫn, không điều khiển permission.", "Đúng — Allow rule như `Bash(npm test)` cho phép đúng lệnh đó chạy không cần hỏi, các lệnh khác vẫn được kiểm soát."], "c": [3], "x": "Câu này kiểm tra hệ thống permission của Claude Code và nguyên tắc least privilege. Claude Code cho phép khai báo permission rule chi tiết theo tool và theo pattern lệnh: `allow` (chạy không cần hỏi), `ask` (luôn hỏi) và `deny` (cấm). Cách đúng là chỉ cho phép đúng lệnh an toàn cần thiết, mọi thứ khác vẫn giữ nguyên prompt.\n\nVí dụ trong `.claude/settings.json` (chia sẻ cho team) hoặc `.claude/settings.local.json` (chỉ riêng bạn): `{\"permissions\": {\"allow\": [\"Bash(npm test)\"]}}`. Có thể dùng wildcard để cho phép cả các biến thể có tham số, ví dụ `\"Bash(npm run test *)\"`. Bạn cũng có thể thêm rule qua lệnh `/permissions` hoặc chọn tùy chọn \"don't ask again\" ngay tại prompt xin phép.\n\nBẫy thường gặp: chọn giải pháp \"mạnh tay\" như tắt mọi kiểm tra permission (chế độ `bypassPermissions`) hoặc chạy với quyền administrator. Cả hai đều mở rộng quyền vượt xa nhu cầu, cho phép Claude chạy cả lệnh nguy hiểm như `rm -rf` hay `git push --force` mà không hỏi, vi phạm least privilege. Xóa `CLAUDE.md` không liên quan, vì `CLAUDE.md` là file memory chứa hướng dẫn cho Claude, không điều khiển permission. Mẹo nhớ: allow cụ thể, giữ prompt cho phần còn lại.", "k": ["permissions", "allow rule", "least privilege", "settings.json", "/permissions"], "r": [{"u": "https://code.claude.com/docs/en/settings", "t": "Settings files and precedence", "s": "Edit a settings file", "n": "Ví dụ khai báo `permissions.allow` với các rule như `Bash(npm run lint)` và `Bash(npm run test *)` trong file settings."}, {"u": "https://code.claude.com/docs/en/settings", "t": "Settings files and precedence", "s": "Settings files and who they affect", "n": "Phân biệt `.claude/settings.json` (chia sẻ team), `.claude/settings.local.json` (cá nhân, theo project) và `~/.claude/settings.json` (user)."}, {"u": "https://code.claude.com/docs/en/best-practices", "t": "Best practices for Claude Code", "s": "", "n": "Khuyên tùy chỉnh danh sách allowed tools để giảm prompt cho các thao tác an toàn mà vẫn giữ kiểm soát."}], "f": "Cú pháp wildcard trong tài liệu hiện hành dùng dạng `Bash(npm run test *)`; nhiều tài liệu cũ dùng dạng `Bash(npm run test:*)`.", "ke": ["Permission rules let you allow specific safe commands while keeping prompts for everything else."], "ap": ["D3#3", "M1#12"]}, "Q022": {"d": 3, "sv": "Plan mode trong Claude Code làm gì?", "se": "What does plan mode do in Claude Code?", "oe": ["Claude switches to a smaller model", "Claude explores and proposes a plan without changing files until you approve it", "Claude disables all tools", "Claude commits and pushes every change automatically"], "ov": ["Claude chuyển sang một model nhỏ hơn", "Claude khám phá codebase và đề xuất kế hoạch mà không thay đổi file cho đến khi bạn phê duyệt", "Claude vô hiệu hóa tất cả tool", "Claude tự động commit và push mọi thay đổi"], "on": ["Sai — Plan mode là một permission mode, không thay đổi model đang dùng.", "Đúng — Claude nghiên cứu ở chế độ read-only và đề xuất kế hoạch, chỉ thay đổi file sau khi bạn phê duyệt.", "Sai — Claude vẫn dùng các tool đọc như Read, Grep, Glob để khám phá; chỉ các thao tác ghi bị chặn.", "Sai — Plan mode làm điều ngược lại: không thay đổi gì, càng không tự commit hay push."], "c": [1], "x": "Câu này kiểm tra permission mode \"plan\" của Claude Code. Trong plan mode, Claude chỉ thực hiện các thao tác read-only (đọc file, tìm kiếm, phân tích codebase) để nghiên cứu vấn đề, rồi trình bày một kế hoạch. Claude không sửa file và không chạy lệnh làm thay đổi hệ thống cho đến khi bạn duyệt kế hoạch và thoát plan mode.\n\nLợi ích chính là tách giai đoạn research và planning khỏi giai đoạn execution, đúng với workflow \"explore, plan, code, commit\" mà Anthropic khuyến nghị. Plan mode đặc biệt hữu ích trước các thay đổi lớn hoặc rủi ro: refactor nhiều file, migration, hoặc khi làm việc với codebase lạ. Cách bật: nhấn Shift+Tab để chuyển vòng qua các permission mode trong phiên interactive, hoặc khởi động bằng `claude --permission-mode plan`; cũng có thể đặt `\"defaultMode\": \"plan\"` trong settings. Ví dụ: \"Refactor module auth sang JWT\" → Claude đọc các file liên quan, liệt kê các file sẽ sửa và các bước, bạn chỉnh kế hoạch, rồi mới cho thực thi.\n\nBẫy thường gặp: nghĩ plan mode tắt hết tool. Thực tế Claude vẫn dùng các tool đọc như Read, Grep, Glob để khám phá; chỉ các thao tác ghi bị chặn. Plan mode cũng không đổi model và càng không tự commit hay push. Mẹo nhớ: plan mode = \"nhìn nhưng không chạm\" cho đến khi được duyệt.", "k": ["plan mode", "permission modes", "read-only", "explore-plan-code-commit"], "r": [{"u": "https://code.claude.com/docs/en/common-workflows", "t": "Common workflows", "s": "Use Plan Mode for safe code analysis", "n": "Hướng dẫn bật plan mode, khi nào nên dùng và cách Claude phân tích read-only rồi đề xuất kế hoạch."}, {"u": "https://code.claude.com/docs/en/best-practices", "t": "Best practices for Claude Code", "s": "", "n": "Khuyến nghị workflow explore, plan, code, commit: yêu cầu Claude nghiên cứu và lập kế hoạch trước khi viết code."}], "f": "", "ke": ["Plan mode separates research and planning from execution, which is useful before large or risky changes."], "ap": ["D3#4", "M2#14"]}, "Q023": {"d": 3, "sv": "Một phiên Claude Code dài đang tiến gần giới hạn context, nhưng bạn muốn tiếp tục cùng tác vụ. Lệnh nào giúp được?", "se": "A long Claude Code session is approaching the context limit, but you want to continue the same task. Which command helps?", "oe": ["/init", "/compact, which summarizes the conversation so far", "/exit", "/clear, which keeps everything"], "ov": ["`/init`", "`/compact`, lệnh tóm tắt cuộc hội thoại tính đến hiện tại", "`/exit`", "`/clear`, lệnh giữ lại mọi thứ"], "on": ["Sai — `/init` khởi tạo file `CLAUDE.md` cho project, không giải phóng context.", "Đúng — `/compact` tóm tắt hội thoại để giải phóng context mà vẫn giữ thông tin cốt lõi, cho phép tiếp tục cùng tác vụ.", "Sai — `/exit` thoát khỏi phiên, khiến bạn mất mạch làm việc hiện tại.", "Sai — `/clear` xóa toàn bộ lịch sử hội thoại chứ không giữ lại gì; mô tả trong phương án này là sai."], "c": [1], "x": "Câu này kiểm tra cách quản lý context window trong Claude Code. Lệnh `/compact` thay lịch sử hội thoại bằng một bản tóm tắt, giữ lại những thông tin quan trọng (mục tiêu, quyết định đã đưa ra, file đã sửa, việc còn dang dở) nhưng giải phóng phần lớn context để tiếp tục làm việc. Bạn có thể kèm hướng dẫn tập trung, ví dụ `/compact Focus on the API changes and failing tests`, để bản tóm tắt giữ đúng những gì bạn cần. Claude Code cũng có auto-compact tự kích hoạt khi context gần đầy.\n\nPhân biệt với `/clear`: lệnh này XÓA toàn bộ lịch sử hội thoại để bắt đầu lại từ đầu, phù hợp khi chuyển sang một tác vụ không liên quan, chứ không \"giữ lại mọi thứ\" như phương án D mô tả. Nếu dùng `/clear` khi đang làm dở, Claude sẽ mất hết ngữ cảnh của tác vụ. `/init` dùng để tạo file `CLAUDE.md` ban đầu cho project, còn `/exit` thoát khỏi Claude Code.\n\nBẫy thường gặp: phương án D cố tình mô tả sai `/clear` để đánh lừa. Mẹo nhớ: compact = nén (tiếp tục cùng tác vụ), clear = xóa trắng (đổi tác vụ). Thực hành tốt: dùng `/clear` thường xuyên giữa các tác vụ khác nhau, và `/compact` khi muốn kéo dài một tác vụ lớn.", "k": ["/compact", "/clear", "context window", "auto-compact", "context management"], "r": [{"u": "https://code.claude.com/docs/en/interactive-mode", "t": "Interactive mode", "s": "", "n": "Tài liệu chế độ interactive của Claude Code, bao gồm các lệnh built-in quản lý phiên như `/compact` và `/clear`."}, {"u": "https://code.claude.com/docs/en/best-practices", "t": "Best practices for Claude Code", "s": "", "n": "Khuyên dùng `/clear` thường xuyên giữa các tác vụ để giữ context gọn và tập trung."}, {"u": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", "t": "Effective context engineering for AI agents", "s": "", "n": "Giải thích compaction như một kỹ thuật tóm tắt lịch sử để agent làm việc lâu dài trong giới hạn context."}], "f": "", "ke": ["/compact replaces the history with a summary so work can continue with more room; /clear discards the history entirely."], "ap": ["D3#5"]}, "Q024": {"d": 4, "sv": "Một bộ evaluation cho trợ lý chăm sóc khách hàng nên chứa những gì?", "se": "What should an evaluation set for a customer-support assistant contain?", "oe": ["Random strings", "A single example", "Only the easiest questions, so the score looks good", "Inputs that reflect real traffic, including edge cases and difficult or adversarial requests"], "ov": ["Các chuỗi ký tự ngẫu nhiên", "Một ví dụ duy nhất", "Chỉ những câu hỏi dễ nhất, để điểm số trông đẹp", "Các input phản ánh traffic thực tế, bao gồm edge case và các request khó hoặc mang tính adversarial"], "on": ["Sai — Chuỗi ngẫu nhiên không phản ánh cách khách hàng thật sử dụng sản phẩm, nên không đo được chất lượng thực tế.", "Sai — Một ví dụ không có ý nghĩa thống kê và không bao phủ được các dạng request khác nhau.", "Sai — Chỉ chọn câu dễ làm điểm số ảo, che giấu những lỗi sẽ xuất hiện trong production.", "Đúng — Eval phải mô phỏng traffic thật và bao gồm edge case, request khó và adversarial, nơi model dễ thất bại nhất."], "c": [3], "x": "Câu này kiểm tra nguyên tắc thiết kế eval: bộ eval phải đặc thù cho tác vụ (task-specific) và phản ánh phân phối dữ liệu thực tế. Tài liệu \"Develop tests\" của Anthropic nhấn mạnh việc thiết kế eval mô phỏng phân phối tác vụ thực, đồng thời bao gồm edge case, vì đó là nơi model dễ thất bại nhất.\n\nVới trợ lý chăm sóc khách hàng, bộ eval tốt nên gồm: câu hỏi phổ biến lấy từ log ticket thật (đổi trả hàng, tra đơn, đổi mật khẩu); edge case (input rỗng, câu hỏi đa ngôn ngữ, khách hỏi nhiều việc trong một tin nhắn, dữ liệu mơ hồ)
