g đọc, mục đích và một kết quả tốt trông như thế nào, như khi bạn giao việc cho một đồng nghiệp mới", "Chuyển sang một ngôn ngữ khác"], "on": ["Sai — gửi lại cùng một prompt mơ hồ vẫn cho kết quả dao động, không giải quyết gốc rễ.", "Sai — từ ngữ lịch sự không bổ sung thông tin về mục tiêu hay tiêu chí, nên không cải thiện độ nhất quán.", "Đúng — cung cấp đối tượng, mục đích và tiêu chí thành công cụ thể giúp Claude hiểu đúng yêu cầu và cho kết quả ổn định.", "Sai — đổi ngôn ngữ không làm yêu cầu rõ ràng hơn; prompt vẫn thiếu ngữ cảnh."], "c": [2], "x": "Nguyên tắc \"be clear and direct\" của Anthropic: hãy coi Claude như một nhân viên mới rất giỏi nhưng chưa biết gì về bối cảnh của bạn. \"Make this report better\" mơ hồ vì \"tốt hơn\" có thể là ngắn hơn, trang trọng hơn, nhiều số liệu hơn hay dễ đọc hơn — mỗi lần chạy Claude đoán một kiểu, dẫn đến kết quả không nhất quán. Một bài kiểm tra hữu ích: đưa prompt cho một đồng nghiệp không biết gì về dự án; nếu họ bối rối thì Claude cũng vậy.\n\nVí dụ prompt tốt hơn: \"Báo cáo này sẽ gửi cho ban giám đốc (không chuyên kỹ thuật) để quyết định có mở rộng dự án hay không. Hãy viết lại sao cho: mở đầu bằng khuyến nghị trong 2 câu, giữ tối đa 1 trang, thay thuật ngữ kỹ thuật bằng ngôn ngữ kinh doanh, nêu rõ chi phí và rủi ro.\" Prompt này nêu đối tượng, mục đích, tiêu chí thành công và định dạng mong muốn.\n\nBẫy thường gặp: nghĩ rằng lịch sự (\"please\") hay lặp lại prompt sẽ cải thiện chất lượng — chúng không bổ sung thông tin nào. Đổi ngôn ngữ cũng không giải quyết sự mơ hồ. Mẹo nhớ: thiếu nhất quán thường do thiếu ngữ cảnh và tiêu chí, không phải do cách diễn đạt.", "k": ["be clear and direct", "context", "success criteria", "prompt engineering"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#be-clear-and-direct", "t": "Prompting best practices — Be clear and direct", "s": "", "n": "Khuyến nghị cung cấp ngữ cảnh (mục đích, đối tượng, kết quả mong muốn) như khi giao việc cho nhân viên mới."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "t": "Prompting best practices", "s": "", "n": "Tổng hợp nguyên tắc viết chỉ dẫn rõ ràng, cụ thể và giải thích lý do đằng sau yêu cầu."}], "f": "", "ke": [], "ap": ["PA#32", "PB#33"]}, "Q126": {"d": 5, "sv": "Một job offline chạy hằng đêm gửi 50.000 request, tất cả dùng chung một đoạn chỉ dẫn dài. HAI tính năng nào giảm chi phí nhiều nhất?", "se": "A nightly offline job sends 50,000 requests that all share the same long instructions. Which TWO features reduce its cost the most?", "oe": ["Streaming", "The Message Batches API", "A larger max_tokens", "Prompt caching on the shared instructions", "The most capable model tier"], "ov": ["Streaming", "Message Batches API", "`max_tokens` lớn hơn", "Prompt caching trên phần chỉ dẫn dùng chung", "Model tier mạnh nhất"], "on": ["Sai — streaming giúp nhận output dần và tránh timeout, không làm giảm giá token.", "Đúng — Message Batches API giảm 50% chi phí cho tác vụ bất đồng bộ không cần kết quả ngay, rất hợp với job offline.", "Sai — `max_tokens` lớn hơn chỉ cho phép output dài hơn, không tiết kiệm chi phí.", "Đúng — cache phần chỉ dẫn chung giúp các request sau chỉ trả giá cache read rẻ hơn rất nhiều so với input thường.", "Sai — model tier mạnh nhất có đơn giá cao nhất, làm chi phí tăng chứ không giảm."], "c": [1, 3], "x": "Câu hỏi kiểm tra việc nhận diện hai đòn bẩy chi phí chính khi xử lý khối lượng lớn. Thứ nhất, Message Batches API: gửi request bất đồng bộ, kết quả trả về trong vòng tối đa 24 giờ (thường nhanh hơn), đổi lại giảm 50% giá cả input lẫn output. Job chạy đêm không cần phản hồi tức thì nên rất phù hợp. Thứ hai, prompt caching: phần chỉ dẫn dài giống hệt nhau ở 50.000 request được cache, các request sau chỉ trả giá cache read (khoảng 0.1x input cơ bản).\n\nHai tính năng có thể kết hợp: mỗi request trong batch đặt `cache_control` ở cuối phần chỉ dẫn chung. Ví dụ chỉ dẫn 10.000 token × 50.000 request = 500 triệu token input; với cache hit phần lớn sẽ chỉ tính khoảng 10% giá, cộng thêm mức giảm 50% của batch. Lưu ý batch xử lý không theo thứ tự nên tỷ lệ cache hit không đảm bảo 100%; có thể dùng TTL 1 giờ để tăng khả năng hit.\n\nBẫy thường gặp: streaming chỉ cải thiện trải nghiệm hiển thị và tránh timeout, không giảm giá. Tăng `max_tokens` không giảm chi phí. Model mạnh nhất còn đắt hơn — với tác vụ lặp lại nên cân nhắc model nhỏ hơn. Mẹo nhớ: \"offline + lặp lại = Batch + Cache\".", "k": ["Message Batches API", "prompt caching", "cost optimization", "batch discount"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/batch-processing", "t": "Batch processing", "s": "", "n": "Mô tả Message Batches API xử lý bất đồng bộ với chi phí giảm 50%, và có thể kết hợp với prompt caching."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "t": "Prompt caching", "s": "Pricing", "n": "Cache read chỉ bằng một phần nhỏ giá input cơ bản, phù hợp với chỉ dẫn dùng chung lặp lại nhiều lần."}, {"u": "https://platform.claude.com/docs/en/about-claude/pricing", "t": "Pricing", "s": "", "n": "Bảng giá chính thức nêu mức giảm giá của batch processing và giá cache theo model."}], "f": "", "ke": [], "ap": ["PA#33", "PB#45", "PC#36"]}, "Q127": {"d": 8, "sv": "Một MCP server chạy như một subprocess cục bộ do client khởi chạy trên cùng máy. Transport nào là lựa chọn chuẩn?", "se": "An MCP server runs as a local subprocess launched by the client on the same machine. Which transport is the standard choice?", "oe": ["stdio", "SMTP", "Streamable HTTP", "FTP"], "ov": ["stdio", "SMTP", "Streamable HTTP", "FTP"], "on": ["Đúng — stdio là transport chuẩn khi client spawn server như subprocess cục bộ, trao đổi JSON-RPC qua stdin/stdout.", "Sai — SMTP là giao thức gửi email, không phải transport của MCP.", "Sai — Streamable HTTP dành cho server chạy độc lập/remote phục vụ qua mạng, không phải lựa chọn chuẩn cho subprocess cục bộ.", "Sai — FTP là giao thức truyền file, MCP không định nghĩa transport này."], "c": [0], "x": "Đặc tả MCP định nghĩa hai transport chuẩn: stdio và Streamable HTTP. Với stdio, client khởi chạy MCP server như một subprocess; client ghi các message JSON-RPC vào stdin của server và đọc phản hồi từ stdout (mỗi message trên một dòng, phân tách bằng newline). stderr có thể dùng cho log. Đây là lựa chọn tự nhiên cho server cục bộ: không cần mở cổng mạng, không cần cấu hình xác thực HTTP, độ trễ thấp, và vòng đời server gắn với client.\n\nVí dụ cấu hình trong Claude Code: `claude mcp add my-db -- npx -y @example/db-mcp-server` — Claude Code sẽ spawn tiến trình này và giao tiếp qua stdio. Tương tự, Claude Desktop khai báo server trong file cấu hình với `command` và `args`.\n\nBẫy thường gặp: chọn Streamable HTTP. Transport này dành cho server chạy như một tiến trình độc lập, thường là remote, phục vụ nhiều client qua HTTP POST/GET (có thể dùng SSE để stream) — phù hợp cho server dùng chung trên mạng, không phải subprocess cục bộ. SMTP và FTP là giao thức email và truyền file, không phải transport của MCP. Mẹo nhớ: \"local subprocess → stdio; remote service → Streamable HTTP\".", "k": ["MCP", "transport", "stdio", "Streamable HTTP", "JSON-RPC"], "r": [{"u": "https://modelcontextprotocol.io/specification/2025-06-18/basic/transports", "t": "Transports (MCP spec 2025-06-18)", "s": "stdio", "n": "Đặc tả transport stdio: client khởi chạy server như subprocess, trao đổi JSON-RPC qua stdin/stdout."}, {"u": "https://modelcontextprotocol.io/docs/learn/architecture", "t": "Architecture overview", "s": "", "n": "Giải thích tầng transport của MCP với hai cơ chế stdio (cục bộ) và Streamable HTTP (từ xa)."}, {"u": "https://code.claude.com/docs/en/mcp", "t": "Connect Claude Code to tools via MCP", "s": "", "n": "Hướng dẫn thêm MCP server vào Claude Code với transport stdio cho server cục bộ và HTTP cho server từ xa."}], "f": "", "ke": [], "ap": ["PA#34", "PB#27", "PC#28"]}, "Q128": {"d": 7, "sv": "Một front-end developer muốn gọi Claude API trực tiếp từ JavaScript trên trình duyệt bằng API key của công ty. Lời khuyên đúng là gì?", "se": "A front-end developer wants to call the Claude API directly from browser JavaScript using the company API key. What is the right advice?", "oe": ["Embed the key in the JavaScript bundle but minify the code", "Store the key in localStorage", "Call the API from a backend service and keep the key in an environment variable or secret manager", "Put the key in the system prompt"], "ov": ["Nhúng key vào JavaScript bundle nhưng minify code", "Lưu key trong `localStorage`", "Gọi API từ một backend service và giữ key trong biến môi trường hoặc secret manager", "Đặt key vào system prompt"], "on": ["Sai — minify không che giấu được chuỗi key; ai cũng có thể đọc bundle hoặc xem request trong DevTools.", "Sai — `localStorage` nằm hoàn toàn phía client, người dùng và mã XSS đều đọc được.", "Đúng — backend giữ key trong biến môi trường hoặc secret manager, trình duyệt chỉ gọi backend nên key không bao giờ bị lộ.", "Sai — key xác thực qua header `x-api-key`, đặt trong system prompt vô ích và có nguy cơ bị model làm lộ."], "c": [2], "x": "Nguyên tắc bảo mật cơ bản: mọi thứ gửi xuống trình duyệt đều có thể bị người dùng đọc được. Nếu API key nằm trong code front-end, bất kỳ ai mở DevTools (tab Network hoặc Sources) đều lấy được key và dùng nó để gọi API bằng tài khoản công ty — gây mất tiền, cạn rate limit, thậm chí lạm dụng vi phạm chính sách dưới danh nghĩa tổ chức của bạn.\n\nKiến trúc đúng: trình duyệt gọi endpoint backend của bạn (ví dụ `POST /api/chat`), backend xác thực người dùng, áp quota/rate limit riêng, rồi mới gọi Claude API với key đọc từ biến môi trường như `ANTHROPIC_API_KEY` hoặc từ secret manager (AWS Secrets Manager, GCP Secret Manager, Vault). Key không bao giờ rời khỏi server. Bổ sung: dùng key riêng cho từng môi trường, xoay vòng (rotate) định kỳ, không commit key vào git, giám sát usage.\n\nBẫy thường gặp: nghĩ minify hay obfuscate là đủ — chuỗi key vẫn nằm nguyên trong bundle và request mạng. `localStorage` cũng hoàn toàn đọc được từ phía client và dễ bị XSS đánh cắp. Đặt key vào system prompt thì không chỉ vô nghĩa (key xác thực qua header `x-api-key`) mà còn có nguy cơ bị lộ qua output của model. Mẹo nhớ: \"key chỉ sống ở server\".", "k": ["API key security", "backend proxy", "secret manager", "environment variables"], "r": [{"u": "https://support.claude.com/en/articles/9767949-api-key-best-practices-keeping-your-keys-safe-and-secure", "t": "API Key Best Practices: Keeping Your Keys Safe and Secure", "s": "", "n": "Best practice bảo vệ API key: không nhúng vào code phía client, dùng biến môi trường hoặc secret manager, không commit vào repo."}, {"u": "https://genai.owasp.org/llm-top-10/", "t": "OWASP Top 10 for LLM Applications 2025 (LLMRisks Archive - OWASP Gen AI Security Project)", "s": "", "n": "Danh sách rủi ro bảo mật ứng dụng LLM, bao gồm việc lộ thông tin nhạy cảm."}], "f": "", "ke": [], "ap": ["PA#35", "PB#48", "PC#8"]}, "Q129": {"d": 1, "sv": "Trong một agent loop, response trả về có `stop_reason: \"end_turn\"` và không có lời gọi tool nào. Điều đó có nghĩa là gì?", "se": "In an agent loop, a response arrives with stop_reason: \"end_turn\" and no tool calls. What does it mean?", "oe": ["Claude finished its response naturally; the loop can stop", "The output was truncated", "A tool call failed", "The request was rate limited"], "ov": ["Claude đã hoàn thành câu trả lời một cách tự nhiên; vòng lặp có thể dừng", "Output bị cắt ngang", "Một lời gọi tool đã thất bại", "Request bị rate limit"], "on": ["Đúng — `end_turn` nghĩa là Claude kết thúc tự nhiên, không còn yêu cầu tool, nên agent loop có thể dừng và trả kết quả.", "Sai — output bị cắt sẽ có `stop_reason: \"max_tokens\"`.", "Sai — lỗi tool do ứng dụng xử lý và báo lại qua `tool_result` với `is_error`, không tạo `stop_reason` riêng.", "Sai — rate limit trả về lỗi HTTP 429 (`rate_limit_error`), không phải response với `end_turn`."], "c": [0], "x": "`stop_reason: \"end_turn\"` là trạng thái kết thúc bình thường: Claude đã nói xong điều cần nói và tự dừng tại điểm kết thúc tự nhiên. Trong một agent loop, đây chính là tín hiệu thoát vòng lặp — không còn tool nào cần chạy, câu trả lời cuối cùng nằm trong các block `text` của `content`.\n\nKhung vòng lặp điển hình:\n`while True: resp = call_api(messages); if resp.stop_reason == \"tool_use\": chạy tool, append tool_result, continue; elif resp.stop_reason == \"end_turn\": trả kết quả, break; elif resp.stop_reason == \"max_tokens\": xử lý output bị cắt`\nNên kết hợp thêm điều kiện dừng an toàn như số vòng tối đa để tránh lặp vô hạn.\n\nBẫy thường gặp: nhầm các trạng thái với nhau. Output bị cắt có `stop_reason: \"max_tokens\"`. Tool thất bại không tạo ra `stop_reason` riêng — ứng dụng của bạn chạy tool, nên lỗi được báo lại cho Claude bằng `tool_result` có `\"is_error\": true`. Rate limit không trả về response với `stop_reason` mà trả HTTP 429 `rate_limit_error`. Mẹo nhớ: \"`end_turn` = xong lượt; `tool_use` = chờ tool; `max_tokens` = bị cắt\".", "k": ["agent loop", "stop_reason", "end_turn", "loop termination"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons", "t": "Stop reasons and fallback", "s": "end_turn", "n": "Giải thích `end_turn` là trường hợp phổ biến nhất, nghĩa là Claude đã hoàn thành phản hồi một cách tự nhiên."}, {"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "t": "Define tools", "s": "", "n": "Mô tả vòng lặp tool use: tiếp tục khi `stop_reason` là `tool_use` và dừng khi Claude trả lời xong."}], "f": "", "ke": [], "ap": ["PA#36", "PB#21"]}, "Q130": {"d": 2, "sv": "Một request thất bại với HTTP 400 và error type `invalid_request_error`. Cách phản ứng nào là đúng?", "se": "A request fails with HTTP 400 and error type invalid_request_error. Which response is correct?", "oe": ["Retry with exponential backoff", "Rotate the API key", "Fix the format or content of the request; retrying it unchanged will fail again", "Wait for the retry-after period"], "ov": ["Retry với exponential backoff", "Xoay vòng (rotate) API key", "Sửa định dạng hoặc nội dung của request; gửi lại y nguyên sẽ lại thất bại", "Chờ hết khoảng thời gian `retry-after`"], "on": ["Sai — backoff dành cho lỗi tạm thời (429, 5xx); lỗi 400 do request sai nên retry nguyên trạng vẫn thất bại.", "Sai — rotate key chỉ liên quan đến lỗi xác thực/phân quyền (401/403) hoặc khi key bị lộ, không phải lỗi 400.", "Đúng — `invalid_request_error` báo request sai định dạng hoặc nội dung; phải đọc thông báo lỗi và sửa request.", "Sai — `retry-after` đi kèm lỗi 429 rate limit; chờ đợi không sửa được một request sai."], "c": [2], "x": "Câu này kiểm tra khả năng phân loại lỗi API thành hai nhóm: lỗi phía client (không nên retry nguyên trạng) và lỗi tạm thời (nên retry). HTTP 400 `invalid_request_error` nghĩa là bản thân request có vấn đề về định dạng hoặc nội dung: thiếu `max_tokens`, role không xen kẽ đúng, `tool_result` không khớp `tool_use_id`, tham số sai kiểu, đặt role `system` trong `messages`... Request lỗi \"cố định\" như vậy thì gửi lại bao nhiêu lần cũng thất bại.\n\nCách xử lý đúng: đọc `error.message` trong body phản hồi, ví dụ `{\"type\": \"error\", \"error\": {\"type\": \"invalid_request_error\", \"message\": \"messages: roles must alternate between \"user\" and \"assistant\"\"}}`, rồi sửa code tạo request. Nên log lỗi kèm `request_id` để debug.\n\nBẫy thường gặp: áp dụng retry cho mọi lỗi. Exponential backoff kèm jitter dành cho lỗi tạm thời như 429 `rate_limit_error`, 500 `api_error`, 529 `overloaded_error`. `retry-after` là header đi kèm lỗi 429. Rotate API key chỉ liên quan khi gặp 401 `authentication_error` hoặc 403 `permission_error`, hay khi nghi key bị lộ. Mẹo nhớ: 4xx (trừ 429) = sửa request; 429/5xx = retry có backoff.", "k": ["error handling", "invalid_request_error", "HTTP 400", "retry strategy", "exponential backoff"], "r": [{"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "HTTP errors", "n": "Liệt kê các mã lỗi: 400 `invalid_request_error` do định dạng/nội dung request, 429 rate limit, 500/529 lỗi phía server."}, {"u": "https://platform.claude.com/docs/en/api/rate-limits", "t": "Rate limits", "s": "", "n": "Giải thích lỗi 429 và header `retry-after` — khác với lỗi 400 không nên retry."}], "f": "", "ke": [], "ap": ["PA#37", "PC#15"]}, "Q131": {"d": 1, "sv": "Bạn sinh một đoạn mô tả sản phẩm, sau đó một lời gọi thứ hai đánh giá nó theo các tiêu chí rõ ràng, và lời gọi thứ nhất chỉnh sửa lại. Quá trình lặp lại cho đến khi bản đánh giá đạt yêu cầu. Đây là pattern nào?", "se": "You generate a product description, then a second call critiques it against clear criteria, and the first call revises it. This repeats until the critique passes. Which pattern is this?", "oe": ["Routing", "Parallelization (sectioning)", "Orchestrator-workers", "Evaluator-optimizer"], "ov": ["Routing", "Parallelization (sectioning)", "Orchestrator-workers", "Evaluator-optimizer"], "on": ["Sai — routing phân loại input và chuyển đến luồng xử lý phù hợp, không có vòng đánh giá và chỉnh sửa.", "Sai — sectioning chia tác vụ thành các phần độc lập chạy song song rồi gộp lại, không lặp vòng phản hồi.", "Sai — orchestrator-workers chia nhỏ tác vụ động cho các worker rồi tổng hợp, không có bước chấm điểm lặp lại.", "Đúng — một call sinh, một call đánh giá theo tiêu chí và phản hồi, lặp cho đến khi đạt là định nghĩa của evaluator-optimizer."], "c": [3], "x": "Evaluator-optimizer là workflow trong đó một LLM call sinh kết quả (optimizer/generator), một LLM call khác đánh giá và đưa phản hồi (evaluator), rồi lặp lại vòng \"sinh → đánh giá → sửa\" cho đến khi đạt tiêu chí. Pattern này hiệu quả khi (1) có tiêu chí đánh giá rõ ràng và (2) việc lặp lại cải thiện được chất lượng rõ rệt — tương tự cách một người viết nháp, nhận góp ý từ biên tập viên rồi sửa.\n\nVí dụ: Call 1 viết mô tả sản phẩm. Call 2 nhận bản nháp cùng rubric \"dưới 80 từ, nêu 3 lợi ích, không dùng từ phóng đại, có call-to-action\" và trả về `{\"pass\": false, \"feedback\": \"Thiếu call-to-action\"}`. Call 1 sửa theo feedback. Lặp đến khi `pass: true` hoặc chạm số vòng tối đa.\n\nBẫy thường gặp: nhầm với orchestrator-workers — ở đó một LLM trung tâm chia tác vụ thành các phần nhỏ giao cho worker rồi tổng hợp, không có vòng phản hồi chấm điểm. Routing phân loại input rồi chuyển đến xử lý chuyên biệt. Parallelization (sectioning) chia tác vụ thành các phần độc lập chạy song song. Mẹo nhớ: thấy từ khoá \"critique / feedback / lặp đến khi đạt\" thì chọn evaluator-optimizer.", "k": ["evaluator-optimizer", "workflow patterns", "routing", "parallelization", "orchestrator-workers"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Evaluator-optimizer", "n": "Mô tả pattern một LLM sinh phản hồi, LLM khác đánh giá và phản hồi trong vòng lặp, hiệu quả khi có tiêu chí đánh giá rõ ràng."}], "f": "", "ke": [], "ap": ["PA#38", "PC#6"]}, "Q132": {"d": 2, "sv": "Một service phía sau yêu cầu JSON luôn khớp với một schema cố định. Cách tiếp cận nào cho đảm bảo mạnh nhất?", "se": "A downstream service requires JSON that always matches a fixed schema. Which approach gives the strongest guarantee?", "oe": ["Ask for JSON politely in the user message", "Increase max_tokens", "Lower the request timeout", "Use structured outputs with a JSON schema"], "ov": ["Lịch sự yêu cầu JSON trong user message", "Tăng `max_tokens`", "Giảm timeout của request", "Dùng structured outputs với một JSON schema"], "on": ["Sai — yêu cầu bằng prompt chỉ là best effort; model có thể vẫn sai field, sai kiểu hoặc thêm văn bản ngoài JSON.", "Sai — `max_tokens` lớn hơn chỉ giảm khả năng bị cắt, không ràng buộc cấu trúc output.", "Sai — timeout không liên quan đến định dạng hay tính hợp lệ của JSON.", "Đúng — structured outputs dùng constrained decoding để đảm bảo output khớp JSON schema đã cung cấp."], "c": [3], "x": "Structured outputs dùng constrained decoding: trong lúc sinh token, model bị ràng buộc chỉ được tạo ra chuỗi hợp lệ theo JSON schema bạn cung cấp. Khác với việc chỉ \"xin\" JSON trong prompt (model thường làm đúng nhưng vẫn có thể thiếu field, sai kiểu, thêm lời dẫn), structured outputs đảm bảo response parse được và khớp schema — không cần vòng retry khi vi phạm schema.\n\nVí dụ trong request hiện hành:\n`\"output_config\": {\"format\": {\"type\": \"json_schema\", \"schema\": {\"type\": \"object\", \"properties\": {\"sku\": {\"type\": \"string\"}, \"price\": {\"type\": \"number\"}}, \"required\": [\"sku\", \"price\"], \"additionalProperties\": false}}}`\nVới tool use, có thể bật strict tool use (`\"strict\": true`) để đảm bảo `input` của tool khớp `input_schema`. Python SDK còn có helper `client.messages.parse()` nhận Pydantic model.\n\nBẫy thường gặp: tin rằng prompt khéo là đủ — đó chỉ là \"best effort\", không phải bảo đảm. Tăng `max_tokens` chỉ tránh bị cắt, không đảm bảo cấu trúc; giảm timeout không liên quan. Lưu ý vẫn nên kiểm tra `stop_reason`: nếu là `\"refusal\"` hoặc `\"max_tokens\"` thì output có thể không khớp schema. Mẹo nhớ: \"cần đảm bảo schema → structured outputs; prompt chỉ là gợi ý\".", "k": ["structured outputs", "JSON schema", "constrained decoding", "strict tool use"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "t": "Structured outputs", "s": "Why use structured outputs", "n": "Giải thích structured outputs đảm bảo response khớp schema nhờ constrained decoding, không cần retry khi vi phạm schema."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "t": "Structured outputs", "s": "Invalid outputs", "n": "Nêu các ngoại lệ như refusal hoặc `max_tokens` khiến output có thể không khớp schema."}], "f": "Tài liệu hiện hành: tham số là `output_config.format` (không cần beta header); tham số beta cũ `output_format` cùng header `structured-outputs-2025-11-13` đã deprecated. Đảm bảo schema có ngoại lệ khi `stop_reason` là `\"refusal\"` hoặc `\"max_tokens\"`.", "ke": [], "ap": ["PA#39", "PB#26", "PC#51"]}, "Q133": {"d": 8, "sv": "Trong một tool definition, `input_schema` được biểu diễn dưới dạng nào?", "se": "In a tool definition, how is input_schema expressed?", "oe": ["As a JSON Schema object", "As a Python type hint", "As a free-text sentence", "As a regular expression"], "ov": ["Một object JSON Schema", "Một Python type hint", "Một câu văn bản tự do", "Một biểu thức chính quy (regular expression)"], "on": ["Đúng — `input_schema` là object JSON Schema định nghĩa kiểu, thuộc tính và trường bắt buộc của tham số tool.", "Sai — type hint có thể được SDK chuyển đổi, nhưng API chỉ nhận JSON Schema.", "Sai — văn bản tự do thuộc về `description`; `input_schema` phải có cấu trúc để Claude sinh input hợp lệ.", "Sai — regex chỉ có thể là ràng buộc `pattern` bên trong JSON Schema, không thay thế schema."], "c": [0], "x": "Mỗi tool khai báo cho Claude gồm ba phần chính: `name`, `description` và `input_schema`. Trong đó `input_schema` là một object JSON Schema mô tả các tham số tool nhận vào: kiểu dữ liệu, thuộc tính nào bắt buộc, enum giá trị cho phép, mô tả từng tham số. Claude dựa vào schema này để sinh `input` hợp lệ trong block `tool_use`.\n\nVí dụ:\n`{\"name\": \"get_weather\", \"description\": \"Get current weather for a city. Use when the user asks about weather.\", \"input_schema\": {\"type\": \"object\", \"properties\": {\"city\": {\"type\": \"string\", \"description\": \"City name, e.g. Hanoi\"}, \"unit\": {\"type\": \"string\", \"enum\": [\"celsius\", \"fahrenheit\"]}}, \"required\": [\"city\"]}}`\nSchema gốc luôn có `\"type\": \"object\"`. Bật strict tool use sẽ đảm bảo `input` khớp schema tuyệt đối.\n\nBẫy thường gặp: nhầm với cách SDK hỗ trợ. Một số SDK/framework cho phép bạn viết hàm Python với type hint hoặc Pydantic model rồi tự sinh schema — nhưng thứ thực sự gửi lên API vẫn là JSON Schema. Mô tả bằng văn bản tự do thuộc về `description`, không thay được schema. Regex chỉ có thể xuất hiện dưới dạng ràng buộc `pattern` bên trong JSON Schema. Mẹo nhớ: MCP tools cũng dùng JSON Schema (field `inputSchema`).", "k": ["tool definition", "input_schema", "JSON Schema", "tool use"], "r": [{"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "t": "Define tools", "s": "Specifying client tools", "n": "Mô tả cấu trúc tool definition gồm `name`, `description` và `input_schema` là một JSON Schema object."}, {"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", "t": "Tool use with Claude", "s": "", "n": "Tổng quan cách Claude dùng tool definition để quyết định gọi tool và sinh input theo schema."}], "f": "", "ke": [], "ap": ["PA#40", "PC#4"]}, "Q134": {"d": 8, "sv": "`tool_choice: {\"type\": \"auto\"}` có nghĩa là gì?", "se": "What does tool_choice: {\"type\": \"auto\"} mean?", "oe": ["Claude decides whether to call a tool or answer directly", "Claude must call at least one tool", "Claude must call one specific named tool", "Claude may not call any tool"], "ov": ["Claude tự quyết định gọi tool hay trả lời trực tiếp", "Claude phải gọi ít nhất một tool", "Claude phải gọi một tool cụ thể được chỉ định tên", "Claude không được gọi tool nào"], "on": ["Đúng — `auto` để Claude tự quyết định có cần gọi tool hay trả lời trực tiếp; đây là mặc định khi có `tools`.", "Sai — bắt buộc gọi ít nhất một tool là `{\"type\": \"any\"}`.", "Sai — ép gọi một tool cụ thể là `{\"type\": \"tool\", \"name\": \"...\"}`.", "Sai — cấm gọi tool là `{\"type\": \"none\"}`."], "c": [0], "x": "Tham số `tool_choice` điều khiển mức độ \"ép\" Claude dùng tool. Có bốn giá trị cần thuộc lòng:\n`{\"type\": \"auto\"}` — mặc định khi có `tools`: Claude tự quyết định gọi tool (một hoặc nhiều) hay trả lời thẳng bằng text.\n`{\"type\": \"any\"}` — Claude bắt buộc phải gọi ít nhất một tool, nhưng được chọn tool nào.\n`{\"type\": \"tool\", \"name\": \"get_weather\"}` — Claude bắt buộc gọi đúng tool được chỉ định.\n`{\"type\": \"none\"}` — Claude không được gọi tool nào, dù `tools` có được khai báo.\n\nVí dụ: chatbot hỗ trợ có tool `lookup_order`. Người dùng hỏi \"Shop mở cửa mấy giờ?\" — với `auto`, Claude trả lời trực tiếp; khi hỏi \"Đơn #123 của tôi đâu?\", Claude gọi `lookup_order`. Đây là hành vi mong muốn cho hầu hết agent. Ngược lại, khi bạn dùng tool chỉ để trích xuất dữ liệu có cấu trúc, ép `{\"type\": \"tool\", ...}` sẽ đảm bảo luôn nhận được `tool_use`.\n\nBẫy thường gặp: nhầm `auto` với `any` (bắt buộc dùng tool). Lưu ý thêm: với `any` hoặc `tool`, API prefill để ép tool use nên Claude sẽ không viết text giải thích trước block `tool_use`; và extended thinking chỉ hỗ trợ `auto` hoặc `none`. Mẹo nhớ: auto = tự chọn, any = phải dùng, tool = dùng đúng cái này, none = cấm dùng.", "k": ["tool_choice", "auto", "any", "forced tool use", "tool use"], "r": [{"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "t": "Define tools", "s": "Forcing tool use", "n": "Mô tả các giá trị `tool_choice`: `auto`, `any`, `tool`, `none` và hành vi tương ứng."}, {"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", "t": "Tool use with Claude", "s": "", "n": "Tổng quan về tool use và cách Claude quyết định khi nào gọi tool."}], "f": "", "ke": [], "ap": ["PA#41", "PB#29", "PC#50"]}, "Q135": {"d": 1, "sv": "So với một lời gọi LLM đơn lẻ, HAI chi phí nào bạn nên dự kiến khi dùng một agent tự hành?", "se": "Compared with a single LLM call, which TWO costs should you expect from an autonomous agent?", "oe": ["Higher latency and token cost", "No need for testing", "Lower total token usage", "Errors that can compound across steps", "Fully deterministic output"], "ov": ["Latency và chi phí token cao hơn", "Không cần kiểm thử", "Tổng lượng token sử dụng thấp hơn", "Lỗi có thể cộng dồn qua các bước", "Output hoàn toàn tất định (deterministic)"], "on": ["Đúng — nhiều lượt gọi API và context tích luỹ làm tăng cả latency lẫn token so với một lời gọi đơn.", "Sai — agent càng cần kiểm thử kỹ (sandbox, eval, guardrail) vì hành vi nhiều bước khó dự đoán.", "Sai — agent thường tiêu thụ nhiều token hơn hẳn do lặp nhiều bước và gửi lại lịch sử.", "Đúng — sai sót ở một bước có thể lan truyền và khuếch đại qua các bước sau.", "Sai — agent nhiều bước càng ít tất định; đường đi có thể khác nhau giữa các lần chạy."], "c": [0, 3], "x": "Agent tự hành hoạt động bằng vòng lặp: suy nghĩ, gọi tool, đọc kết quả, quyết định bước tiếp theo — có thể kéo dài hàng chục lượt. Anthropic nêu rõ trong \"Building effective agents\" rằng hệ thống agentic thường đánh đổi latency và chi phí để lấy hiệu năng trên tác vụ khó, và tính tự chủ của agent kéo theo chi phí cao hơn cùng khả năng lỗi cộng dồn.\n\nHai chi phí đúng: (1) Latency và token cao hơn — mỗi bước là một lời gọi API mới, và context tích luỹ dần (lịch sử, kết quả tool) nên input token mỗi lượt càng về sau càng lớn. Ví dụ một tác vụ 15 bước, mỗi bước gửi lại toàn bộ lịch sử 20.000 token, tổng input có thể lên hàng trăm nghìn token, so với vài nghìn token của một lời gọi đơn. (2) Lỗi cộng dồn — nếu bước 3 hiểu sai kết quả tool, mọi bước sau xây trên nền sai đó. Nếu mỗi bước đúng 95%, sau 10 bước xác suất toàn bộ chuỗi đúng chỉ còn khoảng 60%.\n\nBẫy thường gặp: nghĩ agent \"thông minh\" nên không cần test — ngược lại, agent cần kiểm thử kỹ trong sandbox, có guardrail và điều kiện dừng. Agent cũng không tiết kiệm token và không tất định. Mẹo nhớ: agent = linh hoạt hơn, nhưng chậm hơn, đắt hơn, rủi ro cộng dồn.", "k": ["autonomous agents", "latency", "token cost", "compounding errors", "trade-offs"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "When (and when not) to use agents", "n": "Nêu agent đánh đổi latency và chi phí lấy hiệu năng, và tính tự chủ dẫn đến chi phí cao hơn cùng khả năng lỗi cộng dồn."}, {"u": "https://www.anthropic.com/engineering/multi-agent-research-system", "t": "How we built our multi-agent research system", "s": "", "n": "Chia sẻ rằng hệ thống agent tiêu tốn nhiều token hơn đáng kể so với chat thông thường và lỗi có thể tích luỹ."}], "f": "", "ke": [], "ap": ["PA#42", "PB#18", "PC#5"]}, "Q136": {"d": 4, "sv": "Bạn phải chấm 5.000 câu trả lời dạng văn bản tự do về giọng điệu và mức độ hữu ích, một cách nhất quán và nhanh chóng. Phương pháp chấm nào phù hợp nhất?", "se": "You must grade 5,000 free-text answers for tone and helpfulness, consistently and quickly. Which grading method fits best?", "oe": ["Counting the number of words", "Manual review of all 5,000 answers by one person", "LLM-based grading with a clear rubric, spot-checked against human judgment", "Exact string match"], "ov": ["Đếm số từ", "Một người review thủ công cả 5.000 câu trả lời", "Chấm bằng LLM (LLM-based grading) với rubric rõ ràng, kiểm tra ngẫu nhiên đối chiếu với đánh giá của con người", "So khớp chuỗi chính xác (exact string match)"], "on": ["Sai — số từ không phản ánh giọng điệu hay mức độ hữu ích của câu trả lời.", "Sai — chấm thủ công 5.000 câu chậm, đắt và dễ thiếu nhất quán do mệt mỏi; không đáp ứng yêu cầu nhanh.", "Đúng — LLM grader với rubric rõ ràng chấm nhanh, nhất quán ở quy mô lớn, và spot-check bằng người giúp hiệu chỉnh độ tin cậy.", "Sai — câu trả lời tự do không có chuỗi chuẩn duy nhất, nên exact match không áp dụng được cho tiêu chí chủ quan."], "c": [2], "x": "Tài liệu \"Develop tests\" của Anthropic chia phương pháp chấm eval thành ba nhóm: code-based (exact match, string match, regex — nhanh, rẻ, tin cậy nhưng chỉ hợp với đáp án có cấu trúc), human grading (linh hoạt, chất lượng cao nhưng chậm, đắt, khó mở rộng) và LLM-based grading (nhanh, linh hoạt, mở rộng tốt, phù hợp với đánh giá phức tạp và chủ quan như giọng điệu). Với 5.000 câu trả lời tự do về tone và helpfulness, LLM grader là lựa chọn cân bằng nhất.\n\nĐể LLM grader đáng tin cậy: viết rubric chi tiết (ví dụ \"Helpfulness 1–5: 5 = giải quyết trọn vẹn câu hỏi, có bước hành động cụ thể\"), yêu cầu model suy luận ngắn trước khi chấm, trả về định dạng cố định như `{\"tone\": 4, \"helpfulness\": 5, \"reason\": \"...\"}`, và nên dùng model khác với model sinh câu trả lời. Sau đó lấy mẫu ngẫu nhiên khoảng 100–200 câu cho người chấm để đo mức đồng thuận, điều chỉnh rubric nếu lệch.\n\nBẫy thường gặp: chọn exact match vì \"nhất quán\" — nhưng câu trả lời tự do không có chuỗi chuẩn để so. Đếm từ không đo được giọng điệu. Một người chấm 5.000 câu vừa chậm vừa mệt mỏi, dẫn đến thiếu nhất quán. Mẹo nhớ: \"chủ quan + số lượng lớn = LLM-as-judge có rubric + spot-check\".", "k": ["eval", "LLM-based grading", "rubric", "human spot-check", "grading methods"], "r": [{"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "Grading evals", "n": "So sánh code-based, human và LLM-based grading, kèm mẹo viết rubric rõ ràng cho LLM grader."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "", "n": "Hướng dẫn xác định tiêu chí thành công cụ thể, đo lường được cho các khía cạnh như giọng điệu."}], "f": "", "ke": [], "ap": ["PA#43", "PC#40"]}, "Q137": {"d": 5, "sv": "Một system prompt bắt đầu bằng timestamp hiện tại, theo sau là 15.000 token chỉ dẫn cố định với cache breakpoint ở cuối. Lượng cache read luôn bằng 0. Vì sao?", "se": "A system prompt begins with the current timestamp, followed by 15,000 tokens of fixed instructions with a cache breakpoint at the end. Cache reads stay at zero. Why?", "oe": ["Caching does not work on system prompts", "The cache only works with streaming", "The timestamp changes the prefix on every request, so nothing after it can be read from cache", "The prompt is too long to cache"], "ov": ["Caching không hoạt động với system prompt", "Cache chỉ hoạt động khi dùng streaming", "Timestamp làm prefix thay đổi ở mỗi request, nên không phần nào phía sau nó có thể được đọc từ cache", "Prompt quá dài để cache"], "on": ["Sai — system prompt là một trong những nơi phổ biến nhất để đặt cache breakpoint.", "Sai — prompt caching hoạt động như nhau với cả request streaming và không streaming.", "Đúng — timestamp ở đầu làm prefix khác nhau mỗi request, nên hash không bao giờ khớp và không có cache hit.", "Sai — caching chỉ có ngưỡng độ dài tối thiểu; 15.000 token hoàn toàn đủ điều kiện."], "c": [2], "x": "Cache của Claude khớp theo prefix chính xác: hệ thống tính hash cho toàn bộ nội dung từ đầu request đến cache breakpoint. Chỉ cần một ký tự trong prefix khác đi, hash khác, cache miss. Ở đây timestamp nằm ngay đầu system prompt và đổi mỗi giây, nên dù 15.000 token phía sau giống hệt, toàn bộ prefix vẫn là \"mới\" với mỗi request. Kết quả: mỗi lần đều phát sinh `cache_creation_input_tokens` (tốn phí write) còn `cache_read_input_tokens` luôn bằng 0 — tệ hơn cả không bật cache.\n\nCách sửa: đưa nội dung thay đổi ra SAU breakpoint. Ví dụ:\n`\"system\": [{\"type\": \"text\", \"text\": \"<15.000 token chỉ dẫn cố định>\", \"cache_control\": {\"type\": \"ephemeral\"}}, {\"type\": \"text\", \"text\": \"Current time: 2026-10-13T08:00Z\"}]`\nhoặc đặt timestamp vào user message. Nếu chỉ cần ngày, làm tròn theo ngày cũng giúp prefix ổn định hơn.\n\nBẫy thường gặp: nghĩ prompt dài quá không cache được — thực tế chỉ có ngưỡng TỐI THIỂU (tuỳ model), 15.000 token thừa đủ điều kiện. System prompt hoàn toàn có thể cache, và cache không phụ thuộc streaming. Mẹo debug: khi `cache_read_input_tokens` mãi bằng 0, hãy tìm nội dung động (timestamp, request ID, tên người dùng, thứ tự tool thay đổi) nằm trước breakpoint.", "k": ["prompt caching", "prefix matching", "cache invalidation", "cache_read_input_tokens", "dynamic content"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "t": "Prompt caching", "s": "What invalidates the cache", "n": "Nêu cache yêu cầu khớp chính xác; nội dung thay đổi như timestamp nằm trước breakpoint khiến cache không bao giờ hit."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "t": "Prompt caching", "s": "Troubleshooting common issues", "n": "Hướng dẫn chẩn đoán khi không có cache hit, như kiểm tra phần prefix có giống hệt giữa các request."}], "f": "", "ke": [], "ap": ["PA#44", "PB#16"]}, "Q138": {"d": 5, "sv": "Bật extended thinking phù hợp nhất cho tác vụ nào?", "se": "For which task is turning on extended thinking most appropriate?", "oe": ["Converting a string to upper case", "Returning the capital city of a country", "A multi-step financial analysis that requires careful reasoning", "Echoing the user's message"], "ov": ["Chuyển một chuỗi sang chữ in hoa", "Trả về thủ đô của một quốc gia", "Một bài phân tích tài chính nhiều bước đòi hỏi suy luận cẩn thận", "Lặp lại nguyên văn tin nhắn của người dùng"], "on": ["Sai — chuyển chữ hoa là biến đổi tất định, nên làm bằng code; thinking chỉ tốn thêm token và latency.", "Sai — đây là tra cứu kiến thức đơn giản, không cần suy luận nhiều bước.", "Đúng — phân tích tài chính nhiều bước cần tính toán và kiểm tra giả định cẩn thận, đúng loại tác vụ extended thinking giúp cải thiện chất lượng.", "Sai — lặp lại tin nhắn không đòi hỏi suy luận nào."], "c": [2], "x": "Extended thinking cho phép Claude suy luận từng bước trong các block `thinking` trước khi đưa ra câu trả lời cuối. Nó cải thiện chất lượng rõ rệt với tác vụ phức tạp: toán, phân tích nhiều bước, lập kế hoạch, code khó, cân nhắc nhiều ràng buộc. Đổi lại, thinking token được tính phí như output token và làm tăng latency.\n\nBài phân tích tài chính nhiều bước (ví dụ: tính dòng tiền chiết khấu, so sánh ba kịch bản lãi suất, kiểm tra giả định, rồi đưa khuyến nghị) chính là loại tác vụ hưởng lợi: model có \"không gian nháp\" để tính toán, phát hiện mâu thuẫn và tự sửa trước khi trả lời.\n\nBẫy thường gặp: bật thinking cho mọi request \"cho chắc\". Với tác vụ đơn giản hoặc thuần tra cứu như viết hoa chuỗi, trả về thủ đô, lặp lại tin nhắn, thinking chỉ tốn thêm tiền và thời gian mà không cải thiện kết quả — thậm chí những việc như viết hoa chuỗi nên làm bằng code. Mẹo nhớ: \"cần suy luận nhiều bước → thinking; tra cứu/biến đổi đơn giản → không\". Trên thực tế, các model mới dùng adaptive thinking để Claude tự quyết định mức độ suy nghĩ theo độ khó của từng request.", "k": ["extended thinking", "adaptive thinking", "reasoning", "latency vs quality", "cost"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/extended-thinking", "t": "Extended thinking", "s": "", "n": "Mô tả cách bật extended thinking và khuyến nghị dùng cho tác vụ phức tạp, cùng các lưu ý về budget và chi phí."}, {"u": "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model", "t": "Choosing the right model", "s": "", "n": "Cân nhắc giữa chất lượng, tốc độ và chi phí khi chọn cấu hình model cho từng loại tác vụ."}], "f": "Tài liệu hiện hành: trên các model từ Claude 4.7 trở đi (ví dụ Opus 5.5, Sonnet 5.5), `thinking: {\"type\": \"enabled\", \"budget_tokens\": ...}` không còn được hỗ trợ (trả lỗi 400); phải dùng adaptive thinking `thinking: {\"type\": \"adaptive\"}` kèm `output_config.effort`. Với Opus/Sonnet 4.6, `budget_tokens` đã deprecated.", "ke": [], "ap": ["PA#45", "PB#5", "PC#52"]}, "Q139": {"d": 1, "sv": "Một agent sẽ chạy tự hành qua nhiều bước trong môi trường production. Cơ chế bảo vệ nào quan trọng nhất cần xây dựng sẵn?", "se": "An agent will run autonomously for many steps in production. Which safeguard is most important to build in?", "oe": ["Removing tool descriptions to save tokens", "A longer system prompt", "A higher temperature so the agent explores more options", "Stopping conditions such as a maximum number of iterations, plus human checkpoints"], "ov": ["Bỏ tool description để tiết kiệm token", "Một system prompt dài hơn", "Temperature cao hơn để agent khám phá nhiều phương án hơn", "Các điều kiện dừng như số vòng lặp tối đa, cộng với các checkpoint có con người tham gia"], "on": ["Sai — tool description giúp agent chọn và dùng tool đúng; bỏ đi làm tăng lỗi và rủi ro.", "Sai — prompt dài hơn không phải cơ chế cưỡng chế; agent vẫn có thể lặp vô hạn hoặc làm sai.", "Sai — temperature cao làm hành vi kém ổn định, không phù hợp với agent production cần độ tin cậy.", "Đúng — giới hạn số vòng lặp và checkpoint có con người giúp ngăn vòng lặp vô hạn và hành động nguy hiểm không được kiểm soát."], "c": [3], "x": "Agent tự hành có thể rơi vào vòng lặp vô hạn (gọi đi gọi lại cùng một tool), đi lệch mục tiêu, hoặc thực hiện hành động có tác động thật (xoá dữ liệu, gửi email, thanh toán). \"Building effective agents\" khuyến nghị agent nên có điều kiện dừng (ví dụ số vòng lặp tối đa) để giữ quyền kiểm soát, và có thể tạm dừng tại các checkpoint để lấy phản hồi của con người, đồng thời test kỹ trong sandbox.\n\nVí dụ thiết kế: `MAX_ITERATIONS = 25`; vòng lặp dừng khi `stop_reason == \"end_turn\"` hoặc chạm giới hạn. Thêm ngân sách token/thời gian, và với hành động không thể hoàn tác như `delete_records` hay `send_payment`, agent phải dừng lại chờ người duyệt. Kết hợp least privilege cho tool, log đầy đủ để audit, cảnh báo khi chi phí bất thường.\n\nBẫy thường gặp: nghĩ system prompt dài hơn là đủ — chỉ dẫn không phải cơ chế cưỡng chế, agent vẫn có thể lặp hoặc sai. Bỏ tool description làm agent chọn sai tool nhiều hơn. Temperature cao làm hành vi kém ổn định, tăng rủi ro trong production. Mẹo nhớ: guardrail thật sự nằm trong code (giới hạn, phê duyệt), không chỉ trong prompt.", "k": ["stopping conditions", "max iterations", "human-in-the-loop", "guardrails", "agent safety"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Agents", "n": "Khuyến nghị agent có điều kiện dừng như số vòng lặp tối đa, checkpoint lấy phản hồi con người và test kỹ trong sandbox."}, {"u": "https://code.claude.com/docs/en/agent-sdk/overview", "t": "Agent SDK overview", "s": "", "n": "Agent SDK cung cấp các cơ chế kiểm soát như giới hạn số lượt và phân quyền tool cho agent."}], "f": "", "ke": [], "ap": ["PA#46", "PB#12", "PC#11"]}, "Q140": {"d": 2, "sv": "Lý do kỹ thuật chính để dùng streaming cho một request có thể sinh output rất dài là gì?", "se": "What is the main technical reason to use streaming for a request that may produce a very long output?", "oe": ["It raises the rate limit", "It avoids HTTP timeouts on long-running requests and lets you show progress", "It disables the max_tokens limit", "It makes output tokens cheaper"], "ov": ["Nó nâng rate limit", "Nó tránh HTTP timeout với request chạy lâu và cho phép hiển thị tiến trình", "Nó vô hiệu hoá giới hạn `max_tokens`", "Nó làm output token rẻ hơn"], "on": ["Sai — streaming không thay đổi rate limit của tài khoản.", "Đúng — SSE giữ kết nối hoạt động suốt quá trình sinh output, tránh timeout và cho phép hiển thị text dần dần.", "Sai — `max_tokens` vẫn được áp dụng đầy đủ khi streaming.", "Sai — giá token giống hệt nhau giữa request streaming và không streaming."], "c": [1], "x": "Khi không dùng streaming, client phải giữ một kết nối HTTP mở và chờ đến khi model sinh xong toàn bộ output mới nhận được response. Với output rất dài (hàng chục nghìn token), thời gian chờ có thể vượt timeout của client, proxy hoặc load balancer, khiến kết nối bị ngắt giữa chừng. Streaming dùng server-sent events (SSE): server gửi dần các event như `message_start`, `content_block_delta`, `message_delta`, `message_stop`, giữ kết nối luôn \"sống\" và cho phép bạn hiển thị text ngay khi được sinh ra.\n\nTài liệu nêu rõ streaming đặc biệt hữu ích với request có `max_tokens` lớn, nơi SDK yêu cầu streaming để tránh HTTP timeout. Nếu không cần xử lý từng phần, vẫn có thể stream rồi lấy kết quả cuối, ví dụ: `with client.messages.stream(...) as stream: message = stream.get_final_message()`.\n\nBẫy thường gặp: nghĩ streaming giảm giá hoặc tăng hạn mức. Giá token như nhau dù stream hay không; rate limit cũng không đổi. `max_tokens` vẫn áp dụng đầy đủ — streaming không cho phép vượt giới hạn này. Lưu ý thêm: lỗi có thể xảy ra giữa luồng stream (ví dụ event `error` với `overloaded_error`), nên cần xử lý phục hồi. Mẹo nhớ: streaming = trải nghiệm + tránh timeout, không phải tiết kiệm.", "k": ["streaming", "server-sent events", "HTTP timeout", "max_tokens", "long outputs"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/streaming", "t": "Streaming messages", "s": "Get the final message without handling events", "n": "Nêu streaming hữu ích với request có `max_tokens` lớn, nơi SDK yêu cầu streaming để tránh HTTP timeout, và cách lấy message cuối."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/streaming", "t": "Streaming messages", "s": "Event types", "n": "Liệt kê các event SSE như `message_start`, `content_block_delta`, `message_delta`, `message_stop`."}, {"u": "https://platform.claude.com/docs/en/cli-sdks-libraries/overview", "t": "SDKs, CLI, and libraries", "s": "", "n": "Tài liệu SDK chính thức hỗ trợ streaming và cấu hình timeout cho request dài."}], "f": "", "ke": [], "ap": ["PA#47", "PB#6", "PC#42"]}, "Q141": {"d": 2, "sv": "Theo mặc định, các SDK chính thức của Anthropic xử lý thế nào khi một request thất bại với lỗi 429 hoặc 5xx?", "se": "How do the official Anthropic SDKs behave by default when a request fails with a 429 or a 5xx error?", "oe": ["They never retry; every retry must be written by hand", "They retry forever until the request succeeds", "They retry automatically a limited number of times with backoff, and the retry count is configurable", "They switch to a different model"], "ov": ["Không bao giờ retry; mọi lần retry phải tự viết tay", "Retry mãi mãi cho đến khi request thành công", "Tự động retry một số lần giới hạn kèm backoff, và số lần retry có thể cấu hình", "Tự chuyển sang một model khác"], "on": ["Sai — SDK đã có sẵn cơ chế retry tự động cho lỗi tạm thời, bạn không cần tự viết từ đầu.", "Sai — retry bị giới hạn (mặc định 2 lần); retry vô hạn sẽ gây retry storm và treo ứng dụng.", "Đúng — SDK retry tự động một số lần giới hạn với exponential backoff, chỉnh được qua `max_retries`.", "Sai — SDK không bao giờ tự đổi `model`; fallback sang model khác là logic bạn phải tự cài đặt."], "c": [2], "x": "Câu này kiểm tra hành vi retry tích hợp sẵn của các client SDK (Python, TypeScript...). Các lỗi như 429 (`rate_limit_error`), 5xx (`api_error`, `overloaded_error` 529), lỗi kết nối, 408 timeout hay 409 conflict được xem là lỗi tạm thời (transient). Vì vậy SDK tự động retry chúng một số lần nhỏ, mặc định là 2 lần, với exponential backoff ngắn giữa các lần thử.\n\nSố lần retry có thể chỉnh ở cấp client hoặc từng request, ví dụ trong Python: `client = anthropic.Anthropic(max_retries=5)` hoặc `client.with_options(max_retries=0).messages.create(...)` để tắt hẳn. Đó là lý do đáp án \"retry giới hạn + backoff + cấu hình được\" là đúng: vừa giảm công viết code lặp, vừa tránh dội tải vào hệ thống đang quá tải.\n\nBẫy thường gặp: nghĩ rằng SDK retry vô hạn (nguy hiểm vì gây retry storm và treo ứng dụng), hoặc nghĩ SDK tự đổi model (SDK không bao giờ thay đổi tham số `model` của bạn). Mẹo nhớ: \"lỗi tạm thời thì SDK thử lại vài lần; lỗi do bạn (400, 401, 403, 404) thì không retry\". Nếu cần chiến lược phức tạp hơn (fallback model, queue), bạn tự viết ở tầng ứng dụng.", "k": ["client SDK", "automatic retry", "max_retries", "exponential backoff", "transient error"], "r": [{"u": "https://github.com/anthropics/anthropic-sdk-python", "t": "Claude SDK for Python (anthropics/anthropic-sdk-python)", "s": "Retries", "n": "README SDK Python mô tả các lỗi được retry mặc định 2 lần với backoff ngắn và cách đặt `max_retries`."}, {"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "HTTP errors", "n": "Danh sách mã lỗi HTTP và error type, phân biệt lỗi tạm thời (429, 500, 529) với lỗi do request."}], "f": "", "ke": [], "ap": ["PA#48", "PB#40", "PC#21"]}, "Q142": {"d": 1, "sv": "Một tác vụ lập trình có thể cần sửa một số lượng file không biết trước, và sửa file nào phụ thuộc vào yêu cầu. Pattern nào phù hợp?", "se": "A coding task may require changes to an unknown number of files, and which files depends on the request. Which pattern fits?", "oe": ["Routing", "Parallelization with a fixed list of branches", "Orchestrator-workers", "Prompt chaining"], "ov": ["Routing", "Parallelization với danh sách nhánh cố định", "Orchestrator-workers", "Prompt chaining"], "on": ["Sai — routing chỉ phân loại input rồi chuyển đến một handler phù hợp, không chia tác vụ thành nhiều subtask động.", "Sai — parallelization cần danh sách nhánh định sẵn, không xử lý được số file thay đổi theo từng yêu cầu.", "Đúng — orchestrator tự quyết định động cần sửa những file nào rồi giao cho các worker, đúng với bài toán số subtask không biết trước.", "Sai — prompt chaining là chuỗi bước cố định theo thứ tự, không thích nghi với số lượng file thay đổi."], "c": [2], "x": "Câu hỏi kiểm tra cách chọn workflow pattern trong bài \"Building effective agents\". Orchestrator-workers là pattern trong đó một LLM trung tâm (orchestrator) phân tích tác vụ, tự động chia nhỏ thành các subtask, giao cho các worker LLM rồi tổng hợp kết quả. Điểm khác biệt then chốt: các subtask KHÔNG được định nghĩa trước mà được quyết định động dựa trên input.\n\nTình huống trong đề chính là ví dụ kinh điển mà Anthropic nêu: các thay đổi code phức tạp, trong đó số lượng file cần sửa và bản chất thay đổi ở mỗi file phụ thuộc vào yêu cầu cụ thể. Ví dụ yêu cầu \"đổi tên field `userId` thành `accountId`\" có thể chạm 3 file hoặc 30 file; orchestrator sẽ đọc codebase, lập danh sách file, rồi giao mỗi file cho một worker.\n\nBẫy thường gặp: nhầm với parallelization (sectioning). Về hình thức cả hai đều chạy nhiều nhánh, nhưng parallelization có danh sách nhánh cố định do lập trình viên định sẵn, còn orchestrator-workers linh hoạt về số nhánh. Mẹo nhớ: \"biết trước subtask thì parallelization/chaining; không biết trước thì orchestrator-workers\".", "k": ["orchestrator-workers", "parallelization", "dynamic subtasks", "workflow"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Orchestrator-workers", "n": "Mô tả orchestrator chia tác vụ động và lấy ví dụ sản phẩm coding sửa nhiều file tùy theo yêu cầu."}], "f": "", "ke": [], "ap": ["PA#49", "PC#29"]}, "Q143": {"d": 7, "sv": "Một agent có tool thực hiện hoàn tiền (refund). Biện pháp kiểm soát nào phù hợp nhất?", "se": "An agent has a tool that issues refunds. Which control is most appropriate?", "oe": ["Require human approval for irreversible or high-impact actions", "Let the agent decide alone, to reduce latency", "Hide the tool's description from the model", "Give the tool an obscure name"], "ov": ["Yêu cầu con người phê duyệt đối với các hành động không thể đảo ngược hoặc có tác động lớn", "Để agent tự quyết định một mình, nhằm giảm latency", "Ẩn description của tool khỏi model", "Đặt cho tool một cái tên khó hiểu"], "on": ["Đúng — human approval cho hành động không đảo ngược/tác động lớn là guardrail chuẩn, ngăn agent hoàn tiền sai hoặc bị lợi dụng.", "Sai — giảm latency không đáng để đánh đổi rủi ro tài chính; agent có thể sai hoặc bị prompt injection.", "Sai — ẩn description chỉ khiến model dùng tool sai nhiều hơn, không phải biện pháp kiểm soát.", "Sai — security through obscurity; tên khó hiểu làm giảm chất lượng chọn tool mà không ngăn được lạm dụng."], "c": [0], "x": "Nguyên tắc cốt lõi: với các hành động có hậu quả tài chính, không thể đảo ngược hoặc tác động lớn (hoàn tiền, xóa dữ liệu, gửi email ra ngoài, deploy production), cần có human-in-the-loop, tức là một checkpoint để con người xác nhận trước khi thực thi. Anthropic nhấn mạnh agent tự chủ có chi phí cao hơn và rủi ro lỗi cộng dồn, nên cần guardrail và điểm dừng cho con người.\n\nVí dụ thực tế: agent soạn sẵn yêu cầu `issue_refund({\"order_id\": \"A123\", \"amount\": 49.99})`, nhưng backend chỉ đánh dấu trạng thái \"chờ duyệt\" và hiển thị cho nhân viên bấm Approve. Có thể kết hợp thêm ngưỡng: dưới 10 USD tự động, trên ngưỡng phải duyệt; cùng với least privilege và audit log.\n\nBẫy thường gặp: các phương án \"bảo mật bằng che giấu\" (ẩn description, đặt tên tối nghĩa) nghe có vẻ an toàn nhưng chỉ làm model dùng tool kém chính xác hơn, không ngăn được hành động sai. Còn tối ưu latency không bao giờ là lý do chính đáng để bỏ kiểm soát với hành động không đảo ngược được. Mẹo nhớ: \"irreversible hoặc high-impact thì phải có người duyệt\".", "k": ["human-in-the-loop", "guardrails", "irreversible actions", "least privilege", "agent safety"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Agents", "n": "Nêu rằng agent tự chủ có rủi ro lỗi cộng dồn, cần guardrail và checkpoint để con người can thiệp."}, {"u": "https://genai.owasp.org/llm-top-10/", "t": "OWASP Top 10 for LLM Applications 2025 (LLMRisks Archive - OWASP Gen AI Security Project)", "s": "LLM06: Excessive Agency", "n": "Khuyến nghị giới hạn quyền của tool và yêu cầu con người phê duyệt hành động có tác động lớn."}], "f": "", "ke": [], "ap": ["PA#50", "PB#13"]}, "Q144": {"d": 5, "sv": "Thinking token (của extended thinking) được tính phí như thế nào?", "se": "How are thinking tokens billed?", "oe": ["At a flat fee per request", "As input tokens", "They are free", "As output tokens"], "ov": ["Một mức phí cố định mỗi request", "Như input token", "Miễn phí", "Như output token"], "on": ["Sai — không có phí cố định; thinking được tính theo số token thực tế sinh ra.", "Sai — thinking token là token model sinh ra nên tính giá output, không phải input.", "Sai — thinking token không miễn phí, kể cả khi bạn không nhìn thấy toàn bộ nội dung thinking.", "Đúng — thinking token được tính phí như output token và nằm trong giới hạn `max_tokens`."], "c": [3], "x": "Khi bật extended thinking (ví dụ `\"thinking\": {\"type\": \"enabled\", \"budget_tokens\": 10000}`), Claude sinh ra các thinking token trước khi trả lời. Vì đây là token do model GENERATE ra, chúng được tính phí theo giá output token, giống phần text trả lời. `budget_tokens` cũng nằm trong giới hạn `max_tokens`, nên phải đặt `max_tokens` lớn hơn budget.\n\nĐiều này quan trọng cho tối ưu chi phí: output token đắt hơn input token khoảng 5 lần (ví dụ 3 USD so với 15 USD mỗi triệu token với Sonnet), nên budget thinking lớn có thể làm hóa đơn tăng đáng kể. Chỉ nên bật thinking cho tác vụ cần suy luận phức tạp, và chọn budget vừa đủ.\n\nBẫy thường gặp: nghĩ thinking miễn phí vì người dùng không thấy nó, hoặc nghĩ nó là input vì ở lượt sau các thinking block được gửi lại trong lịch sử. Thực tế, thinking block của các lượt TRƯỚC khi gửi lại được xử lý như input (và với nhiều model sẽ bị loại khỏi context), nhưng tại thời điểm sinh ra thì tính là output. Mẹo nhớ: \"model viết ra cái gì thì trả giá output cho cái đó\".", "k": ["extended thinking", "thinking tokens", "budget_tokens", "output token pricing"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/extended-thinking", "t": "Extended thinking", "s": "Pricing", "n": "Giải thích thinking token được tính như output token và cách tính khi dùng summarized thinking."}, {"u": "https://platform.claude.com/docs/en/about-claude/pricing", "t": "Pricing", "s": "", "n": "Bảng giá input/output theo từng model, cho thấy output token đắt hơn input."}], "f": "Với các model Claude 4 trở lên dùng summarized thinking, bạn bị tính phí theo toàn bộ số thinking token gốc mà model sinh ra, không phải theo độ dài bản tóm tắt hiển thị; vì vậy số output token trên hóa đơn có thể lớn hơn số token bạn thấy trong response.", "ke": [], "ap": ["PA#51", "PB#14", "PC#17"]}, "Q145": {"d": 7, "sv": "Một trợ lý hỗ trợ khách hàng có thể tra cứu đơn hàng qua một tool. Làm sao để đảm bảo người dùng chỉ xem được đơn hàng của chính họ?", "se": "A support assistant can look up orders through a tool. How do you make sure a user can only see their own orders?", "oe": ["Add 'never reveal other customers' data' to the system prompt and rely on it", "Enforce access control in the tool backend using the authenticated user's identity", "Ask the user to promise they are the account owner", "Lower the temperature"], "ov": ["Thêm câu 'never reveal other customers' data' (không bao giờ tiết lộ dữ liệu khách hàng khác) vào system prompt và dựa vào đó", "Thực thi kiểm soát truy cập ở backend của tool, dựa trên danh tính của người dùng đã xác thực", "Yêu cầu người dùng hứa rằng họ là chủ tài khoản", "Giảm temperature"], "on": ["Sai — system prompt không phải ranh giới bảo mật; prompt injection có thể vượt qua, nên không thể chỉ dựa vào nó.", "Đúng — backend kiểm tra quyền theo danh tính đã xác thực trong session, không phụ thuộc vào việc model có bị lừa hay không.", "Sai — lời hứa của người dùng không phải xác thực; ai cũng có thể nói dối.", "Sai — temperature chỉ ảnh hưởng độ ngẫu nhiên của output, không liên quan gì đến kiểm soát truy cập."], "c": [1], "x": "Nguyên tắc cốt lõi: authorization phải được thực thi một cách xác định (deterministic) ở tầng hệ thống, không phải giao cho model. System prompt chỉ là hướng dẫn mềm; prompt injection hoặc jailbreak có thể khiến model gọi tool với `order_id` của người khác. Vì vậy backend của tool phải tự kiểm tra quyền.\n\nCách làm đúng: khi người dùng đăng nhập, ứng dụng biết `user_id` từ session đã xác thực. Tool `get_order` KHÔNG nhận `user_id` từ model, mà backend tự gắn `user_id` từ session rồi truy vấn kiểu `SELECT * FROM orders WHERE id = ? AND owner_id = <session_user>`. Nếu model truyền `order_id` của người khác, backend trả về lỗi \"not found\". Như vậy dù model bị lừa thế nào, dữ liệu vẫn không lộ.\n\nBẫy thường gặp: phương án system prompt nghe hợp lý và thường cũng nên có, nhưng chữ \"rely on it\" (dựa vào đó) là điểm sai: prompt là lớp phòng thủ bổ sung, không phải ranh giới bảo mật. Mẹo nhớ: \"model đề xuất, backend quyết định\"; mọi kiểm tra quyền phải nằm ngoài LLM.", "k": ["access control", "authorization", "tool backend", "prompt injection", "least privilege"], "r": [{"u": "https://genai.owasp.org/llm-top-10/", "t": "OWASP Top 10 for LLM Applications 2025 (LLMRisks Archive - OWASP Gen AI Security Project)", "s": "LLM02: Sensitive Information Disclosure", "n": "Khuyến nghị kiểm soát truy cập chặt ở hệ thống thay vì dựa vào hướng dẫn trong prompt."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks", "t": "Mitigate jailbreaks and prompt injections", "s": "", "n": "Nhắc rằng prompt có thể bị jailbreak, nên cần nhiều lớp bảo vệ bên ngoài model."}], "f": "", "ke": [], "ap": ["PA#52", "PC#43"]}, "Q146": {"d": 6, "sv": "HAI kỹ thuật nào giúp Claude tạo output có định dạng nhất quán?", "se": "Which TWO techniques help Claude produce a consistent output format?", "oe": ["Hide the format requirement", "Raise the temperature", "Specify the required format explicitly", "Provide examples of the expected output", "Reduce max_tokens to 10"], "ov": ["Ẩn yêu cầu về định dạng", "Tăng temperature", "Nêu rõ định dạng yêu cầu một cách tường minh", "Cung cấp ví dụ về output mong đợi", "Giảm `max_tokens` xuống 10"], "on": ["Sai — ẩn yêu cầu khiến model phải đoán định dạng, dẫn đến output không nhất quán.", "Sai — temperature cao tăng độ ngẫu nhiên, làm output kém nhất quán hơn.", "Đúng — định dạng được nêu tường minh (tên field, cấu trúc) giúp Claude tuân thủ ổn định.", "Đúng — ví dụ (few-shot) minh họa chính xác output mong muốn, là cách hiệu quả để định hướng định dạng.", "Sai — `max_tokens` quá nhỏ chỉ làm câu trả lời bị cắt ngang, không cải thiện định dạng."], "c": [2, 3], "x": "Câu hỏi kiểm tra hai kỹ thuật cơ bản trong tài liệu \"Increase output consistency\": (1) chỉ định định dạng mong muốn một cách chính xác, và (2) dùng ví dụ (few-shot/multishot) để minh họa.\n\nVề (1): mô tả rõ ràng cấu trúc output, ví dụ \"Trả về JSON đúng schema `{\"sentiment\": \"positive|negative|neutral\", \"score\": 0.9}`, không thêm giải thích\". Claude tuân theo chỉ dẫn tường minh rất tốt; càng cụ thể (tên field, kiểu dữ liệu, thứ tự) thì càng ổn định. Về (2): 3–5 ví dụ đa dạng, đặt trong thẻ `<example>`, giúp model bắt chước đúng giọng văn, độ dài và cấu trúc. Ví dụ thường hiệu quả hơn mô tả dài dòng vì model \"thấy\" được kết quả cần ra.\n\nBẫy thường gặp: tăng temperature làm output ĐA DẠNG hơn, tức là kém nhất quán; giảm `max_tokens` xuống 10 chỉ khiến câu trả lời bị cắt cụt (`stop_reason` = `\"max_tokens\"`). Nếu cần đảm bảo JSON hợp lệ tuyệt đối, có thể dùng thêm structured outputs hoặc tool use với `input_schema`. Mẹo nhớ: \"nói rõ + cho ví dụ\" là cặp đôi chuẩn cho mọi câu hỏi về tính nhất quán định dạng.", "k": ["output consistency", "few-shot", "multishot prompting", "output format", "structured outputs"], "r": [{"u": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency", "t": "Increase output consistency", "s": "Specify the desired output format", "n": "Hướng dẫn chỉ định định dạng chính xác và dùng ví dụ để ràng buộc output nhất quán."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively", "t": "Prompting best practices — Use examples effectively", "s": "Why use examples?", "n": "Giải thích ví dụ giúp tăng độ chính xác, tính nhất quán và hiệu quả của output."}], "f": "", "ke": [], "ap": ["PA#53", "PB#35", "PC#35"]}, "Q147": {"d": 6, "sv": "Một prompt trộn lẫn chỉ dẫn, ngữ cảnh nền và output mẫu, và Claude đôi khi nhầm lẫn giữa chúng. Cách khắc phục được khuyến nghị là gì?", "se": "A prompt mixes instructions, background context and example outputs, and Claude sometimes confuses them. What is the recommended fix?", "oe": ["Write everything in capital letters", "Repeat the instructions three times", "Wrap each part in descriptive XML tags", "Remove the examples"], "ov": ["Viết tất cả bằng chữ in hoa", "Lặp lại chỉ dẫn ba lần", "Bọc mỗi phần trong các thẻ XML mang tính mô tả", "Bỏ các ví dụ đi"], "on": ["Sai — chữ in hoa không tạo ranh giới giữa các phần, và còn có thể khiến model phản ứng thái quá.", "Sai — lặp lại chỉ dẫn làm prompt dài thêm mà không giúp phân biệt chỉ dẫn, ngữ cảnh và ví dụ.", "Đúng — XML tags mô tả tách bạch từng phần, giúp Claude hiểu đúng vai trò của mỗi đoạn nội dung.", "Sai — ví dụ rất có giá trị; vấn đề là thiếu cấu trúc chứ không phải bản thân ví dụ."], "c": [2], "x": "Kỹ thuật cốt lõi ở đây là dùng XML tags để cấu trúc prompt. Khi prompt chứa nhiều thành phần (instructions, context, examples, data), việc bọc từng phần trong thẻ có tên mô tả giúp Claude phân biệt rõ đâu là chỉ dẫn cần làm theo, đâu là dữ liệu tham khảo, đâu là mẫu cần bắt chước.\n\nVí dụ: `<instructions>Tóm tắt hợp đồng trong 3 ý.<\/instructions>` `<context>Công ty là startup SaaS...<\/context>` `<examples><example>...<\/example><\/examples>` `<contract>{{CONTRACT}}<\/contract>`. Tên thẻ không có danh sách bắt buộc; chỉ cần có nghĩa và dùng nhất quán. Lợi ích kèm theo: dễ sửa từng phần, dễ trích xuất output nếu yêu cầu Claude trả lời trong thẻ như `<answer>`, và giảm nguy cơ Claude coi nội dung ví dụ là chỉ dẫn.\n\nBẫy thường gặp: viết hoa hoặc lặp lại chỉ dẫn là cách \"la to\" với model, không giải quyết được gốc rễ là thiếu ranh giới giữa các phần; với các model mới, ngôn ngữ quá gắt còn dễ gây over-triggering. Bỏ ví dụ thì mất đi kỹ thuật few-shot có giá trị. Mẹo nhớ: \"nhiều thành phần trong một prompt thì dùng XML tags để phân ranh giới\".", "k": ["XML tags", "prompt structure", "few-shot", "context separation"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#structure-prompts-with-xml-tags", "t": "Prompting best practices — Structure prompts with XML tags", "s": "Why use XML tags?", "n": "Giải thích XML tags giúp Claude phân tách rõ các phần của prompt, tăng độ chính xác và dễ chỉnh sửa."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "t": "Prompting best practices", "s": "", "n": "Tổng hợp best practices, bao gồm cấu trúc prompt bằng XML và dùng ví dụ."}], "f": "", "ke": [], "ap": ["PB#2", "PC#25"]}, "Q148": {"d": 4, "sv": "Trước khi bắt đầu tinh chỉnh (iterate) một prompt, bạn nên chuẩn bị điều gì trước tiên?", "se": "Before iterating on a prompt, what should you put in place first?", "oe": ["A production deployment", "Clear success criteria and a test set of representative inputs, including edge cases", "A longer system prompt", "A larger model"], "ov": ["Một bản deploy production", "Tiêu chí thành công rõ ràng và một test set gồm các input đại diện, bao gồm cả edge case", "Một system prompt dài hơn", "Một model lớn hơn"], "on": ["Sai — đưa lên production trước khi có tiêu chí và kiểm thử là rủi ro; production không phải nơi để thử nghiệm prompt.", "Đúng — success criteria và test set đại diện (kèm edge case) là nền tảng để đo lường khách quan mỗi lần sửa prompt.", "Sai — prompt dài hơn không đảm bảo tốt hơn, và không có tiêu chí thì không biết có cải thiện hay không.", "Sai — đổi model là quyết định cần dựa trên eval; không có test set thì không biết model lớn có thực sự cần."], "c": [1], "x": "Anthropic khuyến nghị quy trình prompt engineering bắt đầu bằng việc (1) định nghĩa success criteria rõ ràng và (2) có cách kiểm thử thực nghiệm dựa trên các tiêu chí đó, sau đó mới viết và cải tiến prompt. Không có tiêu chí và test set, bạn không thể biết một thay đổi prompt làm kết quả tốt lên hay xấu đi; mọi đánh giá chỉ là cảm tính.\n\nTiêu chí tốt phải cụ thể, đo được, khả thi và phù hợp, ví dụ: \"phân loại đúng ít nhất 95% ticket trên test set 500 mẫu, tỷ lệ trả JSON lỗi dưới 0,5%, latency p95 dưới 2 giây\". Test set nên phản ánh phân phối thực tế và có cả edge case: input rỗng, quá dài, đa ngôn ngữ, nội dung mơ hồ, dữ liệu sai định dạng hoặc cố tình gây nhiễu. Sau mỗi lần sửa prompt, chạy lại eval để so sánh.\n\nBẫy thường gặp: nhảy thẳng vào production hoặc nâng cấp model trước khi biết vấn đề nằm ở đâu. System prompt dài hơn chưa chắc tốt hơn. Mẹo nhớ thứ tự: \"define success, develop tests, rồi mới engineer prompt\"; câu hỏi nào có chữ \"trước tiên\" thường hướng về success criteria và eval.", "k": ["success criteria", "eval", "test set", "edge cases", "empirical testing"], "r": [{"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "Building strong criteria", "n": "Hướng dẫn xây dựng success criteria cụ thể, đo được, khả thi và phù hợp."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "Building evals and test cases", "n": "Khuyến nghị tạo test case đại diện cho phân phối thực tế, bao gồm cả edge case."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", "t": "Prompt engineering overview", "s": "Before prompt engineering", "n": "Nhấn mạnh cần có success criteria và cách kiểm thử trước khi bắt đầu prompt engineering."}], "f": "", "ke": [], "ap": ["PB#3"]}, "Q149": {"d": 3, "sv": "Bạn muốn Claude Code biết quy ước đặt tên branch và lệnh chạy test của dự án trong mọi phiên làm việc. Nên viết chúng ở đâu?", "se": "You want Claude Code to know the project's branch naming convention and test command in every session. Where should you write them?", "oe": ["In package.json", "In README.md", "In CLAUDE.md at the repository root", "In the chat at the start of each session"], "ov": ["Trong package.json", "Trong README.md", "Trong CLAUDE.md ở thư mục gốc của repository", "Gõ vào chat ở đầu mỗi phiên"], "on": ["Sai — package.json là cấu hình npm, không phải nơi Claude Code đọc quy ước dự án; quy tắc branch không thuộc về đó.", "Sai — README.md dành cho con người và không được Claude Code tự động nạp vào context mỗi phiên.", "Đúng — `CLAUDE.md` ở gốc repo được Claude Code tự động nạp mỗi phiên và có thể chia sẻ cho cả team qua git.", "Sai — gõ lại mỗi phiên tốn công, dễ quên và không nhất quán; đó chính là việc `CLAUDE.md` giải quyết."], "c": [2], "x": "`CLAUDE.md` là file memory đặc biệt mà Claude Code tự động đọc và đưa vào context khi khởi động một phiên trong thư mục dự án. Đây là nơi chuẩn để ghi các thông tin lặp lại: lệnh build/test (ví dụ `npm run test:unit`), quy ước code style, quy tắc đặt tên branch (ví dụ `feature/<ticket>-<mô-tả>`), cách chạy linter, các lưu ý về kiến trúc.\n\n`CLAUDE.md` ở gốc repo là project memory, có thể commit vào git để cả team cùng dùng. Ngoài ra còn có `~/.claude/CLAUDE.md` (user memory, áp dụng cho mọi dự án của bạn) và `CLAUDE.local.md` hoặc các file trong thư mục con. Có thể dùng `/init` để tạo nhanh file khởi đầu, và `/memory` để chỉnh sửa. Nội dung nên ngắn gọn, dạng gạch ý, vì nó chiếm context mỗi phiên.\n\nBẫy thường gặp: README.md là tài liệu cho con người và Claude Code không tự động nạp nó vào mỗi phiên; package.json chứa script nhưng không chứa quy ước branch; gõ lại vào chat mỗi phiên thì tốn công và dễ quên. Mẹo nhớ: \"thông tin muốn Claude Code nhớ ở MỌI phiên thì đưa vào `CLAUDE.md`\".", "k": ["CLAUDE.md", "project memory", "/init", "/memory", "Claude Code"], "r": [{"u": "https://code.claude.com/docs/en/memory", "t": "How Claude remembers your project", "s": "", "n": "Mô tả các loại memory của Claude Code (project, user, local) và cách `CLAUDE.md` được tự động nạp."}, {"u": "https://code.claude.com/docs/en/best-practices", "t": "Best practices for Claude Code", "s": "Create CLAUDE.md files", "n": "Khuyến nghị ghi lệnh thường dùng, code style và quy ước repo (như đặt tên branch) vào `CLAUDE.md`."}], "f": "", "ke": [], "ap": ["PB#10", "PC#13"]}, "Q150": {"d": 2, "sv": "Một request thất bại với HTTP 401 và error type `authentication_error`. Ứng dụng nên làm gì?", "se": "A request fails with HTTP 401 and error type authentication_error. What should the application do?", "oe": ["Switch to streaming", "Reduce the size of the prompt", "Stop retrying and fix the API key configuration", "Retry with exponential backoff until it succeeds"], "ov": ["Chuyển sang streaming", "Giảm kích thước prompt", "Ngừng retry và sửa cấu hình API key", "Retry với exponential backoff cho đến khi thành công"], "on": ["Sai — streaming không liên quan đến xác thực; request streaming với key sai vẫn nhận 401.", "Sai — kích thước prompt không ảnh hưởng xác thực; lỗi quá lớn là 413, không phải 401.", "Đúng — 401 là lỗi bền vững do key; retry vô ích, phải sửa cấu hình API key.", "Sai — 401 không phải lỗi tạm thời; retry bao nhiêu lần cũng thất bại và lãng phí tài nguyên."], "c": [2], "x": "HTTP 401 `authentication_error` nghĩa là có vấn đề với API key: thiếu header `x-api-key`, key sai, key đã bị thu hồi hoặc thuộc workspace khác. Đây là lỗi phía client và mang tính bền vững (non-transient): gửi lại y nguyên bao nhiêu lần cũng vẫn nhận 401. Vì vậy hành động đúng là dừng retry, ghi log/cảnh báo và sửa cấu hình (kiểm tra biến môi trường `ANTHROPIC_API_KEY`, secret manager, key còn hiệu lực trong Console).\n\nPhân loại để đi thi: lỗi nên retry với backoff là 429 `rate_limit_error`, 500 `api_error`, 529 `overloaded_error` (và lỗi mạng/timeout). Lỗi KHÔNG nên retry mà phải sửa: 400 `invalid_request_error` (sửa request), 401 `authentication_error` (sửa key), 403 `permission_error` (sửa quyền), 404 `not_found_error` (sửa model/endpoint), 413 `request_too_large` (giảm kích thước). SDK chính thức cũng không tự retry lỗi 401.\n\nBẫy thường gặp: chọn \"retry với backoff\" vì nghĩ đó là phản xạ chung cho mọi lỗi. Retry lỗi xác thực chỉ lãng phí tài nguyên và che giấu sự cố cấu hình. Mẹo nhớ: \"4xx do bạn thì sửa, 429/5xx do tải thì đợi và thử lại\".", "k": ["authentication_error", "HTTP 401", "x-api-key", "non-retryable error", "error handling"], "r": [{"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "HTTP errors", "n": "Liệt kê 401 `authentication_error` là lỗi do API key, cùng các mã lỗi khác."}, {"u": "https://support.claude.com/en/articles/9767949-api-key-best-practices-keeping-your-keys-safe-and-secure", "t": "API Key Best Practices: Keeping Your Keys Safe and Secure", "s": "", "n": "Hướng dẫn quản lý, lưu trữ và xoay vòng API key an toàn."}], "f": "", "ke": [], "ap": ["PB#15", "PC#14"]}, "Q151": {"d": 1, "sv": "Một quy trình soạn hợp đồng luôn chạy cùng ba bước theo thứ tự: trích xuất thông tin, viết bản nháp, rà soát điều khoản. Kiến trúc nào phù hợp nhất?", "se": "A contract-drafting process always runs the same three steps in order: extract the details, write the draft, review the clauses. Which architecture fits best?", "oe": ["Orchestrator-workers", "An autonomous agent that decides its own next step", "A prompt-chaining workflow, one call per step", "Several agents that debate and then vote"], "ov": ["Orchestrator-workers", "Một agent tự chủ tự quyết định bước tiếp theo", "Một workflow prompt chaining, mỗi bước một lần gọi", "Nhiều agent tranh luận rồi bỏ phiếu"], "on": ["Sai — orchestrator-workers dành cho subtask được quyết định động; ở đây các bước đã cố định nên phức tạp không cần thiết.", "Sai — agent tự chủ phù hợp khi không đoán trước được số bước; với quy trình cố định nó chỉ thêm chi phí và rủi ro.", "Đúng — chuỗi bước cố định theo thứ tự chính là định nghĩa của prompt chaining, mỗi bước một lần gọi đơn giản và dễ kiểm soát.", "Sai — voting giúp tăng độ tin cậy cho một quyết định, không phải để tổ chức quy trình tuần tự nhiều bước."], "c": [2], "x": "Prompt chaining phân rã tác vụ thành một chuỗi bước cố định, output của bước trước là input của bước sau. Anthropic khuyến nghị dùng nó khi tác vụ có thể chia gọn gàng thành các subtask cố định; mỗi lần gọi LLM trở nên đơn giản hơn nên độ chính xác cao hơn, đổi lại latency tăng một chút. Có thể chèn \"gate\" kiểm tra bằng code giữa các bước.\n\nVới bài toán này: Call 1 trích xuất bên ký, giá trị, thời hạn ra JSON; code kiểm tra đủ trường; Call 2 dùng JSON đó viết bản nháp; Call 3 rà soát điều khoản và đánh dấu rủi ro. Mỗi bước có prompt riêng, dễ test và debug riêng.\n\nBẫy thường gặp: chọn agent tự chủ hoặc orchestrator-workers vì nghe \"xịn\" hơn. Nguyên tắc của Anthropic là chọn giải pháp đơn giản nhất đáp ứng được yêu cầu; agent chỉ hợp khi số bước không đoán trước được. Ở đây các bước đã biết trước và luôn theo cùng thứ tự, nên workflow cố định rẻ hơn, nhanh hơn và dự đoán được hơn. Mẹo nhớ: \"luôn cùng các bước, cùng thứ tự\" là tín hiệu của prompt chaining.", "k": ["prompt chaining", "workflow vs agent", "gate", "simplicity"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Prompt chaining", "n": "Định nghĩa prompt chaining và khuyến nghị dùng khi tác vụ chia được thành các subtask cố định."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#chain-complex-prompts", "t": "Prompting best practices — Chain complex prompts", "s": "", "n": "Hướng dẫn chain nhiều prompt, mỗi bước một nhiệm vụ rõ ràng, dùng XML để truyền output giữa các bước."}], "f": "", "ke": [], "ap": ["PB#19", "PC#31"]}, "Q152": {"d": 1, "sv": "Một hộp thư hỗ trợ nhận yêu cầu hoàn tiền, câu hỏi kỹ thuật và câu hỏi thanh toán. Mỗi loại cần một prompt chuyên biệt và bộ tool khác nhau. Pattern nào phù hợp?", "se": "A support inbox receives refund requests, technical questions and billing questions. Each type needs a different specialised prompt and tool set. Which pattern fits?", "oe": ["Prompt chaining: run all three prompts in sequence on every request", "Evaluator-optimizer", "Routing: classify the request, then send it to the matching specialised prompt", "A single generic prompt that covers every case"], "ov": ["Prompt chaining: chạy lần lượt cả ba prompt trên mọi yêu cầu", "Evaluator-optimizer", "Routing: phân loại yêu cầu, rồi chuyển đến prompt chuyên biệt tương ứng", "Một prompt tổng quát duy nhất bao quát mọi trường hợp"], "on": ["Sai — chạy cả ba prompt trên mọi yêu cầu là lãng phí; chaining dành cho các bước nối tiếp, không phải chọn nhánh.", "Sai — evaluator-optimizer là vòng lặp sinh và đánh giá để cải thiện output, không dùng để phân loại yêu cầu.", "Đúng — routing phân loại rồi chuyển đến prompt và bộ tool chuyên biệt, đúng ví dụ customer service của Anthropic.", "Sai — một prompt chung khó tối ưu cho mọi loại; cải thiện loại này thường làm giảm chất lượng loại khác."], "c": [2], "x": "Routing phân loại input rồi chuyển nó đến một tác vụ tiếp theo chuyên biệt. Anthropic mô tả routing phù hợp với tác vụ phức tạp có các nhóm (category) rõ ràng, nên xử lý riêng, và việc phân loại có thể làm chính xác bằng LLM hoặc model/thuật toán phân loại truyền thống. Ví dụ kinh điển chính là customer service: câu hỏi chung, yêu cầu hoàn tiền, hỗ trợ kỹ thuật được chuyển vào các quy trình, prompt và tool khác nhau.\n\nCách làm: Call 1 (có thể dùng model nhỏ, rẻ) trả về `{\"category\": \"refund\"}`; code chọn prompt và bộ tool tương ứng, ví dụ nhánh refund có tool `lookup_order`, `issue_refund`, nhánh kỹ thuật có `search_kb`. Lợi ích: mỗi prompt được tối ưu riêng mà không làm giảm chất lượng các loại khác, và mỗi nhánh chỉ có đúng tool cần thiết (least privilege).\n\nBẫy thường gặp: một prompt chung khổng lồ thường khiến tối ưu loại này lại làm hỏng loại kia; chạy cả ba prompt tuần tự trên mọi request thì lãng phí và không hợp lý. Mẹo nhớ: \"nhiều loại input khác nhau, mỗi loại cần xử lý riêng\" là tín hiệu của routing.", "k": ["routing", "classification", "specialized prompts", "workflow"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Routing", "n": "Mô tả routing và lấy ví dụ phân loại câu hỏi customer service vào các quy trình, prompt và tool khác nhau."}], "f": "", "ke": [], "ap": ["PB#22", "PC#30"]}, "Q153": {"d": 2, "sv": "Một request thất bại với HTTP 529 và error type `overloaded_error`. Điều này có nghĩa là gì?", "se": "A request fails with HTTP 529 and error type overloaded_error. What does this mean?", "oe": ["Your organization exceeded its rate limit", "The API is temporarily overloaded; retry later with backoff", "Your API key is invalid", "The request body is malformed"], "ov": ["Tổ chức của bạn đã vượt rate limit", "API đang tạm thời quá tải; hãy retry sau với backoff", "API key của bạn không hợp lệ", "Request body bị sai định dạng"], "on": ["Sai — vượt rate limit của tổ chức là 429 `rate_limit_error`, không phải 529.", "Đúng — 529 `overloaded_error` nghĩa là API tạm thời quá tải; nên retry sau với backoff.", "Sai — API key không hợp lệ trả về 401 `authentication_error`.", "Sai — request sai định dạng trả về 400 `invalid_request_error`."], "c": [1], "x": "HTTP 529 `overloaded_error` cho biết API đang tạm thời quá tải do lưu lượng cao trên toàn hệ thống, không phải do riêng tài khoản của bạn. Đây là lỗi tạm thời (transient), nên cách xử lý đúng là retry sau một khoảng chờ với exponential backoff và jitter. SDK chính thức cũng tự động retry lỗi này một số lần.\n\nĐiểm dễ nhầm nhất trong đề thi: 429 và 529. 429 `rate_limit_error` là do TÀI KHOẢN/tổ chức của bạn vượt giới hạn (RPM, input/output token per minute); response có header `retry-after` cho biết cần chờ bao lâu. 529 `overloaded_error` là do PHÍA Anthropic quá tải chung, không liên quan đến hạn mức của bạn. Cả hai đều nên retry với backoff, nhưng nguyên nhân khác nhau. Với ứng dụng quan trọng, có thể cân nhắc thêm fallback sang model khác hoặc đưa việc vào queue nếu 529 kéo dài.\n\nNgoài ra, khi dùng streaming, lỗi overloaded có thể xuất hiện dưới dạng sự kiện `error` giữa luồng SSE sau khi đã nhận 200. Mẹo nhớ: \"429 là do bạn gửi nhiều, 529 là do server đông\"; 401 là key, 400 là request sai.", "k": ["overloaded_error", "HTTP 529", "rate_limit_error", "exponential backoff", "jitter"], "r": [{"u": "https://platfo
