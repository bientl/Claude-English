structions are written only once. Which design keeps each customer's data out of the other investigation while still reusing the instructions?", "oe": ["Use one shared conversation and tell each agent in the system prompt to ignore the other customer.", "Run each investigation in its own conversation with the same instructions in its system prompt.", "Keep separate conversations but sync both histories after each tool call so analysts can compare.", "Keep separate conversations and give both agents one shared scratchpad for the facts they find."], "ov": ["Dùng một conversation chung và dặn mỗi agent trong system prompt bỏ qua khách hàng còn lại.", "Chạy mỗi cuộc điều tra trong conversation riêng, với cùng bộ hướng dẫn trong system prompt.", "Giữ conversation riêng nhưng đồng bộ cả hai lịch sử sau mỗi tool call để analyst so sánh.", "Giữ conversation riêng và cho cả hai agent dùng chung một scratchpad để ghi các dữ kiện tìm được."], "on": ["Sai — dữ liệu hai khách hàng vẫn nằm chung một context; lời dặn bỏ qua không đảm bảo ngăn rò rỉ hay ảnh hưởng chéo.", "Đúng — conversation riêng cô lập dữ liệu từng khách hàng, còn system prompt chung cho phép tái sử dụng hướng dẫn (có thể kết hợp prompt caching).", "Sai — đồng bộ lịch sử sau mỗi tool call đưa dữ liệu khách hàng này vào context của cuộc điều tra kia, phá vỡ sự cô lập.", "Sai — scratchpad chung là kênh chia sẻ dữ kiện giữa hai cuộc điều tra, làm dữ liệu khách hàng bị trộn lẫn."], "c": [1], "x": "Ý chính: tái sử dụng hướng dẫn và cô lập dữ liệu khách hàng không mâu thuẫn nhau. Hướng dẫn là phần tĩnh, có thể dùng lại ở bao nhiêu conversation cũng được (một template system prompt chung), còn dữ liệu khách hàng là phần động, phải nằm trong context riêng của từng cuộc điều tra. Claude chỉ \"thấy\" những gì có trong context của request hiện tại, nên conversation riêng là ranh giới cô lập tự nhiên và chắc chắn.\n\nTriển khai: lưu bộ hướng dẫn thành một hằng số `INVESTIGATION_INSTRUCTIONS`, mỗi phiên điều tra gửi `system=INVESTIGATION_INSTRUCTIONS` và mảng `messages` riêng chỉ chứa dữ liệu của khách hàng đó. Bonus: vì prefix system prompt giống hệt nhau, bạn có thể đặt `cache_control` để prompt caching tái sử dụng phần hướng dẫn dài, giảm chi phí và độ trễ. Đây là cách \"viết một lần\" đúng nghĩa ở tầng kỹ thuật.\n\nBẫy: phương án 1 dựa vào lời dặn \"ignore the other customer\", nhưng dữ liệu vẫn nằm chung context; model có thể bị ảnh hưởng hoặc lộ dữ liệu, và với ngân hàng đó là vi phạm bảo mật. Phương án 3 và 4 đều tạo kênh rò rỉ (đồng bộ lịch sử, scratchpad chung). Mẹo: cô lập dữ liệu phải bằng kiến trúc, không bằng lời dặn trong prompt.", "k": ["context isolation", "system prompt", "data separation", "prompt caching"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#give-claude-a-role", "t": "Prompting best practices — Give Claude a role", "s": "", "n": "Mô tả cách dùng system prompt để đặt vai trò và hướng dẫn chung, tách khỏi nội dung từng lượt hội thoại."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "t": "Prompt caching", "s": "", "n": "Prefix giống nhau như system prompt dùng chung có thể được cache để tái sử dụng giữa nhiều request."}, {"u": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", "t": "Effective context engineering for AI agents", "s": "", "n": "Thảo luận việc quản lý chặt chẽ những gì đưa vào context của agent."}], "f": "", "ke": ["Reusing instructions and isolating customer data are compatible: the instructions are shared, and each customer's data stays in a separate conversation."], "ap": ["M20#2"]}, "Q076": {"d": 1, "sv": "Một agent onboarding mở tài khoản khách hàng. Nó tạm dừng trong khi khách hàng tải lên giấy tờ tùy thân, và khi task tiếp tục, một worker process khác có thể nhận xử lý. Trong một sự cố, một worker đã tạo tài khoản rồi bị timeout trước khi ghi nhận bước đó đã xong, nên worker tiếp theo chạy lại bước đó. HAI thay đổi nào cho phép bất kỳ worker nào tiếp tục task một cách an toàn?", "se": "An onboarding agent opens customer accounts. It pauses while the customer uploads identity documents, and when the task resumes, a different worker process may pick it up. In one incident, a worker created the account, then timed out before recording that the step was done, so the next worker ran the step again. Which TWO changes let any worker resume the task safely?", "oe": ["Save the outstanding document requests and approval status in a shared database that every worker reads.", "Keep the task's progress in the first worker's memory and route the resumed task back to that worker.", "Record each completed account action with its idempotency key and reuse that key whenever a step is retried.", "Restart the task from the beginning on the new worker and give each account action a fresh operation ID."], "ov": ["Lưu các yêu cầu giấy tờ còn chờ và trạng thái phê duyệt vào một database dùng chung mà mọi worker đều đọc.", "Giữ tiến độ task trong bộ nhớ của worker đầu tiên và định tuyến task được tiếp tục về lại worker đó.", "Ghi lại mỗi action tài khoản đã hoàn thành kèm idempotency key và dùng lại key đó mỗi khi retry một bước.", "Khởi động lại task từ đầu trên worker mới và cấp cho mỗi action tài khoản một operation ID mới."], "on": ["Đúng — state lưu trong database dùng chung cho phép bất kỳ worker nào đọc tiến độ và tiếp tục task.", "Sai — state trong bộ nhớ một worker sẽ mất khi worker đó chết hoặc timeout, và định tuyến cố định làm mất khả năng chịu lỗi.", "Đúng — idempotency key ổn định giúp nhận ra action đã chạy dù chưa kịp ghi hoàn thành, nên retry không tạo tài khoản trùng.", "Sai — chạy lại từ đầu với operation ID mới khiến action tạo tài khoản bị coi là mới, gây đúng lỗi trùng lặp như sự cố."], "c": [0, 2], "x": "Câu này kiểm tra hai yêu cầu của agent chạy dài (long-running) và có thể tạm dừng/tiếp tục: (1) state phải được lưu bền vững ở nơi mọi worker cùng đọc được, và (2) các action có side effect phải idempotent để chạy lại không gây trùng lặp.\n\nĐáp án 1 giải quyết tính tiếp tục được: state (giấy tờ còn chờ, trạng thái phê duyệt, bước đã xong) nằm trong database dùng chung thay vì trong RAM của một process, nên worker nào cũng có thể nhặt task lên. Đáp án 3 giải quyết đúng sự cố trong đề: worker tạo tài khoản xong nhưng timeout trước khi ghi \"done\". Nếu mỗi action dùng một idempotency key ổn định, ví dụ `create_account:task_123`, và gửi kèm key đó cho API tạo tài khoản, thì khi worker sau retry với cùng key, hệ thống nhận ra action đã chạy và trả về kết quả cũ thay vì tạo tài khoản thứ hai.\n\nBẫy: phương án 4 nghe như \"làm lại sạch sẽ\" nhưng operation ID mới khiến hệ thống coi là action mới, nên tạo trùng tài khoản. Phương án 2 (sticky worker) thất bại ngay khi worker đó chết. Mẹo nhớ: resume an toàn = shared durable state + idempotency key ổn định khi retry.", "k": ["idempotency key", "durable state", "long-running agent", "safe retry"], "r": [{"u": "https://www.anthropic.com/engineering/multi-agent-research-system", "t": "How we built our multi-agent research system", "s": "", "n": "Thảo luận thách thức của agent chạy dài có state, cần khả năng tiếp tục từ điểm lỗi thay vì khởi động lại từ đầu."}, {"u": "https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter", "t": "Timeouts, retries, and backoff with jitter", "s": "", "n": "Nhấn mạnh retry chỉ an toàn khi thao tác là idempotent, tránh tạo side effect trùng lặp."}], "f": "", "ke": ["Safe resumption needs two things: progress stored where every worker can read it, and a way to recognize an account action that already ran even though its completion was never recorded."], "ap": ["M20#3"]}, "Q077": {"d": 5, "sv": "Một team dùng Claude để gán nhãn phản hồi khách hàng là tích cực, tiêu cực hoặc lẫn lộn. Khi gửi cùng một bình luận ở ranh giới nhiều lần, Claude đôi khi trả về các nhãn khác nhau nhưng đều hợp lý. Quản lý cho rằng prompt giống hệt nhau phải luôn cho kết quả giống hệt nhau và yêu cầu developer giải thích. Developer nên nói gì với quản lý?", "se": "A team uses Claude to label customer feedback as positive, negative or mixed. When they send the same borderline comment several times, Claude sometimes returns different but reasonable labels. The manager believes identical prompts should always produce identical results and asks the developer to explain. What should the developer tell the manager?", "oe": ["The different labels point to a network retry fault, so duplicate responses should be filtered out.", "Claude's output is probabilistic, so the team should test repeated runs to measure consistency.", "The first label Claude returns is its main answer, so the application should keep only the first one.", "Setting temperature to 0 guarantees the same label every time, so no further testing is needed."], "ov": ["Các nhãn khác nhau cho thấy lỗi network retry, nên cần lọc bỏ các response trùng lặp.", "Đầu ra của Claude mang tính xác suất, nên team cần test nhiều lần chạy lặp lại để đo độ nhất quán.", "Nhãn đầu tiên Claude trả về là câu trả lời chính, nên ứng dụng chỉ giữ nhãn đầu tiên.", "Đặt temperature bằng 0 đảm bảo luôn ra cùng một nhãn, nên không cần test thêm."], "on": ["Sai — các nhãn khác nhau đến từ bản chất lấy mẫu xác suất của model, không phải lỗi network; lọc response không giải quyết gì.", "Đúng — đầu ra của Claude không hoàn toàn tất định, nên cần đo độ nhất quán bằng chạy lặp lại trên dữ liệu đại diện và cải thiện bằng quy tắc rõ ràng.", "Sai — nhãn đầu tiên không có ưu tiên gì về độ chính xác; giữ nhãn đầu chỉ che giấu vấn đề không nhất quán.", "Sai — temperature 0 giảm biến động nhưng không đảm bảo kết quả hoàn toàn giống nhau, nên vẫn cần test."], "c": [1], "x": "Nguyên tắc cốt lõi: LLM sinh văn bản bằng cách lấy mẫu (sampling) theo phân phối xác suất, nên đầu ra không hoàn toàn tất định (non-deterministic). Với các trường hợp ranh giới như một bình luận vừa khen vừa chê, nhiều nhãn đều có xác suất đáng kể, nên kết quả có thể dao động giữa các lần chạy.\n\nVì vậy độ tin cậy phải được đo bằng thực nghiệm: chạy cùng một bộ ví dụ đại diện nhiều lần (ví dụ 10 lần mỗi mẫu), tính tỷ lệ nhất quán, rồi cải thiện bằng các kỹ thuật trong \"Increase consistency\": định nghĩa rõ tiêu chí từng nhãn (ví dụ \"mixed khi có cả khen và chê rõ ràng\"), thêm few-shot examples cho các ca ranh giới, ép định dạng đầu ra (structured outputs), giảm temperature. Nếu cần, có thể dùng voting (chạy nhiều lần và lấy đa số).\n\nBẫy lớn nhất là phương án temperature = 0. Temperature thấp làm đầu ra ổn định hơn, nhưng tài liệu Anthropic nói rõ ngay cả với temperature 0, kết quả vẫn không hoàn toàn tất định. Từ \"guarantees\" và \"no further testing\" là dấu hiệu sai. Mẹo nhớ: \"probabilistic → measure with repeated tests\".", "k": ["non-determinism", "temperature", "consistency testing", "eval"], "r": [{"u": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency", "t": "Increase output consistency", "s": "", "n": "Đưa ra các kỹ thuật tăng độ nhất quán như chỉ định định dạng đầu ra, dùng ví dụ và ràng buộc vai trò."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "", "n": "Hướng dẫn xây eval với nhiều ca kiểm thử, bao gồm edge case, để đo hiệu năng thực tế."}, {"u": "https://platform.claude.com/docs/en/api/messages", "t": "Messages - Claude API Reference", "s": "", "n": "Mô tả tham số `temperature` và lưu ý ngay cả temperature 0 kết quả cũng không hoàn toàn tất định."}], "f": "", "ke": ["Claude's output is not fully deterministic, so label reliability has to be measured with repeated, representative tests and managed with clear task rules."], "ap": ["M20#4"]}, "Q078": {"d": 7, "sv": "Một công cụ báo cáo phục vụ nhiều công ty khách hàng. Hiện tại nó đặt một API token quản trị viên duy nhất trong system prompt, và Claude chèn token đó vào các tool call để lấy dữ liệu của từng khách hàng. Thiết kế credential nào nên thay thế cách này?", "se": "A reporting tool serves many customer companies. Today it places one administrator API token in the system prompt, and Claude includes that token in tool calls to fetch each customer's data. Which credential design should replace this?", "oe": ["The host issues short-lived credentials scoped to each customer and adds them when it runs tools.", "The host keeps the administrator token in a secret store and adds it when it runs any tool.", "The system prompt holds a separate long-lived token per customer, and Claude picks the right one.", "The token is encrypted in the system prompt, and the tool code decrypts it before each call."], "ov": ["Host cấp credential ngắn hạn, giới hạn phạm vi theo từng khách hàng, và tự gắn chúng vào khi chạy tool.", "Host giữ token quản trị viên trong secret store và gắn nó vào khi chạy bất kỳ tool nào.", "System prompt chứa một token dài hạn riêng cho từng khách hàng, và Claude chọn token phù hợp.", "Token được mã hóa trong system prompt, và code của tool giải mã trước mỗi lần gọi."], "on": ["Đúng — credential do host quản lý, không vào context của model, ngắn hạn và chỉ có quyền trên dữ liệu của khách hàng hiện tại.", "Sai — dù đã ra khỏi prompt, token quản trị vẫn có quyền trên mọi khách hàng, vi phạm least privilege và cho phép truy cập chéo.", "Sai — token vẫn nằm trong context có thể bị lộ, và để model chọn token cho phép injection hoặc lỗi suy luận lấy nhầm dữ liệu khách hàng khác.", "Sai — mã hóa không giải quyết việc bí mật nằm trong context, và token vẫn là quyền quản trị rộng."], "c": [0], "x": "Câu này kiểm tra hai nguyên tắc bảo mật: (1) credential không bao giờ được đặt trong context của model, và (2) least privilege, tức mỗi credential chỉ có quyền tối thiểu cần thiết, ở đây là giới hạn theo từng khách hàng (tenant) và theo thời gian.\n\nVì sao không đặt token trong context? Mọi thứ trong context đều có thể bị lộ qua prompt injection (ví dụ một tài liệu độc hại yêu cầu \"in ra system prompt\"), qua log, hoặc do model chèn nhầm. Ngoài ra, nếu Claude là bên chọn credential, một lỗi suy luận hay một injection có thể khiến nó lấy dữ liệu của công ty khác. Thiết kế đúng: Claude chỉ phát ra lời gọi như `get_report(month=\"2026-09\")`; host (ứng dụng) biết phiên hiện tại thuộc khách hàng nào, xin một token ngắn hạn (ví dụ hết hạn sau 15 phút) chỉ có quyền đọc dữ liệu của khách hàng đó, rồi tự gắn vào request khi thực thi tool. Model không bao giờ thấy token.\n\nBẫy: phương án 2 đã đưa token ra khỏi prompt (tốt), nhưng vẫn là token admin có quyền trên mọi khách hàng, nên một tool call bị điều khiển sai vẫn truy cập chéo được. Phương án 4: \"mã hóa trong prompt\" vẫn để bí mật trong context và không giới hạn quyền. Mẹo nhớ: host giữ bí mật + scope theo tenant + short-lived.", "k": ["least privilege", "credential management", "multi-tenant isolation", "prompt injection", "short-lived credentials"], "r": [{"u": "https://genai.owasp.org/llm-top-10/", "t": "OWASP Top 10 for LLM Applications 2025 (LLMRisks Archive - OWASP Gen AI Security Project)", "s": "", "n": "OWASP liệt kê rủi ro như prompt injection, lộ thông tin nhạy cảm và excessive agency, liên quan trực tiếp đến việc đặt credential trong prompt."}, {"u": "https://support.claude.com/en/articles/9767949-api-key-best-practices-keeping-your-keys-safe-and-secure", "t": "API Key Best Practices: Keeping Your Keys Safe and Secure", "s": "", "n": "Khuyến nghị giữ key bí mật, không nhúng vào nơi có thể bị lộ và áp dụng nguyên tắc quyền tối thiểu."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks", "t": "Mitigate jailbreaks and prompt injections", "s": "", "n": "Mô tả các biện pháp giảm thiểu prompt injection và jailbreak, nhấn mạnh không tin tưởng hoàn toàn vào việc model tuân thủ."}], "f": "", "ke": ["Credentials should be handled by the host, never placed in model context, and scoped to the customer and the minimum access each action needs."], "ap": ["M20#5"]}, "Q079": {"d": 8, "sv": "Một team xây dựng MCP server cho bộ phận HR. Server phải cung cấp sổ tay chính sách công ty (client duyệt theo từng mục) và một công cụ tính lương nhận đầu vào là lương và số giờ làm của nhân viên rồi trả về lương thực nhận. Server nên expose hai khả năng này như thế nào?", "se": "A team is building an MCP server for HR. It must offer the company policy handbook, which clients browse section by section, and a payroll calculator that takes an employee's salary and hours and returns take-home pay. How should the server expose these two capabilities?", "oe": ["Expose both as prompts, since each of them returns text that Claude reads and uses.", "Expose both as resources, since clients read the results that each one of them returns.", "Expose the handbook as a tool that returns sections on request, and the calculator as a resource.", "Expose the handbook sections as resources and the calculator as a tool with typed inputs."], "ov": ["Expose cả hai dưới dạng prompts, vì mỗi cái đều trả về text để Claude đọc và sử dụng.", "Expose cả hai dưới dạng resources, vì client đọc kết quả mà mỗi cái trả về.", "Expose sổ tay dưới dạng tool trả về các mục theo yêu cầu, và công cụ tính lương dưới dạng resource.", "Expose các mục của sổ tay dưới dạng resources và công cụ tính lương dưới dạng tool có input được định kiểu."], "on": ["Sai — prompts là template tương tác do người dùng kích hoạt, không phải nơi cung cấp dữ liệu tham khảo hay thực hiện tính toán.", "Sai — công cụ tính lương nhận đầu vào và thực hiện tính toán, nên là tool chứ không phải dữ liệu chỉ đọc.", "Sai — đảo ngược vai trò: sổ tay là dữ liệu chỉ đọc (resource), còn tính lương là thao tác nhận input (tool).", "Đúng — các mục sổ tay là dữ liệu để duyệt và đọc (resources), còn công cụ tính lương là thao tác có tham số được định kiểu (tool)."], "c": [3], "x": "MCP có ba primitive phía server và cần chọn theo bản chất của khả năng: resources là dữ liệu chỉ đọc, cung cấp context, được nhận diện bằng URI và thường do ứng dụng/người dùng chọn đưa vào; tools là thao tác có thể thực thi, nhận tham số theo `inputSchema` (JSON Schema) và do model quyết định gọi; prompts là template tương tác tái sử dụng, thường do người dùng kích hoạt (như slash command).\n\nSổ tay chính sách là dữ liệu tĩnh để đọc, client duyệt theo từng mục, nên phù hợp với resources, ví dụ mỗi mục có URI như `hr://handbook/leave-policy`, client liệt kê bằng `resources/list` và đọc bằng `resources/read`. Công cụ tính lương nhận đầu vào và thực hiện tính toán, nên là tool, ví dụ `calculate_take_home_pay` với `inputSchema` gồm `salary` (number) và `hours` (number), được gọi qua `tools/call`. Input có kiểu rõ ràng giúp Claude truyền tham số đúng và server validate được.\n\nBẫy: lập luận \"cả hai đều trả về text\" hay \"client đều đọc kết quả\" nghe hợp lý nhưng sai tiêu chí; mọi primitive đều trả về nội dung, điểm khác là dữ liệu để đọc hay thao tác nhận input. Phương án 3 đảo ngược hoàn toàn. Mẹo nhớ: resources = danh từ (dữ liệu), tools = động từ (hành động), prompts = template.", "k": ["MCP", "resources", "tools", "prompts", "inputSchema"], "r": [{"u": "https://modelcontextprotocol.io/docs/learn/server-concepts", "t": "Understanding MCP servers", "s": "", "n": "Giải thích ba primitive của server (tools, resources, prompts), ai điều khiển từng loại và khi nào dùng."}, {"u": "https://modelcontextprotocol.io/specification/2025-06-18/server/resources", "t": "Resources (MCP spec 2025-06-18)", "s": "", "n": "Đặc tả resources: dữ liệu được nhận diện bằng URI, liệt kê qua `resources/list` và đọc qua `resources/read`."}, {"u": "https://modelcontextprotocol.io/specification/2025-06-18/server/tools", "t": "Tools (MCP spec 2025-06-18)", "s": "", "n": "Đặc tả tools với `inputSchema` dạng JSON Schema và cách gọi qua `tools/call`."}], "f": "", "ke": ["Choose MCP primitives by what the capability is: resources for data to read, and tools for operations that take inputs and do work."], "ap": ["M20#6"]}, "Q080": {"d": 3, "sv": "Một CI pipeline cần chạy Claude Code mà không có terminal tương tác, thu đầu ra mà script có thể parse, và ngăn mọi thay đổi file mà team chưa phê duyệt. HAI lựa chọn cấu hình nào đáp ứng các yêu cầu này?", "se": "A CI pipeline needs to run Claude Code with no interactive terminal, collect output that a script can parse, and prevent any file changes the team has not approved. Which TWO setup choices meet these needs?", "oe": ["Run Claude Code in non-interactive mode with the -p flag instead of an interactive session.", "Pass an explicit list of allowed tools and request JSON with --output-format json.", "Skip permission prompts with --dangerously-skip-permissions, since CI runners are discarded.", "Start an interactive session and drive it with a script that types prompts and answers."], "ov": ["Chạy Claude Code ở chế độ non-interactive với cờ `-p` thay vì phiên tương tác.", "Truyền danh sách allowed tools tường minh và yêu cầu JSON với `--output-format json`.", "Bỏ qua permission prompt bằng `--dangerously-skip-permissions`, vì CI runner sẽ bị hủy sau khi chạy.", "Mở một phiên tương tác và điều khiển nó bằng script gõ prompt và câu trả lời."], "on": ["Đúng — `-p` chạy Claude Code non-interactive, nhận prompt, in kết quả rồi thoát, phù hợp môi trường CI không có terminal.", "Đúng — danh sách allowed tools giới hạn những gì Claude được làm, còn `--output-format json` tạo đầu ra máy đọc được cho script.", "Sai — cờ này tắt mọi kiểm tra quyền, cho phép thay đổi chưa phê duyệt, trái ngược trực tiếp với yêu cầu.", "Sai — điều khiển phiên tương tác bằng script giả lập gõ phím rất mong manh và không tạo đầu ra có cấu trúc đáng tin cậy."], "c": [0, 1], "x": "Câu này kiểm tra cách chạy Claude Code trong CI/automation (headless mode). Ba yêu cầu tương ứng với các cấu hình cụ thể: không có terminal → chế độ non-interactive với `-p` (print mode), chạy một prompt rồi thoát; đầu ra parse được → `--output-format json` (trả về object JSON gồm kết quả, session id, chi phí...) hoặc `stream-json`; ngăn thay đổi chưa duyệt → giới hạn tool bằng `--allowedTools` (hoặc cấu hình permissions trong `.claude/settings.json`) chỉ cho phép những gì team đồng ý.\n\nVí dụ: `claude -p \"Review the diff and list risky changes\" --allowedTools \"Read,Grep,Glob\" --output-format json > result.json`. Ở đây Claude chỉ đọc được, không có `Edit`/`Write` hay `Bash` tùy ý, và script CI dùng `jq` để parse `result.json`. Trong chế độ `-p`, tool không được phép sẽ không được chạy vì không có người để duyệt prompt.\n\nBẫy: `--dangerously-skip-permissions` bỏ qua toàn bộ kiểm tra quyền, mâu thuẫn trực tiếp với yêu cầu \"prevent unapproved file changes\"; runner bị hủy không ngăn được việc sửa code rồi commit, đọc secret hay gọi mạng. Script giả lập gõ phím vào phiên tương tác thì mong manh và không có output có cấu trúc. Mẹo nhớ: CI = `-p` + `--output-format json` + `--allowedTools`.", "k": ["headless mode", "-p", "--output-format json", "--allowedTools", "permissions"], "r": [{"u": "https://code.claude.com/docs/en/headless", "t": "Run Claude Code programmatically", "s": "", "n": "Hướng dẫn chạy Claude Code non-interactive với `-p`, chọn `--output-format` (text, json, stream-json) và giới hạn tool cho automation."}, {"u": "https://code.claude.com/docs/en/cli-reference", "t": "CLI reference", "s": "", "n": "Liệt kê các cờ CLI như `-p`, `--output-format`, `--allowedTools` và `--dangerously-skip-permissions`."}, {"u": "https://code.claude.com/docs/en/permissions", "t": "Configure permissions", "s": "", "n": "Mô tả cơ chế permission rules allow/deny để kiểm soát tool nào Claude Code được dùng."}], "f": "", "ke": ["A reliable CI job needs a non-interactive mode plus enforced tool permissions and machine-readable output."], "ap": ["M20#7"]}, "Q081": {"d": 4, "sv": "Một tool trace cho thấy tool đã trả về đúng bản ghi khách hàng, nhưng số điện thoại được ghi vào database lại không có trong bản ghi đó. Retry tái hiện cùng giá trị sai. HAI bước debug nào cho thấy rõ nhất số sai đến từ đâu?", "se": "A tool trace shows that the tool returned the correct customer record, yet the phone number written to the database is not in that record. Retrying reproduces the same wrong value. Which TWO debugging steps best show where the wrong number comes from?", "oe": ["Keep the failing trace and inspect each step that transforms the data before the write.", "Retry many more times and compare the outputs to see whether the wrong value changes.", "Add assertions that check the tool result and the final write payload separately.", "Swap in a different model and check whether the wrong value still appears."], "ov": ["Giữ lại trace bị lỗi và kiểm tra từng bước biến đổi dữ liệu trước khi ghi.", "Retry nhiều lần hơn nữa và so sánh đầu ra để xem giá trị sai có thay đổi không.", "Thêm assertion kiểm tra riêng biệt kết quả tool và payload ghi cuối cùng.", "Đổi sang một model khác và kiểm tra xem giá trị sai còn xuất hiện không."], "on": ["Đúng — trace lỗi tái hiện được là bằng chứng chính; kiểm tra từng bước biến đổi giúp chỉ ra chính xác nơi giá trị bị thay đổi.", "Sai — lỗi đã tái hiện ổn định, retry thêm không cung cấp thông tin mới về nơi giá trị sai phát sinh.", "Đúng — assertion riêng ở kết quả tool và payload ghi cuối giúp khoanh vùng ranh giới làm hỏng dữ liệu và ngăn tái phát.", "Sai — đổi model thay đổi nhiều biến cùng lúc và bỏ qua khả năng lỗi nằm ở code biến đổi, không chỉ ra nguồn gốc lỗi."], "c": [0, 2], "x": "Nguyên tắc debug cốt lõi: để tìm nơi phát sinh lỗi, cần bằng chứng tại từng ranh giới (boundary) mà dữ liệu đi qua: kết quả tool → context của Claude → đầu ra của Claude (ví dụ tham số `tool_use` cho bước ghi) → code biến đổi/mapping → payload ghi vào database. Lỗi nằm ở đoạn nào thì giá trị đúng ở ranh giới trước và sai ở ranh giới sau.\n\nĐáp án 1: lỗi đã tái hiện ổn định, nên trace lỗi là bằng chứng quý. Giữ nguyên nó và lần theo từng bước biến đổi, có thể phát hiện, chẳng hạn, code mapping lấy nhầm trường `emergency_contact.phone` thay vì `phone`, hoặc Claude ghép nhầm số từ một tool result khác trong context. Đáp án 3: assertion riêng tại hai đầu, ví dụ `assert tool_result[\"phone\"] == expected` và `assert write_payload[\"phone\"] in tool_result.values()`, xác định chính xác ranh giới nào làm hỏng dữ liệu, đồng thời trở thành kiểm tra hồi quy cho sau này.\n\nBẫy: retry thêm không cho thêm thông tin vì lỗi đã tái hiện xác định (deterministic). Đổi model là thay đổi nhiều biến cùng lúc; nếu lỗi nằm ở code mapping thì đổi model chẳng giải quyết gì, và kể cả nếu hết lỗi bạn vẫn không biết nguyên nhân. Mẹo nhớ: debug = cô lập theo ranh giới, không phải thử ngẫu nhiên.", "k": ["tracing", "boundary assertions", "debugging", "observability"], "r": [{"u": "https://www.anthropic.com/engineering/writing-tools-for-agents", "t": "Writing effective tools for agents — with agents", "s": "", "n": "Khuyên đọc kỹ transcript và tool call trong quá trình đánh giá để hiểu agent dùng dữ liệu tool như thế nào."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "", "n": "Hướng dẫn xây test tự động có thể chấm điểm bằng code, phù hợp để biến các assertion debug thành kiểm tra hồi quy."}], "f": "", "ke": ["Finding the origin needs evidence at each boundary, from the tool result through Claude's output to the database write."], "ap": ["M20#8"]}, "Q082": {"d": 2, "sv": "Một web service Python xây trên async framework xử lý mỗi request trong một async handler nhưng gọi Claude qua synchronous client của SDK. Khi tải cao, ngay cả các request không dùng Claude cũng bị treo trong lúc Claude đang phản hồi. Cách sửa đúng là gì?", "se": "A Python web service built on an async framework handles each request in an async handler but calls Claude through the SDK's synchronous client. Under load, even requests that do not use Claude stall while Claude is responding. What is the right fix?", "oe": ["Switch to the SDK's async client, or run the synchronous call in a bounded worker pool.", "Shorten the system prompt so Claude responds faster and each call holds the handler for less time.", "Raise the server's request timeout so stalled requests wait longer instead of failing.", "Wrap the synchronous call in a try/except block and retry it when a timeout occurs."], "ov": ["Chuyển sang async client của SDK, hoặc chạy lời gọi đồng bộ trong một worker pool có giới hạn.", "Rút ngắn system prompt để Claude phản hồi nhanh hơn và mỗi lời gọi giữ handler ít thời gian hơn.", "Tăng request timeout của server để các request bị treo chờ lâu hơn thay vì thất bại.", "Bọc lời gọi đồng bộ trong khối try/except và retry khi bị timeout."], "on": ["Đúng — async client không chặn event loop khi chờ mạng; worker pool có giới hạn đẩy lời gọi đồng bộ ra khỏi event loop một cách có kiểm soát.", "Sai — prompt ngắn hơn chỉ giảm thời gian chặn chút ít; lời gọi đồng bộ vẫn chặn event loop và các request khác vẫn bị treo.", "Sai — tăng timeout chỉ che triệu chứng, khiến request chờ lâu hơn trong khi event loop vẫn bị chặn.", "Sai — retry lời gọi đồng bộ vẫn chặn event loop, thậm chí kéo dài thời gian treo; không xử lý nguyên nhân gốc."], "c": [0], "x": "Nguyên nhân gốc: trong async framework (FastAPI, aiohttp, Starlette...), mọi handler chia sẻ một event loop duy nhất. Khi handler gọi một hàm đồng bộ chặn I/O, ví dụ `client.messages.create(...)` của `Anthropic` (sync client) mất vài giây chờ mạng, event loop bị chặn hoàn toàn, nên mọi request khác, kể cả request không liên quan đến Claude, phải chờ. Đó chính là triệu chứng trong đề.\n\nCách sửa: dùng async client của SDK Python, `AsyncAnthropic`, và `await client.messages.create(...)`. Khi chờ mạng, coroutine nhường quyền cho event loop xử lý request khác. Nếu vì lý do nào đó phải giữ code đồng bộ, hãy đẩy lời gọi ra khỏi event loop, ví dụ `await asyncio.to_thread(sync_call)` hoặc `loop.run_in_executor(pool, ...)` với một thread pool có giới hạn kích thước để không tạo vô hạn thread và còn kiểm soát được số lời gọi đồng thời tới API (liên quan đến rate limit).\n\nBẫy: các phương án còn lại chỉ xử lý triệu chứng. Rút ngắn prompt giảm thời gian chặn một chút nhưng vẫn chặn; tăng timeout khiến người dùng chờ lâu hơn; try/except và retry thậm chí làm tình hình tệ hơn vì mỗi lần retry lại chặn event loop thêm lần nữa. Mẹo nhớ: async server + blocking call = cả server đứng; dùng `AsyncAnthropic` hoặc offload sang thread.", "k": ["AsyncAnthropic", "event loop", "blocking I/O", "worker pool", "Python SDK"], "r": [{"u": "https://github.com/anthropics/anthropic-sdk-python", "t": "Claude SDK for Python (anthropics/anthropic-sdk-python)", "s": "Async usage", "n": "README của SDK Python giới thiệu `AsyncAnthropic` dùng với `await`, có API giống hệt client đồng bộ."}, {"u": "https://platform.claude.com/docs/en/cli-sdks-libraries/overview", "t": "SDKs, CLI, and libraries", "s": "", "n": "Tổng quan các SDK chính thức của Anthropic, bao gồm hỗ trợ đồng bộ và bất đồng bộ."}], "f": "", "ke": ["The stalls come from blocking network calls inside an asynchronous server, so the fix is to make the call non-blocking or move it off the event loop."], "ap": ["M20#9"]}, "Q083": {"d": 6, "sv": "Một hệ thống kế toán công nợ phải trả (accounts payable) yêu cầu Claude trích xuất dữ liệu hóa đơn dưới dạng JSON và tự động tạo bản ghi kế toán từ kết quả. Một response khớp hoàn toàn với schema hóa đơn, nhưng số tiền thuế không phù hợp với thuế suất của khu vực được nêu trong request. Điều gì nên xảy ra trước khi bản ghi được tạo?", "se": "An accounts-payable system asks Claude to extract invoice data as JSON and creates accounting records from the results automatically. One response matches the invoice schema exactly, but its tax amount does not fit the tax rate for the region given in the request. What should happen before a record is created?", "oe": ["Code checks the tax amount and other business rules against the request and rejects failures.", "The record is created, because the response passed JSON schema validation without any errors.", "The response is sent back to Claude in the same conversation to confirm its own tax calculation.", "The record is created and flagged so that finance can correct any tax errors at month-end close."], "ov": ["Code kiểm tra số tiền thuế và các business rule khác so với request, và từ chối các trường hợp không đạt.", "Bản ghi được tạo, vì response đã vượt qua kiểm tra JSON schema mà không có lỗi nào.", "Response được gửi lại cho Claude trong cùng conversation để tự xác nhận phép tính thuế của nó.", "Bản ghi được tạo và gắn cờ để bộ phận tài chính sửa lỗi thuế khi khóa sổ cuối tháng."], "on": ["Đúng — kiểm tra business rule bằng code phát hiện giá trị sai dù cấu trúc đúng, và chặn bản ghi sai trước khi vào hệ thống kế toán.", "Sai — vượt qua schema validation chỉ chứng minh cấu trúc đúng, không chứng minh số tiền thuế đúng.", "Sai — model tự xác nhận vẫn mang tính xác suất và có thể lặp lại cùng lỗi; quy tắc thuế tính được nên kiểm bằng code tất định.", "Sai — để bản ghi sai vào sổ rồi sửa cuối tháng gây rủi ro sai lệch tài chính và tốn công sửa sau."], "c": [0], "x": "Ý chính: schema validation chỉ đảm bảo cấu trúc đúng (đúng trường, đúng kiểu, đúng định dạng), không đảm bảo giá trị đúng. Ngay cả khi dùng structured outputs để JSON luôn khớp schema, một trường `tax_amount` kiểu number hợp lệ vẫn có thể mang giá trị sai về mặt nghiệp vụ. Khi đầu ra của model tự động tạo ra tác động thật (bản ghi kế toán), cần một lớp kiểm tra business rule bằng code tất định trước khi ghi.\n\nVí dụ: request ghi khu vực có thuế suất 10%, hóa đơn có `subtotal: 1000000`, nhưng Claude trả về `tax_amount: 80000`. Code kiểm tra `abs(tax_amount - subtotal * rate) <= tolerance` sẽ phát hiện sai lệch và từ chối (đưa vào hàng chờ duyệt tay hoặc trích xuất lại). Các rule khác nên kiểm tra: tổng = subtotal + thuế, ngày hóa đơn hợp lệ, mã nhà cung cấp tồn tại, đơn vị tiền tệ khớp khu vực.\n\nBẫy: phương án 3, nhờ Claude tự kiểm lại, có thể giúp phát hiện lỗi trong một số trường hợp nhưng vẫn là xác suất, không thay được kiểm tra tất định, nhất là khi quy tắc đã biết rõ và tính được bằng code. Phương án 4 để dữ liệu sai đi vào sổ sách, gây hậu quả kế toán. Mẹo nhớ: schema valid ≠ business valid; quy tắc tính được bằng code thì kiểm bằng code.", "k": ["structured outputs", "schema validation", "business rule validation", "output verification"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "t": "Structured outputs", "s": "", "n": "Structured outputs đảm bảo response tuân theo JSON schema, nhưng đó là đảm bảo về cấu trúc, không phải về tính đúng của giá trị."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations", "t": "Reduce hallucinations", "s": "", "n": "Đưa ra các kỹ thuật kiểm chứng đầu ra để giảm thông tin sai trước khi sử dụng."}], "f": "", "ke": ["JSON that matches the schema still needs business-rule checks before it drives an accounting record, because correct structure does not mean correct values."], "ap": ["M20#10"]}, "Q084": {"d": 1, "sv": "Một nhà kho dùng Claude cho hai loại việc. Phần lớn request là kiểm tra tồn kho thông thường, luôn chạy cùng một truy vấn database. Một số ít là chênh lệch tồn kho, khi đó Claude phải so sánh dữ liệu quét barcode, phiếu giao hàng và tóm tắt camera, và các bước khác nhau tùy từng trường hợp. Thiết kế nào cho mỗi loại việc mức tự do vừa đủ cần thiết?", "se": "A warehouse uses Claude for two jobs. Most requests are routine stock checks that always run the same database query. A few are stock discrepancies, where Claude must compare barcode scans, delivery notes and camera summaries, and the steps differ from case to case. Which design gives each job only as much freedom as it needs?", "oe": ["Send every request, including routine stock checks, to one agent that plans its own steps.", "Handle stock checks with a fixed workflow and send discrepancies to an agent that plans its steps.", "Handle both jobs with one fixed workflow that runs every comparison step on every request.", "Use one agent for both jobs and let it write to the inventory system to correct stock counts."], "ov": ["Gửi mọi request, kể cả kiểm tra tồn kho thông thường, đến một agent tự lập kế hoạch các bước.", "Xử lý kiểm tra tồn kho bằng workflow cố định và chuyển các trường hợp chênh lệch cho một agent tự lập kế hoạch.", "Xử lý cả hai loại bằng một workflow cố định chạy mọi bước so sánh cho mọi request.", "Dùng một agent cho cả hai loại và cho phép nó ghi vào hệ thống tồn kho để sửa số liệu."], "on": ["Sai — dùng agent cho truy vấn luôn cố định là thừa tự do, tốn chi phí và độ trễ, và kém dự đoán được.", "Đúng — workflow cố định cho việc dự đoán được và agent cho việc có bước thay đổi, mỗi loại nhận đúng mức tự do cần thiết.", "Sai — chạy mọi bước so sánh cho mọi request là lãng phí, và workflow cứng không thích ứng được với các ca chênh lệch khác nhau.", "Sai — không phân tách theo mức bất định, và cho agent quyền ghi tồn kho mà đề không yêu cầu là vi phạm least privilege."], "c": [1], "x": "Nguyên tắc: khớp mức độ tự chủ của hệ thống với mức độ bất định của từng loại việc. Việc có đường đi cố định, biết trước thì dùng workflow tất định (rẻ, nhanh, dễ dự đoán); việc mà các bước không thể biết trước thì dùng agent có khả năng lập kế hoạch và chọn tool. Kết hợp hai cách bằng routing: phân loại request rồi chuyển đến nhánh xử lý phù hợp, đúng như pattern routing trong \"Building effective agents\".\n\nÁp dụng: một router (code đơn giản hoặc lời gọi Claude rẻ, ví dụ Haiku) phân loại request. Nếu là `stock_check`, chạy luôn truy vấn database cố định và trả kết quả, không cần agent. Nếu là `discrepancy`, chuyển cho agent với các tool như `get_barcode_scans`, `get_delivery_notes`, `get_camera_summary`; agent tự quyết định xem gì trước tùy trường hợp và dừng khi đủ bằng chứng. Như vậy phần lớn traffic được xử lý rẻ và ổn định, chỉ phần ít cần linh hoạt mới tốn chi phí agent.\n\nBẫy: phương án 1 làm phức tạp và đắt việc đơn giản; phương án 3 lãng phí và cứng nhắc với các ca bất định; phương án 4 vừa không phân tách vừa trao quyền ghi tồn kho không cần thiết, vi phạm least privilege. Mẹo nhớ: \"only as much freedom as it needs\" = workflow cho việc dự đoán được, agent cho việc bất định.", "k": ["workflow vs agent", "routing", "right-sizing autonomy", "least privilege"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Routing", "n": "Routing phân loại đầu vào và chuyển đến tác vụ chuyên biệt phù hợp, giúp tách các loại việc khác nhau."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "When (and when not) to use agents", "n": "Workflow cho tác vụ đã xác định rõ, agent cho bài toán cần linh hoạt; chỉ tăng độ phức tạp khi cần."}], "f": "", "ke": ["Match the orchestration to the uncertainty of each job: a fixed workflow for the predictable path and an agent for the cases whose steps cannot be known in advance."], "ap": ["M20#11"]}, "Q085": {"d": 5, "sv": "Một dashboard hiển thị cho người dùng một bản phân tích dài của Claude ngay trong lúc nó đang được viết. Sau khi response kết thúc, backend phải lưu đúng một bản hoàn chỉnh vào lịch sử hội thoại. Ứng dụng nên nhận và lưu response như thế nào?", "se": "A dashboard shows a long Claude analysis to the user while it is being written. After the response finishes, the backend must save one complete copy of it to the conversation history. How should the application receive and store the response?", "oe": ["Stream the response and save each text delta to the history as its own assistant message.", "Open a WebSocket to the API, because the Messages API cannot stream over plain HTTP.", "Send a non-streaming request with a progress spinner, then show and save the full response.", "Stream the response over server-sent events, show each delta, and save the final message."], "ov": ["Stream response và lưu từng text delta vào lịch sử như một assistant message riêng.", "Mở một WebSocket tới API, vì Messages API không thể streaming qua HTTP thông thường.", "Gửi request không streaming kèm một progress spinner, rồi hiển thị và lưu toàn bộ response.", "Stream response qua server-sent events, hiển thị từng delta, và lưu message cuối cùng."], "on": ["Sai — mỗi delta chỉ là một mảnh text; lưu thành nhiều assistant message sẽ làm hỏng lịch sử và không thể gửi lại API đúng cấu trúc.", "Sai — Messages API streaming bằng server-sent events trên HTTP thông thường, không cần WebSocket.", "Sai — cách này lưu đúng nhưng bỏ mất yêu cầu hiển thị trong lúc đang viết, và output dài dễ gặp timeout.", "Đúng — SSE phục vụ hiển thị trực tiếp, còn message hoàn chỉnh sau khi stream kết thúc được lưu một lần vào lịch sử."], "c": [3], "x": "Câu hỏi kiểm tra cách tách hai nhu cầu khác nhau: hiển thị trực tiếp (live display) và lưu trữ bền vững (persistence). Messages API hỗ trợ streaming khi đặt `\"stream\": true`, và dữ liệu được trả về qua server-sent events (SSE) trên HTTP thông thường. Mỗi đoạn text mới đến trong sự kiện `content_block_delta` với `text_delta`, nên frontend có thể nối dần để người dùng thấy câu trả lời hình thành theo thời gian thực.\n\nTuy nhiên, lịch sử hội thoại cần một assistant message hoàn chỉnh. Cách đúng là vừa đẩy delta lên UI, vừa tích lũy chúng (hoặc dùng helper của SDK như `stream.get_final_message()` trong Python) và chỉ ghi vào history một lần sau khi nhận `message_stop`. Như vậy bạn vừa có trải nghiệm mượt, vừa có bản ghi sạch, đúng định dạng để gửi lại ở lượt sau.\n\nBẫy thường gặp: lưu mỗi delta thành một message riêng sẽ làm vỡ cấu trúc hội thoại (hàng trăm assistant message liên tiếp, không thể gửi lại API). Nghĩ rằng phải dùng WebSocket là sai, vì streaming của Claude là SSE. Dùng request không streaming thì vẫn lưu đúng nhưng mất phần hiển thị trực tiếp mà đề bài yêu cầu, và với output dài còn có nguy cơ timeout. Mẹo nhớ: stream để hiển thị, lưu message cuối để làm lịch sử.", "k": ["streaming", "server-sent events", "content_block_delta", "conversation history"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/streaming", "t": "Streaming messages", "s": "Event types", "n": "Mô tả luồng sự kiện SSE từ `message_start` đến `message_stop` và cách text đến qua `content_block_delta`."}, {"u": "https://platform.claude.com/docs/en/cli-sdks-libraries/overview", "t": "SDKs, CLI, and libraries", "s": "", "n": "Các SDK chính thức cung cấp helper streaming để vừa lặp qua delta vừa lấy final message."}], "f": "", "ke": ["Streaming serves the live display, while the history should store one complete message only after the stream has finished."], "ap": ["M20#12"]}, "Q086": {"d": 7, "sv": "Một PreToolUse hook của Claude Code kiểm tra các lệnh shell. Khi lệnh chạm vào thư mục secrets/, hook in ra \"blocked\" và thoát với exit code 0. Trace cho thấy lệnh vẫn được chạy. Thay đổi và cách test nào sẽ biến nó thành một guardrail thực sự hoạt động?", "se": "A Claude Code PreToolUse hook checks shell commands. When a command touches the secrets/ directory, the hook prints \"blocked\" and exits with code 0. Traces show the command still runs. What change and test would make this a working guardrail?", "oe": ["Have the hook write its warning to a log file, then check the log after a test run.", "Move the check to a PostToolUse hook and test that it reports the command.", "Add a system prompt rule not to touch secrets/, then test it with sample commands.", "Return a blocking result, such as exit code 2, and test that the files are untouched."], "ov": ["Cho hook ghi cảnh báo vào một file log, rồi kiểm tra log sau một lần chạy thử.", "Chuyển phần kiểm tra sang PostToolUse hook và test rằng nó báo cáo lại lệnh.", "Thêm quy tắc vào system prompt là không được chạm vào secrets/, rồi test bằng vài lệnh mẫu.", "Trả về kết quả chặn, ví dụ exit code 2, và test rằng các file không bị động tới."], "on": ["Sai — ghi log chỉ giúp quan sát, lệnh vẫn được thực thi; đó không phải là chặn.", "Sai — PostToolUse chạy sau khi tool đã thực thi nên không thể ngăn lệnh truy cập secrets/.", "Sai — system prompt là chỉ dẫn mềm, không đảm bảo được; guardrail cần cơ chế chặn deterministic.", "Đúng — exit code 2 (hoặc quyết định `deny`) mới chặn được tool call, và test side effect chứng minh file không bị động tới."], "c": [3], "x": "Câu hỏi kiểm tra cơ chế hook trong Claude Code: hook chỉ là guardrail khi kết quả của nó thực sự chặn được tool call. Với PreToolUse hook, exit code 0 nghĩa là thành công, cho phép tiếp tục; nội dung in ra stdout không có tác dụng chặn. Muốn chặn, hook phải thoát với exit code 2 (khi đó stderr được gửi lại cho Claude để giải thích lý do) hoặc trả JSON có quyết định từ chối, ví dụ `{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\", \"permissionDecision\": \"deny\"}}`.\n\nPhần thứ hai của đáp án cũng quan trọng không kém: test phải kiểm tra side effect, tức là sau khi chạy thử một lệnh như `cat secrets/key.pem` hoặc `rm secrets/*`, các file trong secrets/ vẫn nguyên vẹn. Chỉ nhìn thấy chữ \"blocked\" không chứng minh gì, chính lỗi ban đầu cho thấy hook in ra thông báo mà lệnh vẫn chạy.\n\nBẫy thường gặp: PostToolUse chạy sau khi tool đã thực thi, nên chỉ báo cáo được chứ không ngăn được. Quy tắc trong system prompt là hướng dẫn mềm, model có thể không tuân theo, nên không phải là control có tính bắt buộc. Ghi log chỉ giúp quan sát. Mẹo nhớ: guardrail thật thì deterministic, chặn trước khi chạy, và được test bằng kết quả thực tế chứ không bằng thông báo.", "k": ["hook", "PreToolUse", "exit code 2", "guardrail", "side-effect testing"], "r": [{"u": "https://code.claude.com/docs/en/hooks", "t": "Hooks reference", "s": "Exit code output", "n": "Giải thích exit code 0 là thành công, exit code 2 là blocking error và với PreToolUse sẽ chặn tool call."}, {"u": "https://code.claude.com/docs/en/hooks", "t": "Hooks reference", "s": "PreToolUse decision control", "n": "Mô tả cách trả JSON với `permissionDecision` là `allow`, `deny` hoặc `ask`."}], "f": "", "ke": ["A hook guardrail works only if its result actually blocks the call, and only a test that checks for the side effect proves it does."], "ap": ["M20#13"]}, "Q087": {"d": 8, "sv": "Ứng dụng của bạn định nghĩa một tool `check_stock` do chính code của bạn hiện thực. Claude trả về response có `stop_reason` là `tool_use` và một khối `tool_use` yêu cầu tra cứu tồn kho. Ứng dụng nên làm gì tiếp theo?", "se": "Your application defines a check_stock tool that your own code implements. Claude returns a response with stop_reason set to tool_use and a tool_use block asking for a stock lookup. What should your application do next?", "oe": ["Wait for Claude's next message, since Claude has already queried the inventory service on its own.", "Validate the input, run the lookup, and return a tool_result with the matching tool_use_id.", "Run the lookup and send the result to Claude as plain text at the start of a new conversation.", "Run the lookup and add its result to the system prompt of the next request sent to Claude."], "ov": ["Chờ message tiếp theo của Claude, vì Claude đã tự truy vấn dịch vụ tồn kho.", "Validate input, chạy việc tra cứu, và trả về một `tool_result` với `tool_use_id` tương ứng.", "Chạy việc tra cứu và gửi kết quả cho Claude dưới dạng text thường ở đầu một hội thoại mới.", "Chạy việc tra cứu và thêm kết quả vào system prompt của request tiếp theo gửi tới Claude."], "on": ["Sai — với client tool, Claude không tự thực thi; nếu ứng dụng chờ thì hội thoại bị kẹt.", "Đúng — host validate, thực thi rồi trả `tool_result` có `tool_use_id` khớp, đúng giao thức tool use.", "Sai — hội thoại mới làm mất ngữ cảnh và không có khối `tool_result` để liên kết với yêu cầu ban đầu.", "Sai — kết quả tool phải nằm trong khối `tool_result` ở user message kế tiếp, không phải trong system prompt."], "c": [1], "x": "Câu hỏi kiểm tra giao thức client tool use. Với tool do bạn định nghĩa (client tool), Claude không tự thực thi gì cả: nó chỉ trả về khối `tool_use` gồm `id`, `name` và `input`, đồng thời đặt `stop_reason` là `\"tool_use\"`. Ứng dụng (host) chịu trách nhiệm validate input, gọi hệ thống thật, rồi gửi kết quả về trong một user message chứa khối `tool_result`.\n\nVí dụ: Claude trả `{\"type\": \"tool_use\", \"id\": \"toolu_01A\", \"name\": \"check_stock\", \"input\": {\"sku\": \"TS-42\"}}`. Ứng dụng kiểm tra `sku` hợp lệ, gọi inventory service, rồi gửi `{\"type\": \"tool_result\", \"tool_use_id\": \"toolu_01A\", \"content\": \"12 units\"}`, giữ nguyên toàn bộ lịch sử trước đó. Claude dùng kết quả này để viết câu trả lời cuối. Bước validate rất quan trọng vì input do model sinh ra có thể sai định dạng hoặc vượt quyền.\n\nBẫy thường gặp: nghĩ rằng Claude tự gọi service (chỉ đúng với server tools như web search do Anthropic chạy). Bắt đầu hội thoại mới làm mất ngữ cảnh và không khớp `tool_use_id`. Nhét kết quả vào system prompt phá vỡ giao thức, vì API yêu cầu mỗi `tool_use` phải được đáp lại bằng `tool_result` ngay ở lượt sau. Mẹo nhớ: Claude yêu cầu, host thực thi, `tool_use_id` nối hai đầu.", "k": ["tool use", "client tools", "tool_result", "tool_use_id", "input validation"], "r": [{"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "t": "Define tools", "s": "Handling tool use and tool result content blocks", "n": "Hướng dẫn cách đọc khối `tool_use` và trả về `tool_result` với `tool_use_id` tương ứng."}, {"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", "t": "Tool use with Claude", "s": "How tool use works", "n": "Phân biệt client tools do ứng dụng thực thi và server tools do Anthropic thực thi."}], "f": "", "ke": ["Tool use is a protocol: Claude requests the call, and the host validates it, runs it and returns a correlated tool_result."], "ap": ["M20#14"]}, "Q088": {"d": 3, "sv": "Một repository có sáu quy ước ngắn cần áp dụng trong mọi session Claude Code. Repo cũng có một quy trình migration database dài 20 trang mà team dùng hai lần mỗi năm. Team nên thiết lập những thứ này như thế nào?", "se": "A repository has six short conventions that should apply in every Claude Code session. It also has a 20-page database migration procedure that the team uses twice a year. How should the team set these up?", "oe": ["Put the six conventions in CLAUDE.md and package the migration procedure as a Skill.", "Put both in CLAUDE.md so Claude always has the migration procedure available.", "Put both in each developer's personal user settings so everyone has a copy.", "Put the conventions in a subagent's system prompt and link the procedure from it."], "ov": ["Đặt sáu quy ước vào CLAUDE.md và đóng gói quy trình migration thành một Skill.", "Đặt cả hai vào CLAUDE.md để Claude luôn có sẵn quy trình migration.", "Đặt cả hai vào user settings cá nhân của từng developer để ai cũng có một bản.", "Đặt các quy ước vào system prompt của một subagent và link quy trình từ đó."], "on": ["Đúng — CLAUDE.md cho hướng dẫn ngắn luôn áp dụng, Skill cho quy trình dài chỉ nạp khi cần.", "Sai — 20 trang trong CLAUDE.md sẽ chiếm context ở mọi session dù hiếm khi dùng.", "Sai — user settings không được chia sẻ qua repo, khó đồng bộ và không phải nơi chứa hướng dẫn project.", "Sai — system prompt của subagent chỉ có hiệu lực khi subagent được gọi, nên quy ước không áp dụng cho mọi session."], "c": [0], "x": "Câu hỏi kiểm tra việc phân bổ context trong Claude Code. CLAUDE.md ở thư mục gốc project được nạp tự động vào mọi session, nên nó phù hợp cho hướng dẫn ngắn, luôn đúng, ví dụ lệnh build/test, quy ước đặt tên, style code. Vì nó luôn chiếm chỗ trong context window, nội dung cần ngắn gọn và được commit vào git để cả team dùng chung.\n\nSkill thì khác: mỗi Skill là một thư mục có `SKILL.md` (kèm file phụ nếu cần). Ban đầu chỉ có tên và mô tả ngắn được nạp; nội dung đầy đủ chỉ được tải khi Claude thấy liên quan hoặc khi người dùng gọi nó. Đây là progressive disclosure, rất hợp với quy trình 20 trang chỉ dùng hai lần một năm, ví dụ `.claude/skills/db-migration/SKILL.md`.\n\nBẫy thường gặp: nhét mọi thứ vào CLAUDE.md nghe có vẻ \"an toàn\" nhưng làm phình context ở mọi session, tốn token và làm loãng các chỉ dẫn quan trọng. User settings cá nhân không được chia sẻ qua repo nên dễ lệch giữa các developer. Subagent chỉ hoạt động khi được gọi, nên các quy ước cần áp dụng mọi lúc sẽ không có mặt trong session chính. Mẹo nhớ: luôn cần thì CLAUDE.md, thỉnh thoảng cần thì Skill.", "k": ["CLAUDE.md", "Skills", "progressive disclosure", "context window"], "r": [{"u": "https://code.claude.com/docs/en/memory", "t": "How Claude remembers your project", "s": "", "n": "Mô tả CLAUDE.md cấp project được nạp tự động vào mỗi session và nên giữ ngắn gọn."}, {"u": "https://code.claude.com/docs/en/skills", "t": "Extend Claude with skills", "s": "", "n": "Giải thích Skill được nạp theo nhu cầu dựa trên mô tả, phù hợp cho quy trình dài và ít dùng."}], "f": "", "ke": ["Keep always-on guidance short in CLAUDE.md, and package long, occasional procedures so they load only when needed."], "ap": ["M20#15"]}, "Q089": {"d": 2, "sv": "Hai team cùng làm trên một service dùng chung, service này trích xuất chi tiết đơn hàng bằng Claude. Một team thay đổi JSON schema của response; team kia thay đổi cách service retry các call bị lỗi. Mỗi branch đều pass test riêng, nhưng code sau khi merge lại lỗi. Hai biện pháp nào ngăn loại lỗi này trực tiếp nhất? (Chọn HAI)", "se": "Two teams work on a shared service that extracts order details with Claude. One team changes the JSON schema of the service's response; the other changes how the service retries failed calls. Each branch passes its own tests, but the merged code fails. Which TWO practices would most directly prevent this kind of failure?", "oe": ["Let each team keep its own copy of the response schema in its branch until the release.", "Add contract tests that check the shared response format that both teams depend on.", "Run each branch's own test suite twice before merging to catch any intermittent failures.", "Require both teams to review any change to the shared interface before it is merged."], "ov": ["Cho mỗi team giữ bản response schema riêng trong branch của mình đến khi release.", "Thêm contract test kiểm tra định dạng response dùng chung mà cả hai team phụ thuộc.", "Chạy test suite của mỗi branch hai lần trước khi merge để bắt các lỗi chập chờn.", "Yêu cầu cả hai team review mọi thay đổi đối với interface dùng chung trước khi merge."], "on": ["Sai — mỗi team giữ schema riêng làm hai bên càng lệch nhau, xung đột chỉ bị dời đến lúc release.", "Đúng — contract test kiểm tra tự động interface mà cả hai team phụ thuộc, bắt được thay đổi phá vỡ format.", "Sai — chạy lại test chỉ phát hiện lỗi chập chờn; lỗi tích hợp này deterministic và không nằm trong test của từng branch.", "Đúng — review chung đối với interface dùng chung giúp cả hai team thấy tác động chéo trước khi merge."], "c": [1, 3], "x": "Câu hỏi kiểm tra cách xử lý lỗi tích hợp tại interface dùng chung. Mỗi branch pass test riêng vì test của team nào cũng giả định schema cũ hoặc logic retry cũ; lỗi chỉ xuất hiện khi hai thay đổi gặp nhau. Ví dụ team A đổi field `total` thành `total_amount`, còn logic retry mới của team B lại kiểm tra `total` để quyết định response có hợp lệ không, kết quả là retry vô hạn hoặc báo lỗi sai.\n\nĐáp án thứ nhất: contract test là test thực thi được, mô tả đúng định dạng response mà mọi bên tiêu thụ phụ thuộc vào (ví dụ validate theo JSON Schema chung trong CI). Bất kỳ thay đổi nào phá vỡ contract sẽ fail ngay, kể cả trên branch riêng. Đáp án thứ hai: yêu cầu cả hai team review thay đổi ở interface dùng chung (ví dụ qua CODEOWNERS) giúp phát hiện tác động chéo trước khi merge, bổ sung cho kiểm tra tự động.\n\nBẫy thường gặp: giữ schema riêng trong từng branch chỉ trì hoãn xung đột đến lúc release và làm nó tệ hơn. Chạy test hai lần chỉ bắt lỗi flaky, trong khi lỗi ở đây là deterministic và nằm ngoài phạm vi test của từng branch. Mẹo nhớ: lỗi ở ranh giới thì sửa ở ranh giới, bằng check tự động và review chung.", "k": ["contract test", "shared interface", "integration testing", "code review"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "t": "Structured outputs", "s": "", "n": "Ràng buộc output theo JSON schema giúp contract về định dạng response trở nên rõ ràng và kiểm tra được."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "", "n": "Hướng dẫn xây dựng test case tự động, có thể chấm bằng code để kiểm tra output của Claude."}], "f": "", "ke": ["The failure happens at an interface both teams share, so the fixes are an executable check of that interface and review of changes to it by both teams."], "ap": ["M20#16"]}, "Q090": {"d": 6, "sv": "Một agent đang review một vụ án pháp lý dài và sắp chạm giới hạn context, chủ yếu do kết quả thô của các lượt tìm kiếm đã hoàn tất. Báo cáo cuối vẫn cần ba ID tài liệu nguồn, và phê duyệt của một partner vẫn đang chờ. Khi hội thoại được compact, bản tóm tắt bắt buộc phải giữ lại những gì?", "se": "An agent reviewing a long legal case is close to its context limit, mostly because of raw results from searches it has already finished. The final report still needs three source document IDs, and a partner's approval is still pending. When the conversation is compacted, what must the summary keep?", "oe": ["The three source document IDs, the decisions made so far, and the pending approval.", "The full search results, so the report can quote them, with the decisions left out.", "Only the latest user message, since the earlier turns can be rebuilt if they are needed.", "A short account of the searches and the decisions made, leaving out any open items."], "ov": ["Ba ID tài liệu nguồn, các quyết định đã đưa ra, và việc phê duyệt đang chờ.", "Toàn bộ kết quả tìm kiếm để báo cáo có thể trích dẫn, bỏ qua các quyết định.", "Chỉ message mới nhất của người dùng, vì các lượt trước có thể dựng lại khi cần.", "Một mô tả ngắn về các lượt tìm kiếm và quyết định đã đưa ra, bỏ qua mọi việc còn dang dở."], "on": ["Đúng — giữ đúng bằng chứng cần trích dẫn, quyết định đã có và việc đang chờ, đồng thời bỏ dữ liệu thô.", "Sai — giữ kết quả thô không giải phóng được context, và bỏ quyết định khiến agent phải làm lại hoặc mâu thuẫn.", "Sai — chỉ giữ message cuối làm mất ID tài liệu, quyết định và phê duyệt đang chờ, không thể tự dựng lại.", "Sai — bỏ qua việc còn mở có thể khiến agent hoàn tất báo cáo trước khi có phê duyệt bắt buộc."], "c": [0], "x": "Câu hỏi kiểm tra nguyên tắc compaction trong context engineering: khi gần đầy context window, ta tóm tắt hội thoại để tiếp tục, nhưng phải chọn lọc đúng. Thứ nên bỏ là khối dữ liệu lớn không còn cần (kết quả tìm kiếm thô đã xử lý xong). Thứ phải giữ là thông tin agent vẫn phụ thuộc để hoàn thành nhiệm vụ: bằng chứng cụ thể (ba ID tài liệu nguồn), các quyết định đã đưa ra (để không phải suy luận lại hoặc mâu thuẫn), và mọi việc còn mở (phê duyệt của partner đang chờ).\n\nVí dụ một bản tóm tắt tốt: \"Nguồn cần trích: DOC-114, DOC-207, DOC-389. Đã quyết định: loại bỏ lập luận về thời hiệu. Đang chờ: partner duyệt chiến lược, chưa được gửi báo cáo.\" Bản này rất ngắn nhưng giữ đủ trạng thái để agent tiếp tục đúng.\n\nBẫy thường gặp: giữ toàn bộ kết quả tìm kiếm thì không giải quyết vấn đề context, mà còn mất các quyết định. Chỉ giữ message cuối làm mất toàn bộ trạng thái; ID tài liệu và quyết định không thể tự \"dựng lại\". Bản tóm tắt bỏ qua việc dang dở rất nguy hiểm vì agent có thể gửi báo cáo khi chưa được duyệt. Mẹo nhớ: compaction giữ ID, quyết định, việc còn mở; bỏ dữ liệu thô đã dùng xong.", "k": ["compaction", "context window", "context engineering", "agent state"], "r": [{"u": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", "t": "Effective context engineering for AI agents", "s": "Compaction", "n": "Khuyến nghị khi compact nên giữ quyết định, chi tiết quan trọng và việc còn dang dở, bỏ các kết quả tool cũ dư thừa."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/compaction", "t": "Compaction overview", "s": "", "n": "Mô tả tính năng compaction phía server để tóm tắt hội thoại dài khi gần chạm giới hạn context."}], "f": "", "ke": ["Compaction should drop bulk the agent no longer needs while keeping the evidence it still depends on and any unfinished steps such as pending approvals."], "ap": ["M20#17"]}, "Q091": {"d": 1, "sv": "Một team tính lương luôn làm theo cùng bốn bước: kiểm tra hồ sơ nhân viên, lấy số giờ đã duyệt, tính các khoản khấu trừ, và gửi thanh toán. Mọi trường hợp ngoại lệ đều phải dừng lại để một người review trước khi gửi. Thiết kế nào cho khả năng kiểm soát rõ ràng nhất đối với chuỗi cố định này?", "se": "A payroll team always follows the same four steps: check the employee record, fetch approved hours, calculate deductions, and submit the payment. Any exception must stop for a person to review before submission. Which design gives the clearest control over this fixed sequence?", "oe": ["A coded workflow that runs the four steps in order and routes exceptions to human review.", "An agent that is given the four steps as tools and decides which one to call next.", "Four specialized agents, one per step, that each update the same payroll record when ready.", "One prompt that lists every payroll policy and asks Claude to complete the whole process."], "ov": ["Một workflow viết bằng code chạy bốn bước theo thứ tự và chuyển ngoại lệ sang human review.", "Một agent được cấp bốn bước dưới dạng tool và tự quyết định gọi tool nào tiếp theo.", "Bốn agent chuyên biệt, mỗi agent một bước, cùng cập nhật một bản ghi lương khi sẵn sàng.", "Một prompt liệt kê mọi chính sách lương và yêu cầu Claude hoàn thành toàn bộ quy trình."], "on": ["Đúng — workflow deterministic đảm bảo đúng thứ tự và có nhánh ngoại lệ dừng lại cho người review.", "Sai — agent tự chọn bước tiếp theo, làm mất đảm bảo thứ tự và có thể bỏ qua human review bắt buộc.", "Sai — nhiều agent cùng cập nhật một bản ghi gây phức tạp, race condition và không có điểm kiểm soát rõ ràng.", "Sai — một prompt duy nhất không có checkpoint để dừng ngoại lệ trước khi gửi thanh toán."], "c": [0], "x": "Câu hỏi kiểm tra sự khác biệt giữa workflow và agent theo bài \"Building effective agents\" của Anthropic. Workflow là hệ thống mà code điều phối các LLM call và tool theo đường đi định sẵn; agent là hệ thống mà model tự quyết định quy trình và cách dùng tool. Nguyên tắc: chọn giải pháp đơn giản nhất đáp ứng yêu cầu, chỉ dùng agent khi các bước không thể biết trước.\n\nỞ đây bốn bước đã cố định, thứ tự không đổi, và human review là bắt buộc. Một workflow bằng code (kiểu prompt chaining kèm gate) cho phép đảm bảo đúng thứ tự, kiểm tra điều kiện giữa các bước, và có nhánh ngoại lệ rõ ràng, ví dụ: nếu số giờ vượt ngưỡng hoặc khấu trừ âm thì tạo ticket review và dừng, không gọi `submit_payment`. Điều này dễ audit, dễ test, và quan trọng với dữ liệu tài chính.\n\nBẫy thường gặp: agent nghe hiện đại nhưng trao quyền chọn bước cho model, có thể bỏ qua review hoặc gọi sai thứ tự. Nhiều agent cùng ghi vào một bản ghi tạo race condition và khó kiểm soát. Một prompt khổng lồ không có checkpoint nào để chặn ngoại lệ. Mẹo nhớ: bước biết trước và có kiểm soát bắt buộc thì dùng workflow; bước không đoán trước được mới dùng agent.", "k": ["workflow", "agent", "prompt chaining", "human-in-the-loop", "deterministic control"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "What are agents?", "n": "Phân biệt workflow (đường đi định sẵn bằng code) với agent (model tự điều hướng)."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "When (and when not) to use agents", "n": "Khuyên chọn giải pháp đơn giản nhất, dùng workflow khi tác vụ có thể chia thành các bước cố định."}], "f": "", "ke": ["The steps are known and the human review is mandatory, so a deterministic workflow with an explicit exception branch is the right foundation."], "ap": ["M20#18"]}, "Q092": {"d": 5, "sv": "Một công ty có hai endpoint dùng Claude. Endpoint thứ nhất trích xuất năm trường từ hoá đơn và phải phản hồi trong vòng một giây. Endpoint thứ hai tổng hợp các bằng chứng kiểm toán mâu thuẫn nhau thành kết luận; bỏ sót một mục ở đây rất tốn kém, nhưng tốc độ ít quan trọng hơn. Team nên chọn model cho chúng như thế nào?", "se": "A company has two Claude endpoints. One pulls five fields from invoices and must respond within one second. The other combines conflicting audit evidence into findings; a missed item there is costly, but speed matters less. How should the team choose models for them?", "oe": ["Test candidate models on each workload and pick a model for each endpoint from the results.", "Use the most capable model for both endpoints so that neither workload loses any accuracy.", "Use the fastest model for both endpoints and add a second review pass for the audit findings.", "Pick one model for both endpoints based on its score on a widely used public benchmark."], "ov": ["Test các model ứng viên trên từng workload và chọn model cho mỗi endpoint dựa trên kết quả.", "Dùng model mạnh nhất cho cả hai endpoint để không workload nào bị giảm độ chính xác.", "Dùng model nhanh nhất cho cả hai endpoint và thêm một lượt review thứ hai cho kết luận kiểm toán.", "Chọn một model cho cả hai endpoint dựa trên điểm số của nó trên một public benchmark phổ biến."], "on": ["Đúng — đo chất lượng, latency và chi phí trên tác vụ thật của từng endpoint rồi mới chọn model.", "Sai — model mạnh nhất có thể không đạt yêu cầu một giây và tốn chi phí không cần thiết cho tác vụ trích xuất đơn giản.", "Sai — model nhanh nhất có thể bỏ sót trong suy luận phức tạp; thêm một lượt review không thay thế được việc đánh giá chất lượng.", "Sai — public benchmark không phản ánh dữ liệu riêng, và một model chung không thể tối ưu cho hai ràng buộc trái ngược."], "c": [0], "x": "Câu hỏi kiểm tra nguyên tắc chọn model theo workload. Mỗi endpoint có ràng buộc khác nhau: endpoint hoá đơn là tác vụ trích xuất đơn giản với yêu cầu latency rất chặt (dưới một giây), nên model nhỏ, nhanh như dòng Haiku thường phù hợp; endpoint kiểm toán cần suy luận trên bằng chứng mâu thuẫn, chi phí sai sót cao, nên ưu tiên model mạnh hơn như Opus hoặc Sonnet, có thể kèm extended thinking. Nhưng \"thường phù hợp\" chưa đủ, phải đo.\n\nCách đúng là xây eval set từ dữ liệu thật của từng endpoint (ví dụ 200 hoá đơn có nhãn, 50 hồ sơ kiểm toán có danh sách mục cần phát hiện), chạy các model ứng viên, rồi so sánh chất lượng, latency (p95) và chi phí. Kết quả có thể là Haiku cho hoá đơn và Opus cho kiểm toán, hoặc khác, tuỳ số liệu đo được.\n\nBẫy thường gặp: dùng model mạnh nhất cho mọi thứ nghe an toàn nhưng có thể vi phạm SLA một giây và tốn chi phí không cần thiết. Dùng model nhanh nhất cộng review thứ hai không đảm bảo bắt được mục bị sót trong suy luận phức tạp. Public benchmark không phản ánh dữ liệu và tiêu chí riêng của bạn. Mẹo nhớ: không có model tốt nhất chung, chỉ có model tốt nhất cho workload đã được đo.", "k": ["model selection", "latency", "cost", "eval", "workload-specific testing"], "r": [{"u": "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model", "t": "Choosing the right model", "s": "", "n": "Hướng dẫn cân nhắc capability, tốc độ và chi phí, và khuyến nghị test trên use case cụ thể."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "", "n": "Nhấn mạnh xác định tiêu chí thành công đo được (độ chính xác, latency, chi phí) cho từng ứng dụng."}, {"u": "https://platform.claude.com/docs/en/models/overview", "t": "Models overview", "s": "", "n": "So sánh các model về tốc độ, khả năng và giá."}], "f": "", "ke": ["Model choice is workload-specific: each endpoint's model should be chosen from measured quality, latency and cost on that endpoint's real task."], "ap": ["M20#19"]}, "Q093": {"d": 7, "sv": "Một agent đọc các issue của project thông qua một MCP resource. Mô tả của một issue chứa chỉ dẫn yêu cầu agent export toàn bộ dữ liệu khách hàng. Agent được phép đọc issue, nhưng việc export dữ liệu khách hàng cần một quyền riêng. Ứng dụng nên xử lý tình huống này thế nào?", "se": "An agent reads project issues through an MCP resource. One issue description contains instructions telling the agent to export all customer records. The agent is allowed to read issues, but exporting customer data requires separate authorization. How should the application handle this?", "oe": ["Treat the text as a valid request, because it came from the company's own MCP server.", "Let Claude judge whether the author of the issue has the authority to request an export.", "Treat the issue text as untrusted data and enforce export authorization in the backend.", "Give the issue tool its own database credential so that it can check the author's role."], "ov": ["Coi đoạn text là yêu cầu hợp lệ, vì nó đến từ MCP server của chính công ty.", "Để Claude tự đánh giá xem người viết issue có thẩm quyền yêu cầu export hay không.", "Coi nội dung issue là dữ liệu không tin cậy và thực thi kiểm tra quyền export ở backend.", "Cấp cho tool đọc issue một credential database riêng để nó kiểm tra vai trò của người viết."], "on": ["Sai — server nội bộ đáng tin không làm nội dung do người dùng viết trở nên đáng tin; đây chính là prompt injection.", "Sai — giao quyết định bảo mật cho model là rủi ro vì model có thể bị chính nội dung độc hại thao túng.", "Đúng — tách dữ liệu không tin cậy khỏi thẩm quyền, và backend thực thi kiểm tra quyền export một cách deterministic.", "Sai — cấp thêm credential cho tool đọc issue vi phạm least privilege và không giải quyết gốc rễ của injection."], "c": [2], "x": "Đây là tình huống indirect prompt injection điển hình: chỉ dẫn độc hại nằm trong dữ liệu mà agent đọc (issue), chứ không đến từ người dùng hay system prompt. Nguyên tắc cốt lõi là tách biệt nội dung không tin cậy khỏi thẩm quyền hành động. Text trong issue chỉ là dữ liệu, dù nó đến qua MCP server nội bộ, vì bất kỳ ai tạo được issue đều có thể viết vào đó.\n\nĐáp án đúng có hai lớp: (1) xử lý nội dung issue như untrusted data, ví dụ bọc trong thẻ `<issue_content>` và nhắc model không làm theo chỉ dẫn bên trong; (2) quan trọng hơn, quyền export phải được backend kiểm tra một cách deterministic, ví dụ endpoint `export_customers` yêu cầu token có scope `customers:export` của người dùng thực, không phải dựa vào việc model \"thấy hợp lý\". Như vậy kể cả khi model bị lừa và gọi tool, backend vẫn từ chối.\n\nBẫy thường gặp: tin nguồn nội bộ là tin nội dung; MCP server đáng tin không có nghĩa dữ liệu nó trả về đáng tin. Để Claude tự phán xét thẩm quyền là đặt kiểm soát bảo mật vào thứ có thể bị thao túng. Cấp thêm credential cho tool đọc issue vi phạm least privilege và mở rộng bề mặt tấn công. Mẹo nhớ: model có thể bị lừa, nên authorization phải nằm ở backend.", "k": ["prompt injection", "untrusted data", "authorization", "least privilege", "MCP resources"], "r": [{"u": "https://genai.owasp.org/llm-top-10/", "t": "OWASP Top 10 for LLM Applications 2025 (LLMRisks Archive - OWASP Gen AI Security Project)", "s": "LLM01: Prompt Injection", "n": "Mô tả indirect prompt injection qua nội dung bên ngoài và khuyến nghị thực thi quyền ở ngoài model."}, {"u": "https://modelcontextprotocol.io/specification/2025-06-18/server/resources", "t": "Resources (MCP spec 2025-06-18)", "s": "Security Considerations", "n": "Nhắc client và server phải validate, kiểm soát truy cập đối với nội dung resource."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks", "t": "Mitigate jailbreaks and prompt injections", "s": "", "n": "Gợi ý các lớp phòng vệ như kiểm tra input và giới hạn hành động khi xử lý nội dung không tin cậy."}], "f": "", "ke": ["Untrusted content and the authority to act must be separated at a boundary the backend enforces, not left to the model's judgment."], "ap": ["M20#20"]}, "Q094": {"d": 2, "sv": "Cùng một tài liệu chính sách 80 trang được dùng trong hàng trăm request riêng biệt mỗi ngày. Làm sao để tránh upload lại toàn bộ nội dung file mỗi lần?", "se": "The same 80-page policy document is used in hundreds of separate requests per day. How do you avoid uploading its bytes every time?", "oe": ["Split it across several API keys", "Upload it once with the Files API and reference its file_id in each request", "Send it once and rely on the API remembering it", "Put it in the metadata field"], "ov": ["Chia nó ra cho nhiều API key", "Upload một lần bằng Files API và tham chiếu `file_id` của nó trong mỗi request", "Gửi một lần và dựa vào việc API tự nhớ nó", "Đặt nó vào trường `metadata`"], "on": ["Sai — số lượng API key không ảnh hưởng đến việc truyền nội dung file trong mỗi request.", "Đúng — upload một lần, nhận `file_id` và tham chiếu trong khối `document` ở các request sau.", "Sai — Messages API là stateless, không lưu nội dung giữa các request.", "Sai — trường `metadata` chỉ chứa thông tin như `user_id`, không dùng để truyền tài liệu cho model."], "c": [1], "x": "Câu hỏi kiểm tra Files API. Messages API là stateless: mỗi request phải tự chứa mọi thứ model cần, API không \"nhớ\" nội dung từ request trước. Nếu gửi PDF dạng base64 thì mỗi request phải mang theo toàn bộ bytes của file 80 trang, tốn băng thông và làm request nặng.\n\nFiles API giải quyết việc này: upload file một lần qua `POST /v1/files`, nhận về `file_id`, rồi trong mỗi request chỉ cần tham chiếu, ví dụ `{\"type\": \"document\", \"source\": {\"type\": \"file\", \"file_id\": \"file_011C...\"}}`. File được lưu trong workspace và dùng lại cho đến khi bị xoá hoặc hết hạn. Lưu ý: `file_id` chỉ tránh việc upload lại bytes; nội dung vẫn được tính là input token mỗi lần dùng. Để giảm chi phí và latency khi dùng lặp lại, nên kết hợp với prompt caching (đặt `cache_control` ở khối document).\n\nBẫy thường gặp: nghĩ rằng gửi một lần là API sẽ nhớ, đây là hiểu sai về tính stateless. Trường `metadata` của Messages API chỉ dành cho thông tin như `user_id`, không chứa nội dung tài liệu. Chia sang nhiều API key không liên quan gì đến việc truyền file. Mẹo nhớ: Files API giúp không upload lại, prompt caching giúp không xử lý lại.", "k": ["Files API", "file_id", "stateless API", "document content block", "prompt caching"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/files", "t": "Files API", "s": "Using a file in messages", "n": "Hướng dẫn tham chiếu file đã upload bằng `file_id` trong khối `document` hoặc `image`."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/files", "t": "Files API", "s": "File lifecycle", "n": "File gắn với workspace và tồn tại đến khi bị xoá hoặc tới `expires_at`."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "t": "Prompt caching", "s": "", "n": "Kết hợp cache để giảm chi phí xử lý tài liệu được dùng lặp lại."}], "f": "Tài liệu hiện hành cho biết Files API đã ra khỏi beta, không còn cần header `anthropic-beta: files-api-2025-04-14` (SDK dùng `client.files` thay vì `client.beta.files`). File có thể đặt thời hạn bằng `expires_in_seconds` khi upload. `file_id` không giảm số input token tính phí, chỉ tránh gửi lại bytes.", "ke": [], "ap": ["PA#1", "PB#4", "PC#53"]}, "Q095": {"d": 6, "sv": "Bạn muốn Claude tuân theo một phong cách output cụ thể một cách ổn định. Bạn nên dùng ví dụ như thế nào?", "se": "You want Claude to follow a specific output style reliably. How should you use examples?", "oe": ["Give twenty near-identical examples", "Give one example and forbid any deviation", "Give a few diverse, relevant examples wrapped in <example> tags", "Avoid examples; they confuse the model"], "ov": ["Đưa hai mươi ví dụ gần như giống hệt nhau", "Đưa một ví dụ và cấm mọi sai khác", "Đưa một vài ví dụ đa dạng, liên quan, được bọc trong thẻ `<example>`", "Tránh dùng ví dụ; chúng làm model bối rối"], "on": ["Sai — ví dụ gần giống nhau khiến model bắt chước chi tiết bề mặt và lãng phí token, không tăng khả năng khái quát.", "Sai — một ví dụ kèm lệnh cấm khiến model sao chép máy móc và xử lý kém các input khác.", "Đúng — vài ví dụ đa dạng, liên quan trong thẻ `<example>` là cách khuyến nghị để định hình output ổn định.", "Sai — few-shot là một trong những kỹ thuật hiệu quả nhất để cải thiện độ chính xác và tính nhất quán."], "c": [2], "x": "Câu hỏi kiểm tra kỹ thuật few-shot (multishot) prompting. Ví dụ là một trong những cách hiệu quả nhất để Claude nắm đúng định dạng, giọng văn và cấu trúc output. Tài liệu của Anthropic khuyến nghị ví dụ cần: liên quan (phản ánh use case thật), đa dạng (bao phủ các trường hợp biên, không vô tình tạo pattern ngoài ý muốn), và rõ ràng (bọc trong thẻ `<example>`, nhiều ví dụ thì đặt trong `<examples>`). Thường 3 đến 5 ví dụ là điểm khởi đầu tốt.\n\nVí dụ, khi muốn tóm tắt ticket theo định dạng cố định, bạn có thể đưa ba ví dụ: một ticket ngắn, một ticket dài nhiều vấn đề, một ticket thiếu thông tin, mỗi cái trong `<example>` gồm input và output mong muốn. Claude sẽ khái quát được cấu trúc thay vì sao chép nội dung.\n\nBẫy thường gặp: hai mươi ví dụ gần giống nhau làm model bám vào chi tiết bề mặt (độ dài, từ ngữ cụ thể) và tốn token. Một ví dụ duy nhất kèm lệnh cấm sai khác khiến model sao chép quá sát, xử lý kém các input khác biệt. Bỏ hẳn ví dụ là bỏ đi một công cụ mạnh. Mẹo nhớ: ít nhưng đa dạng, liên quan, và có thẻ XML rõ ràng.", "k": ["few-shot", "multishot prompting", "XML tags", "output consistency"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively", "t": "Prompting best practices — Use examples effectively", "s": "Crafting effective examples", "n": "Khuyến nghị ví dụ liên quan, đa dạng, rõ ràng và bọc trong thẻ `<example>`."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/increase-consistency", "t": "Increase output consistency", "s": "", "n": "Đề xuất dùng ví dụ để giữ định dạng output nhất quán."}], "f": "", "ke": [], "ap": ["PA#2", "PC#45"]}, "Q096": {"d": 8, "sv": "Code của bạn thử chạy một tool mà Claude yêu cầu, và nó ném ra exception. Bạn nên gửi lại gì?", "se": "Your code tries to run a tool that Claude requested, and it throws an exception. What should you send back?", "oe": ["A new user message asking Claude to forget the tool", "A tool_result with is_error: true and a useful error message", "Nothing; end the conversation", "A fake successful result"], "ov": ["Một user message mới yêu cầu Claude quên tool đó đi", "Một `tool_result` với `is_error: true` và một thông báo lỗi hữu ích", "Không gửi gì; kết thúc hội thoại", "Một kết quả thành công giả"], "on": ["Sai — bỏ qua lỗi và vi phạm giao thức vì `tool_use` trước đó không có `tool_result` tương ứng.", "Đúng — `is_error: true` kèm thông báo rõ ràng giúp Claude hiểu lỗi và tự phục hồi hoặc báo cho người dùng.", "Sai — kết thúc đột ngột làm mất cơ hội phục hồi và hội thoại bị bỏ dở.", "Sai — kết quả giả khiến Claude đưa ra thông tin sai cho người dùng mà không biết."], "c": [1], "x": "Câu hỏi kiểm tra cách xử lý lỗi khi thực thi tool. Giao thức tool use yêu cầu mỗi khối `tool_use` phải được đáp lại bằng một `tool_result` có `tool_use_id` tương ứng ở lượt kế tiếp. Khi tool lỗi, bạn vẫn trả `tool_result` nhưng đặt `\"is_error\": true` và đưa vào `content` một thông báo mô tả rõ chuyện gì xảy ra.\n\nVí dụ: `{\"type\": \"tool_result\", \"tool_use_id\": \"toolu_01A\", \"is_error\": true, \"content\": \"Inventory service timed out after 5s. Try again or ask the user for a different SKU.\"}`. Claude sẽ đọc lỗi này và tự điều chỉnh: thử lại với tham số khác, chọn to
