tions the model calls to change external systems", "Reusable prompt templates chosen by the user", "Data and context a server exposes for the application to read, such as files or database schemas", "Authentication tokens"], "ov": ["Các hàm mà model gọi để thay đổi hệ thống bên ngoài", "Các prompt template tái sử dụng do user chọn", "Dữ liệu và ngữ cảnh mà server expose để ứng dụng đọc, như file hoặc database schema", "Các token xác thực"], "on": ["Sai — đó là định nghĩa của tools (model-controlled, có thể thay đổi hệ thống bên ngoài).", "Sai — đó là định nghĩa của prompts (user-controlled, template do user chọn gọi).", "Đúng — resources là dữ liệu và ngữ cảnh thụ động, do ứng dụng kiểm soát, ví dụ file hay database schema.", "Sai — token xác thực thuộc tầng authorization của transport, không phải primitive resources."], "c": [2], "x": "Câu này kiểm tra ba primitive phía server của MCP và \"ai kiểm soát\" từng loại. Tools: model-controlled — các hàm model tự quyết định gọi để thực hiện hành động (ghi DB, gửi email, gọi API). Resources: application-controlled — dữ liệu thụ động, thiên về đọc, cung cấp ngữ cảnh như nội dung file, database schema, tài liệu API. Prompts: user-controlled — template dựng sẵn mà user chủ động gọi, thường hiện dưới dạng slash command.\n\nMỗi resource có một URI duy nhất và MIME type, ví dụ `file:///docs/readme.md` hoặc `postgres://db/schema`. Có hai kiểu: direct resource (URI cố định) và resource template (URI có tham số như `weather://forecast/{city}/{date}`). Client dùng `resources/list` để khám phá và `resources/read` để lấy nội dung; ứng dụng tự quyết định đưa phần nào vào context của model (chọn lọc, tìm bằng embeddings hoặc đưa toàn bộ).\n\nBẫy thường gặp: nhầm resources với tools vì cả hai đều \"lấy dữ liệu\". Khác biệt then chốt là ai quyết định và mục đích: tools do model gọi và có thể gây side effect; resources do ứng dụng chọn và chỉ đọc. Mẹo nhớ: Tools = Model, Resources = Application, Prompts = User (\"T-M, R-A, P-U\").", "k": ["MCP", "resources", "tools", "prompts", "application-controlled"], "r": [{"u": "https://modelcontextprotocol.io/docs/learn/server-concepts", "t": "Understanding MCP servers", "s": "Core Server Features", "n": "Bảng so sánh tools (model), resources (application), prompts (user) kèm ví dụ cụ thể."}, {"u": "https://modelcontextprotocol.io/specification/2025-06-18/server/resources", "t": "Resources (MCP spec 2025-06-18)", "s": "", "n": "Đặc tả resources: URI, MIME type, `resources/list`, `resources/read` và resource templates."}], "f": "", "ke": ["Resources are application-controlled, read-oriented data. Tools perform actions and prompts are user-invoked templates."], "ap": ["D8#5", "M2#13", "PD#5"]}, "Q053": {"d": 8, "sv": "Một tool được định nghĩa với các tham số tên là q, x và f, và Claude thường điền sai chúng. Bạn nên sửa gì trước tiên?", "se": "A tool is defined with parameters named q, x and f, and Claude often fills them incorrectly. What should you fix first?", "oe": ["Use descriptive parameter names and describe each one in the schema", "Mark every parameter as optional", "Switch to streaming", "Rename the tool to a single letter as well"], "ov": ["Dùng tên tham số mang tính mô tả và mô tả từng tham số trong schema", "Đánh dấu mọi tham số là optional", "Chuyển sang streaming", "Đổi tên tool thành một chữ cái luôn"], "on": ["Đúng — tên rõ nghĩa cùng mô tả từng tham số cho Claude biết ý nghĩa và định dạng cần điền.", "Sai — optional không làm Claude hiểu tham số hơn, chỉ dẫn tới việc bỏ trống hoặc thiếu dữ liệu.", "Sai — streaming chỉ thay đổi cách nhận response, không ảnh hưởng độ chính xác của tham số.", "Sai — tên tool một chữ cái càng làm Claude khó hiểu tool dùng để làm gì."], "c": [0], "x": "Câu này kiểm tra best practice khi định nghĩa tool: Claude chỉ biết về tool qua tên, mô tả và `input_schema` bạn cung cấp. Tên tham số như `q`, `x`, `f` không cho biết ý nghĩa, định dạng hay ràng buộc, nên Claude phải đoán — dẫn tới điền sai. Tài liệu Anthropic coi mô tả chi tiết là yếu tố quan trọng nhất ảnh hưởng tới hiệu năng tool.\n\nVí dụ sửa: thay `{\"q\": {\"type\": \"string\"}}` bằng `{\"search_query\": {\"type\": \"string\", \"description\": \"Từ khoá tìm kiếm sản phẩm, ví dụ 'giày chạy bộ nam'\"}, \"max_results\": {\"type\": \"integer\", \"description\": \"Số kết quả tối đa, từ 1 đến 50\"}, \"date_from\": {\"type\": \"string\", \"description\": \"Ngày bắt đầu, định dạng YYYY-MM-DD\"}}`. Thêm `enum` cho giá trị cố định, `required` cho tham số bắt buộc, và có thể thêm `input_examples` cho tool phức tạp. Bài viết về writing tools for agents cũng khuyên đặt tên rõ ràng, không mơ hồ (ví dụ `user_id` thay vì `user`).\n\nBẫy thường gặp: đánh dấu optional — chỉ khiến Claude bỏ trống tham số chứ không hiểu đúng hơn. Streaming không liên quan tới chất lượng điền tham số. Mẹo nhớ: viết mô tả tool như đang giải thích cho một đồng nghiệp mới chưa từng thấy code.", "k": ["tool definition", "input_schema", "parameter descriptions", "tool naming"], "r": [{"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "t": "Define tools", "s": "Best practices for tool definitions", "n": "Nhấn mạnh mô tả chi tiết cho tool và từng tham số là yếu tố quan trọng nhất cho hiệu năng tool use."}, {"u": "https://www.anthropic.com/engineering/writing-tools-for-agents", "t": "Writing effective tools for agents — with agents", "s": "Prompt-engineering your tool descriptions", "n": "Khuyên đặt tên tham số rõ ràng, không mơ hồ và viết mô tả như giải thích cho người mới."}], "f": "", "ke": ["Clear names and per-parameter descriptions tell Claude what each argument means and how to format it."], "ap": ["D8#6"]}, "Q054": {"d": 1, "sv": "Một agent customer-success hỗ trợ các cuộc gọi onboarding định kỳ cho khách hàng doanh nghiệp. Nhóm muốn có memory để cải thiện các phiên sau mà không làm agent bị nhiễu bởi chi tiết không liên quan. Artifact - các mục memory: (1) Khách hàng thích email trạng thái hằng tuần ngắn gọn; (2) Cuộc gọi trước bắt đầu trễ ba phút; (3) Region rollout được duyệt là eu-west; (4) Link chia sẻ màn hình tạm thời từ hôm qua. Mục tiêu: giữ lại thông tin hữu ích cho các tác vụ sau. Chính sách memory nào là tốt nhất?", "se": "A customer-success agent supports recurring enterprise onboarding calls. The team wants memory to improve future sessions without polluting the agent with irrelevant details. Artifact - memory items: (1) Customer prefers concise weekly status emails; (2) Last call started three minutes late; (3) Approved rollout region is eu-west; (4) Temporary screen-share link from yesterday. Goal: retain information useful across future tasks. Which memory policy is best?", "oe": ["Store every conversation turn and every temporary artifact", "Disable memory because agents should use only current context", "Persist durable preferences and decisions, not transient details", "Store only raw tool outputs and ignore human decisions"], "ov": ["Lưu mọi lượt hội thoại và mọi artifact tạm thời", "Tắt memory vì agent chỉ nên dùng context hiện tại", "Lưu các sở thích và quyết định bền vững, không lưu chi tiết tạm thời", "Chỉ lưu output thô của tool và bỏ qua quyết định của con người"], "on": ["Sai — lưu mọi thứ làm memory nhiễu, tốn context và dễ khiến agent dùng thông tin tạm thời đã hết hạn.", "Sai — tắt memory làm mất các sở thích và quyết định có giá trị cho các phiên onboarding định kỳ.", "Đúng — lưu có chọn lọc thông tin bền vững như sở thích giao tiếp và region đã duyệt, bỏ chi tiết tạm thời.", "Sai — output thô của tool thường dài và nhất thời, còn quyết định của con người mới là thông tin bền vững quan trọng."], "c": [2], "x": "Câu này kiểm tra nguyên tắc context engineering cho agent dài hạn: memory phải được chọn lọc. Context là tài nguyên hữu hạn; mỗi token không liên quan đều làm loãng sự chú ý của model (context rot) và có thể dẫn tới hành động dựa trên thông tin cũ. Mục tiêu là tìm tập token nhỏ nhất nhưng có tín hiệu cao nhất.\n\nÁp dụng vào artifact: mục (1) sở thích email ngắn gọn hằng tuần và mục (3) region rollout eu-west đã duyệt là thông tin bền vững, có giá trị cho mọi phiên sau — nên lưu. Mục (2) cuộc gọi trễ ba phút là sự kiện một lần, không ảnh hưởng quyết định tương lai. Mục (4) link screen-share tạm thời sẽ hết hạn; nếu lưu, agent có thể gửi link chết cho khách — đây là stale context. Ví dụ một memory file tốt: `customer_prefs: weekly concise status email; approved_region: eu-west`.\n\nBẫy thường gặp: \"lưu hết cho chắc\" — gây nhiễu, tốn token, tăng rủi ro dùng dữ liệu lỗi thời. Ngược lại, tắt memory bỏ lỡ lợi ích cá nhân hoá và liên tục. Bỏ qua quyết định của con người là bỏ đúng phần giá trị nhất. Mẹo nhớ: lưu thứ còn đúng vào tuần sau (preferences, decisions), bỏ thứ chỉ đúng hôm nay.", "k": ["agent memory", "context engineering", "structured note-taking", "stale context", "selective persistence"], "r": [{"u": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", "t": "Effective context engineering for AI agents", "s": "Structured note-taking", "n": "Mô tả việc agent ghi chú bền vững bên ngoài context window để dùng lại sau, giữ thông tin quan trọng qua nhiều phiên."}, {"u": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", "t": "Effective context engineering for AI agents", "s": "", "n": "Nhấn mạnh context là tài nguyên hữu hạn, cần chọn tập token nhỏ nhất có tín hiệu cao nhất."}], "f": "", "ke": ["Persisted agent memory should be selective. Durable preferences and decisions, such as communication style and approved rollout region, can improve future sessions. Transient facts, such as a late start or temporary screen-share link, should not be indiscriminately stored because they add noise and may cause stale context."], "ap": ["D1X#1"]}, "Q055": {"d": 1, "sv": "Một support agent có thể điều tra các vấn đề thanh toán và yêu cầu hoàn tiền. Bộ phận Product muốn agent tự chủ với các bước điều tra rủi ro thấp, nhưng hoàn tiền trên $100 phải qua review tất định (deterministic). Trace hành động dự kiến: observe: khách báo bị trừ tiền hai lần; plan: kiểm tra lịch sử thanh toán; act: get_billing_events(account_id); plan: hoàn $240; act: create_refund(amount=240). Thay đổi kiến trúc tốt nhất là gì?", "se": "A support agent can investigate billing issues and request refunds. Product wants autonomy for low-risk investigation, but refunds above $100 require deterministic review. Planned action trace: observe: customer reports duplicate charge; plan: inspect billing history; act: get_billing_events(account_id); plan: issue $240 refund; act: create_refund(amount=240). What is the best architectural change?", "oe": ["Add a pre-refund hook that blocks or routes high-value refunds for approval.", "Allow the agent to decide refunds if its reasoning mentions the policy.", "Move refund decisions into long-term memory for future consistency.", "Delegate all refund actions to another autonomous billing subagent."], "ov": ["Thêm một hook trước khi hoàn tiền để chặn hoặc chuyển các khoản hoàn tiền giá trị cao đi phê duyệt.", "Cho phép agent tự quyết định hoàn tiền nếu phần suy luận của nó có nhắc tới chính sách.", "Chuyển quyết định hoàn tiền vào long-term memory để nhất quán về sau.", "Giao toàn bộ hành động hoàn tiền cho một billing subagent tự chủ khác."], "on": ["Đúng — hook trước khi hoàn tiền thực thi ngưỡng $100 một cách tất định và chuyển khoản lớn đi phê duyệt trước khi side effect xảy ra.", "Sai — reasoning của model không phải kiểm soát tất định; agent có thể hiểu sai hoặc bị thao túng.", "Sai — memory giúp nhất quán thông tin, không thực thi được ngưỡng phê duyệt tại thời điểm hành động.", "Sai — một subagent tự chủ khác vẫn là quyết định xác suất, không đáp ứng yêu cầu review tất định."], "c": [0], "x": "Câu này kiểm tra cách đặt guardrail tất định quanh hành động có side effect. Đề nhấn mạnh từ khoá \"deterministic review\": chính sách phải được thực thi bằng code, không phụ thuộc vào việc model có nhớ và tuân thủ prompt hay không. Hook chính là công cụ cho việc này — trong Claude Agent SDK và Claude Code, hook `PreToolUse` chạy trước mỗi lần gọi tool và có thể cho phép, từ chối hoặc yêu cầu xác nhận.\n\nVí dụ: hook kiểm tra nếu tool là `create_refund` và `input.amount > 100` thì trả về quyết định deny kèm lý do \"Refund requires human approval\", hoặc đẩy yêu cầu vào hàng đợi phê duyệt. Với `amount=240` trong trace, hook chặn trước khi gọi API hoàn tiền thật. Trong khi đó các bước điều tra như `get_billing_events` vẫn chạy tự do, giữ nguyên tính tự chủ mà Product mong muốn.\n\nBẫy thường gặp: tin vào việc agent \"nhắc tới chính sách\" trong reasoning — đó vẫn là quyết định xác suất, có thể sai hoặc bị prompt injection. Đưa vào memory hay giao cho subagent tự chủ khác chỉ dời vấn đề sang chỗ khác, không tạo kiểm soát tất định. Mẹo nhớ: \"luật bắt buộc thì viết bằng code (hook), phán đoán thì để agent\".", "k": ["hooks", "PreToolUse", "human-in-the-loop", "deterministic guardrails", "side effects"], "r": [{"u": "https://code.claude.com/docs/en/hooks", "t": "Hooks reference", "s": "PreToolUse", "n": "Mô tả hook `PreToolUse` chạy trước khi tool được gọi và có thể allow, deny hoặc ask để kiểm soát hành động."}, {"u": "https://code.claude.com/docs/en/agent-sdk/overview", "t": "Agent SDK overview", "s": "", "n": "Agent SDK hỗ trợ hooks và kiểm soát quyền để chèn logic tất định quanh vòng lặp agent."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Agents", "n": "Nhấn mạnh agent tự chủ cần guardrail và điểm dừng để con người kiểm tra ở các bước quan trọng."}], "f": "", "ke": ["Hooks are appropriate for deterministic checks around side-effecting or high-impact actions. A pre-refund hook can enforce the threshold and route the action for approval before the external refund operation occurs."], "ap": ["D1X#2"]}, "Q056": {"d": 1, "sv": "Một trợ lý mua sắm (procurement) phải đánh giá các đề xuất của nhà cung cấp. Ghi chú thiết kế: Việc chấm điểm đề xuất đòi hỏi phán đoán và so sánh giữa nhiều tài liệu. Gói phê duyệt luôn phải kèm một checklist bắt buộc. Nếu tổng chi vượt ngưỡng, luôn phải qua finance review. Gói cuối cùng phải được lưu trữ ở một vị trí cố định. Thiết kế nào cân bằng TỐT NHẤT giữa độ tin cậy và tính linh hoạt agentic?", "se": "A procurement assistant must evaluate vendor proposals. Design note: Proposal scoring requires judgment and comparison across documents. The approval packet must always include a required checklist. If total spend exceeds a threshold, finance review must always occur. The final packet must be archived in a fixed location. Which design BEST balances reliability and agentic flexibility?", "oe": ["Let the agent decide scoring, checklist inclusion, finance review, and archiving.", "Use deterministic steps for required controls and agentic reasoning for proposal scoring.", "Use a fixed workflow for all scoring and avoid Claude for proposal comparison.", "Use subagents for every checklist item and let them choose approval routing."], "ov": ["Để agent tự quyết định việc chấm điểm, đưa checklist vào, finance review và lưu trữ.", "Dùng các bước tất định cho các kiểm soát bắt buộc và suy luận agentic cho việc chấm điểm đề xuất.", "Dùng workflow cố định cho toàn bộ việc chấm điểm và không dùng Claude để so sánh đề xuất.", "Dùng subagent cho từng mục checklist và để chúng chọn luồng phê duyệt."], "on": ["Sai — giao các kiểm soát bắt buộc cho agent khiến chúng có thể bị bỏ sót, không đảm bảo độ tin cậy.", "Đúng — code tất định thực thi các kiểm soát không thương lượng, còn agent xử lý phần chấm điểm cần phán đoán.", "Sai — bỏ Claude khỏi việc so sánh đề xuất làm mất khả năng phán đoán định tính mà tác vụ cần.", "Sai — subagent cho từng mục checklist làm tăng độ phức tạp và vẫn để routing phê duyệt phụ thuộc quyết định xác suất."], "c": [1], "x": "Câu này kiểm tra nguyên tắc chọn giữa workflow và agent trong bài \"Building effective agents\": workflow (đường đi định trước bằng code) mang lại tính dự đoán và nhất quán; agent (LLM tự điều khiển quá trình) mang lại linh hoạt cho tác vụ mở, cần phán đoán. Hệ thống tốt thường là hybrid — chỉ dùng agentic ở nơi thật sự cần.\n\nPhân tích ghi chú thiết kế: các chữ \"always\" và \"must\" (checklist bắt buộc, finance review khi vượt ngưỡng, lưu trữ ở vị trí cố định) là control flow không được thương lượng — nên viết bằng code tất định: `if total > THRESHOLD: route_to_finance()`, luôn đính kèm checklist template, luôn ghi vào `s3://procurement/approved/`. Còn việc so sánh, chấm điểm đề xuất từ nhiều tài liệu cần đọc hiểu và đánh giá định tính — đúng thế mạnh của Claude.\n\nBẫy thường gặp: giao hết cho agent (mất độ tin cậy, có thể quên finance review) hoặc bỏ hẳn LLM (mất khả năng phán đoán, chấm điểm cứng nhắc). Dùng subagent cho từng mục checklist là phức tạp hoá không cần thiết và vẫn để quyết định routing mang tính xác suất. Mẹo nhớ: thấy \"always/must/fixed\" → code tất định; thấy \"judgment/compare\" → agent.", "k": ["workflow vs agent", "hybrid design", "deterministic controls", "agentic reasoning", "reliability"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "When (and when not) to use agents", "n": "Giải thích workflow cho tính dự đoán và nhất quán, agent cho linh hoạt, khuyến nghị giải pháp đơn giản nhất phù hợp."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Building blocks, workflows, and agents", "n": "Mô tả các pattern workflow có thể kết hợp với bước LLM, minh hoạ thiết kế hybrid."}], "f": "", "ke": ["A hybrid design is best: deterministic code should enforce non-negotiable control-flow actions such as required checklists, threshold routing, and archiving, while the agent handles the judgment-heavy comparison and scoring work."], "ap": ["D1X#3"]}, "Q057": {"d": 1, "sv": "Một agent Claude tự xây dựng dùng để điều tra các payment job bị lỗi. Ở môi trường staging, một lần chạy tiêu tốn số tool call nhiều hơn dự kiến rất nhiều. Artifact: 00:00 plan: kiểm tra job lỗi 8431; 00:01 tool: get_job(8431) -> status=failed, reason=timeout; 00:02 tool: get_job(8431) -> status=failed, reason=timeout; 00:03 tool: get_job(8431) -> status=failed, reason=timeout; 00:04 note: \"Need more confidence before final answer\" (Cần chắc chắn hơn trước khi trả lời cuối cùng); 00:05 tool: get_job(8431) -> status=failed, reason=timeout. Cấu hình vòng lặp: `max_iterations` chưa đặt, `retry_limit` chưa đặt. Thay đổi tiếp theo tốt nhất là gì?", "se": "A custom Claude agent investigates failed payment jobs. In staging, one run consumed far more tool calls than expected. Artifact: 00:00 plan: inspect failed job 8431; 00:01 tool: get_job(8431) -> status=failed, reason=timeout; 00:02 tool: get_job(8431) -> status=failed, reason=timeout; 00:03 tool: get_job(8431) -> status=failed, reason=timeout; 00:04 note: \"Need more confidence before final answer\"; 00:05 tool: get_job(8431) -> status=failed, reason=timeout. Loop config: max_iterations unset, retry_limit unset. What is the best next change?", "oe": ["Add explicit stop criteria, iteration limits, and retry handling", "Persist every tool observation to long-term agent memory", "Replace the tool with a larger response payload", "Delegate the same job lookup to three subagents"], "ov": ["Thêm tiêu chí dừng (stop criteria) rõ ràng, giới hạn số vòng lặp và cơ chế xử lý retry", "Lưu mọi observation của tool vào long-term memory của agent", "Thay tool bằng một tool trả về payload lớn hơn", "Giao cùng một việc tra cứu job cho ba subagent"], "on": ["Đúng — log cho thấy cùng một tool call lặp lại với kết quả không đổi và không có giới hạn nào; stop criteria, `max_iterations` và `retry_limit` trực tiếp chặn vòng lặp chạy vô hạn.", "Sai — lưu observation vào memory không tạo ra điều kiện dừng; agent vẫn có thể gọi lại tool mãi và còn làm phình memory bằng dữ liệu trùng lặp.", "Sai — vấn đề không nằm ở lượng dữ liệu trả về mà ở chỗ vòng lặp không biết khi nào dừng; payload lớn hơn chỉ tốn thêm token.", "Sai — giao cùng việc cho ba subagent làm tăng gấp ba số tool call lãng phí mà không xử lý nguyên nhân gốc là thiếu tiêu chí dừng."], "c": [0], "x": "Câu này kiểm tra cấu trúc của một agent loop đúng chuẩn: ngoài vòng lặp plan → tool action → observation, agent bắt buộc phải có điều kiện kết thúc (termination/stopping criteria), giới hạn số vòng lặp (iteration bound), xử lý timeout và chính sách retry. Bài viết \"Building effective agents\" của Anthropic nhấn mạnh agent nên có stopping conditions như số vòng lặp tối đa để giữ quyền kiểm soát.\n\nTrong log, agent gọi `get_job(8431)` bốn lần và lần nào cũng nhận kết quả y hệt `status=failed, reason=timeout`. Observation đã ổn định, không có thông tin mới, nhưng vì `max_iterations` và `retry_limit` đều chưa đặt nên không có gì chặn agent lại; ghi chú \"Need more confidence\" cho thấy model cứ thế tiếp tục \"tìm thêm chắc chắn\". Cách sửa đúng là thêm tiêu chí dừng (ví dụ: nếu hai observation liên tiếp giống nhau thì kết luận hoặc escalate), đặt `max_iterations` (ví dụ 10) và `retry_limit` (ví dụ 2 lần cho cùng một tool call với cùng tham số).\n\nBẫy thường gặp: chọn \"thêm subagent\" hay \"thêm memory\" vì nghe có vẻ nâng cao. Thực ra subagent sẽ nhân ba số tool call lãng phí, còn memory không giải quyết việc thiếu điều kiện dừng. Mẹo nhớ: thấy log có tool call lặp lại với kết quả giống hệt nhau và config \"unset\" thì đáp án gần như luôn là stop criteria + iteration limit + retry handling.", "k": ["agent loop", "stopping criteria", "max iterations", "retry limit", "runaway agent"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Agents", "n": "Mô tả agent hoạt động theo vòng lặp dựa trên phản hồi từ môi trường và khuyến nghị đặt stopping conditions như số vòng lặp tối đa để giữ kiểm soát."}, {"u": "https://code.claude.com/docs/en/agent-sdk/overview", "t": "Agent SDK overview", "s": "", "n": "Agent SDK cung cấp agent loop có sẵn với các tùy chọn giới hạn số turn, giúp tránh vòng lặp chạy vô hạn."}], "f": "", "ke": ["The log shows repeated identical tool calls despite stable observations, and the loop configuration has no maximum iteration setting or retry limit. A practical Claude agent loop needs explicit termination criteria, iteration bounds, timeout handling, and retry behavior to prevent runaway or repetitive execution."], "ap": ["D1X#4"]}, "Q058": {"d": 1, "sv": "Một trợ lý tuyển dụng dùng agent để sàng lọc các tin nhắn ứng viên gửi đến. Sau khi agent phân loại một tin nhắn là cần người xem xét (human review), ứng dụng bắt buộc phải luôn tạo một task trong hệ thống HR ngay tại thời điểm đó. Pattern triển khai nào là tốt nhất?", "se": "A recruiting assistant uses an agent to screen incoming candidate messages. After the agent classifies a message as needing human review, the application must always create a task in the HR system at that exact point. Which implementation pattern is best?", "oe": ["Tell the model to remember to create the HR task", "Use a deterministic hook after the review classification", "Let the agent choose whether task creation is needed", "Store the decision in memory for the next conversation"], "ov": ["Dặn model nhớ tạo task HR", "Dùng một hook tất định (deterministic hook) chạy sau bước phân loại review", "Để agent tự quyết định có cần tạo task hay không", "Lưu quyết định vào memory để dùng cho cuộc hội thoại sau"], "on": ["Sai — chỉ dựa vào lời dặn trong prompt thì model vẫn có thể quên hoặc bỏ qua; không đảm bảo hành động luôn xảy ra.", "Đúng — hook chạy tự động ngay sau bước phân loại nên task HR luôn được tạo đúng thời điểm, tách biệt phần suy luận của model khỏi side effect bắt buộc.", "Sai — yêu cầu là luôn tạo task khi cần review, nên việc này không phải là quyết định tùy ý của agent; giao cho agent tạo ra rủi ro bỏ sót.", "Sai — memory phục vụ ngữ cảnh cho lần sau, không thực thi hành động tại thời điểm hiện tại và không đảm bảo task được tạo."], "c": [1], "x": "Nguyên tắc cốt lõi: hành động nào bắt buộc phải xảy ra tại một điểm xác định trong workflow thì phải do code ứng dụng đảm bảo một cách tất định (deterministic), không được phó mặc cho model. Hook chính là cơ chế đó: một đoạn code chạy tự động khi một sự kiện xảy ra, bất kể model \"có nhớ\" hay không.\n\nỞ đây model làm tốt phần cần trí tuệ là phân loại tin nhắn (ví dụ trả về `{\"label\": \"needs_human_review\"}`). Ngay sau đó, hook của ứng dụng kiểm tra nhãn và gọi API HR để tạo task. Như vậy side effect bắt buộc luôn xảy ra 100%, có thể kiểm thử, có log và không phụ thuộc vào việc prompt được tuân thủ đến đâu. Đây cũng là tinh thần của hook trong Claude Code: hook biến một gợi ý thành quy tắc chắc chắn được thực thi.\n\nBẫy thường gặp: chọn \"dặn model nhớ\" hoặc \"để agent tự quyết\" vì nghĩ model đủ thông minh. Model là xác suất, có thể bỏ sót dù prompt rất rõ. Mẹo đi thi: gặp các từ khóa \"must always\", \"at that exact point\", \"reliable\" cho một side effect cố định thì chọn hook/code tất định; còn \"phân loại, suy luận, đánh giá\" mới là việc của model.", "k": ["hook", "deterministic control", "side effect", "workflow"], "r": [{"u": "https://code.claude.com/docs/en/hooks", "t": "Hooks reference", "s": "", "n": "Tài liệu hook của Claude Code mô tả hook là lệnh chạy tự động tại các điểm xác định trong vòng đời agent, đảm bảo hành động diễn ra thay vì phụ thuộc vào model."}, {"u": "https://code.claude.com/docs/en/agent-sdk/overview", "t": "Agent SDK overview", "s": "", "n": "Agent SDK hỗ trợ hook để chèn logic tất định của ứng dụng vào trước/sau các bước của agent."}], "f": "", "ke": ["Hooks are appropriate when a specific action must occur deterministically at a defined point in an agent workflow. The model can classify the message, but the application should enforce the required side effect instead of relying only on model discretion."], "ap": ["D1X#5"]}, "Q059": {"d": 1, "sv": "Một team đưa Claude vào quy trình viết release notes hằng tuần. Đầu vào là danh sách các pull request đã merge, và quy trình luôn cố định: nhóm theo component, tóm tắt các thay đổi người dùng nhìn thấy được, định dạng markdown, rồi gửi bản nháp cho một biên tập viên. Không cần chọn tool động hay review chuyên biệt. Team nên chọn thiết kế nào?", "se": "A team is adding Claude to a weekly release-notes process. The input is a list of merged pull requests, and the required process is always: group by component, summarize user-visible changes, format markdown, and send the draft to a human editor. There is no need for dynamic tool selection or specialized review. Which design should the team prefer?", "oe": ["A manager agent with separate summarizer, formatter, and reviewer subagents", "A deterministic workflow with bounded Claude summarization in the middle", "A fully autonomous agent that decides how to process each weekly release", "A persistent agent that accumulates every prior release-note draft in context"], "ov": ["Một manager agent với các subagent riêng cho tóm tắt, định dạng và review", "Một workflow tất định với bước tóm tắt bằng Claude được giới hạn phạm vi ở giữa", "Một agent hoàn toàn tự chủ tự quyết cách xử lý mỗi lần release hằng tuần", "Một agent chạy liên tục, tích lũy mọi bản release notes trước đó trong context"], "on": ["Sai — kiến trúc manager và subagent thêm độ phức tạp, chi phí và độ trễ trong khi quy trình đơn giản, cố định và không cần review chuyên biệt.", "Đúng — quy trình tuyến tính, biết trước nên ứng dụng điều khiển các bước; Claude chỉ đảm nhận bước tóm tắt với phạm vi rõ ràng.", "Sai — để agent tự quyết cách xử lý một quy trình đã cố định làm giảm tính ổn định và khó kiểm soát mà không mang lại lợi ích.", "Sai — tích lũy mọi bản nháp cũ trong context làm phình context window, tăng chi phí và nhiễu, không phục vụ yêu cầu nào của bài."], "c": [1], "x": "Câu này kiểm tra nguyên tắc \"chọn giải pháp đơn giản nhất đáp ứng được yêu cầu\" trong \"Building effective agents\": workflow phù hợp khi các bước đã biết trước và cố định, còn agent chỉ nên dùng khi đường đi không thể xác định trước. Độ phức tạp chỉ nên tăng khi nó thực sự cải thiện kết quả.\n\nQuy trình release notes ở đây tuyến tính và lặp lại y hệt mỗi tuần: grouping theo component (code làm được), tóm tắt (cần Claude), format markdown (template/code), gửi cho editor (code). Vì vậy thiết kế tốt nhất là workflow tất định do ứng dụng điều khiển thứ tự, chỉ gọi Claude ở bước tóm tắt với đầu vào và đầu ra rõ ràng, ví dụ: input là danh sách PR của một component, output là các gạch đầu dòng thay đổi người dùng thấy được. Cách này dễ test, dễ debug, chi phí thấp và có kết quả ổn định.\n\nBẫy thường gặp: chọn manager agent + subagent vì nghe \"xịn\". Đề bài đã nói rõ không cần dynamic tool selection hay specialized review, nên kiến trúc nhiều agent chỉ thêm độ trễ, chi phí và điểm lỗi. Mẹo: thấy cụm \"process is always\", \"known in advance\" thì nghiêng về workflow.", "k": ["workflow vs agent", "deterministic workflow", "prompt chaining", "simplicity"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "When (and when not) to use agents", "n": "Khuyên tìm giải pháp đơn giản nhất có thể; workflow mang lại tính dự đoán được cho các tác vụ đã xác định rõ, agent dành cho bài toán cần linh hoạt."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#chain-complex-prompts", "t": "Prompting best practices — Chain complex prompts", "s": "", "n": "Hướng dẫn chia tác vụ thành các bước nối tiếp, mỗi bước có đầu vào/đầu ra rõ ràng, phù hợp với quy trình release notes cố định."}], "f": "", "ke": ["Because the release-notes process is simple, linear, and known in advance, a deterministic workflow is the best fit. Claude can perform the summarization step, but the application should control the grouping, formatting, handoff, and sequence. A manager hierarchy would add complexity without a clear benefit."], "ap": ["D1X#6"]}, "Q060": {"d": 1, "sv": "Một agent vận hành nội dung soạn bản tóm tắt release notes. Bản tóm tắt cuối cùng luôn phải được ghi vào hệ thống tracking của team theo một template cố định sau khi agent phân tích xong. Trace hiện tại: Bước 1: phân tích các thay đổi đã merge; Bước 2: soạn tóm tắt; Bước 3: model nói \"I will update the tracker later\" (Tôi sẽ cập nhật tracker sau); Bước 4: lần chạy kết thúc mà không cập nhật tracker. Thay đổi nào tốt nhất để việc cập nhật tracker trở nên đáng tin cậy?", "se": "A content operations agent drafts release-note summaries. The final summary must always be written to the team's tracking system using a fixed template after the agent finishes its analysis. Current trace: Step 1: analyze merged changes; Step 2: draft summary; Step 3: model says, \"I will update the tracker later\"; Step 4: run ends with no tracker update. What is the best change to make the tracker update reliable?", "oe": ["Add a deterministic post-run hook that writes the approved summary to the tracker", "Ask the agent more strongly in the prompt to always update the tracker", "Store tracker update examples in memory for future release-note runs", "Split the drafting task across several subagents before writing the tracker"], "ov": ["Thêm một post-run hook tất định ghi bản tóm tắt đã duyệt vào tracker", "Yêu cầu agent mạnh mẽ hơn trong prompt rằng phải luôn cập nhật tracker", "Lưu các ví dụ cập nhật tracker vào memory cho những lần chạy release notes sau", "Chia việc soạn thảo cho nhiều subagent trước khi ghi vào tracker"], "on": ["Đúng — post-run hook chạy tất định sau khi agent xong, đảm bảo bản tóm tắt luôn được ghi vào tracker theo template cố định.", "Sai — prompt mạnh hơn có thể tăng xác suất nhưng vẫn phụ thuộc vào model; trace đã cho thấy model có thể hứa rồi không làm.", "Sai — ví dụ trong memory có thể giúp model biết cách làm, nhưng không buộc việc cập nhật phải xảy ra ở mỗi lần chạy.", "Sai — chia nhỏ phần soạn thảo không liên quan đến việc bước ghi tracker bị bỏ sót; chỉ tăng độ phức tạp."], "c": [0], "x": "Giống câu hook trước, câu này kiểm tra ranh giới giữa việc của model và việc của ứng dụng. Hook cung cấp hành vi tất định bao quanh quá trình chạy của agent; post-run hook (hook chạy sau khi agent kết thúc, tương tự sự kiện `Stop` trong Claude Code) là điểm kiểm soát lý tưởng khi một hành động cố định phải luôn xảy ra sau khi agent tạo ra artifact.\n\nTrace cho thấy model nói \"I will update the tracker later\" rồi run kết thúc mà không làm gì. Đây là ví dụ kinh điển của việc phụ thuộc vào trí nhớ của model. Với post-run hook, ngay khi agent hoàn thành, code ứng dụng lấy bản tóm tắt (ví dụ trường `summary` trong kết quả), điền vào template cố định và gọi API tracker. Việc ghi luôn xảy ra, đúng định dạng, kiểm thử được, và nếu thất bại thì có log/retry rõ ràng. Model chỉ cần làm tốt việc phân tích và soạn thảo.\n\nBẫy: \"nhấn mạnh hơn trong prompt\" (viết hoa, ALWAYS, MUST) có thể cải thiện tỷ lệ nhưng không bao giờ đảm bảo 100%. Mẹo nhớ: \"must always\" + hành động cố định + template cố định thì chuyển cho code/hook, không giao cho model.", "k": ["hook", "post-run hook", "deterministic control", "Stop hook"], "r": [{"u": "https://code.claude.com/docs/en/hooks", "t": "Hooks reference", "s": "", "n": "Mô tả các sự kiện hook (ví dụ `Stop` khi agent kết thúc phản hồi) để chạy lệnh tất định thay vì dựa vào model nhớ thực hiện."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "", "n": "Nhấn mạnh việc giữ quyền kiểm soát của ứng dụng đối với các bước quan trọng trong hệ thống agent."}], "f": "", "ke": ["Hooks provide deterministic application behavior around agent execution. A post-run hook is the right control point when a fixed action must occur after the agent produces the required artifact, rather than relying on the model to remember to perform that step."], "ap": ["D1X#7"]}, "Q061": {"d": 1, "sv": "Một team sản phẩm xây dựng agent Claude để đánh giá các đề xuất tính năng lớn. Việc đánh giá cần các góc nhìn riêng biệt về pháp lý, độ tin cậy (reliability), triển khai kỹ thuật và hỗ trợ khách hàng. Các bản prototype ban đầu đưa toàn bộ tài liệu và suy luận vào một context agent duy nhất, khiến chi tiết không liên quan của góc nhìn này ảnh hưởng đến góc nhìn khác. Thiết kế cải tiến nào tốt nhất?", "se": "A product team is building a Claude agent to assess large feature proposals. The assessment requires separate legal, reliability, implementation, and customer-support perspectives. Early prototypes put all documents and all reasoning into one agent context, causing irrelevant details from one perspective to affect another. Which design is the best improvement?", "oe": ["Use specialized subagents with isolated contexts and aggregate their findings", "Increase the single agent prompt length to include stricter role instructions", "Convert the assessment into a fixed checklist with no model delegation", "Keep one agent but store every prior proposal in long-term memory"], "ov": ["Dùng các subagent chuyên biệt với context tách biệt và tổng hợp kết quả của chúng", "Tăng độ dài prompt của agent duy nhất để thêm hướng dẫn vai trò chặt chẽ hơn", "Chuyển việc đánh giá thành một checklist cố định không có delegation cho model", "Giữ một agent nhưng lưu mọi đề xuất trước đó vào long-term memory"], "on": ["Đúng — mỗi subagent làm việc với context hẹp đúng chuyên môn nên giảm nhiễu chéo giữa các góc nhìn, sau đó aggregator tổng hợp kết quả.", "Sai — prompt dài hơn vẫn để mọi tài liệu chung một context, nên vấn đề nhiễu chéo vẫn còn và context còn phình to hơn.", "Sai — checklist cố định bỏ mất khả năng phân tích chuyên sâu mà mỗi góc nhìn cần; bài toán cần cô lập context chứ không phải bỏ model.", "Sai — đưa thêm đề xuất cũ vào memory chỉ tăng thêm thông tin không liên quan, không tách các góc nhìn ra."], "c": [0], "x": "Câu này kiểm tra khi nào nên dùng subagent: khi tác vụ có các trách nhiệm chuyên biệt và lợi ích lớn đến từ việc cô lập context (context isolation). Mỗi subagent có context window riêng, chỉ chứa tài liệu và hướng dẫn cho đúng góc nhìn của nó, rồi trả về kết quả cô đọng cho agent điều phối (orchestrator/aggregator). Đây là pattern orchestrator-workers và cũng là cách hệ thống multi-agent research của Anthropic giảm nhiễu context.\n\nTriệu chứng trong đề là \"context contamination\": chi tiết pháp lý làm lệch nhận định về reliability và ngược lại. Giải pháp: subagent legal chỉ nhận hợp đồng, chính sách; subagent reliability chỉ nhận SLO, sơ đồ kiến trúc; subagent implementation nhận spec kỹ thuật; subagent support nhận dữ liệu ticket. Mỗi bên trả về một bản tóm tắt có cấu trúc, ví dụ `{\"perspective\": \"legal\", \"risks\": [...], \"verdict\": \"...\"}`, và aggregator kết hợp thành đánh giá cuối cùng.\n\nBẫy: \"tăng độ dài prompt với role instructions chặt hơn\" không giải quyết được vì mọi tài liệu vẫn nằm chung một context. Mẹo nhớ: \"separate perspectives\" + \"irrelevant details affect each other\" thì chọn subagent với context tách biệt.", "k": ["subagent", "context isolation", "orchestrator-workers", "aggregation"], "r": [{"u": "https://www.anthropic.com/engineering/multi-agent-research-system", "t": "How we built our multi-agent research system", "s": "", "n": "Giải thích subagent hoạt động song song với context window riêng, giúp tách biệt mối quan tâm và nén thông tin trước khi trả về agent chính."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Orchestrator-workers", "n": "Mô tả pattern trong đó LLM trung tâm phân chia tác vụ cho các worker rồi tổng hợp kết quả."}, {"u": "https://code.claude.com/docs/en/sub-agents", "t": "Create custom subagents", "s": "", "n": "Subagent trong Claude Code có context window riêng và system prompt chuyên biệt, giúp giữ context chính gọn gàng."}], "f": "", "ke": ["Subagents are useful when a task benefits from specialized responsibilities and context isolation. Separate legal, reliability, implementation, and support subagents can work with narrower context, reducing contamination between perspectives, while a manager or aggregator can combine the outputs into a final assessment."], "ap": ["D1X#8"]}, "Q062": {"d": 1, "sv": "Một team sản phẩm muốn Claude điều tra các khiếu nại khách hàng xảy ra không thường xuyên. Đường điều tra thay đổi theo từng trường hợp: có thể cần xem release notes, truy vấn tóm tắt sự cố, so sánh ticket hỗ trợ và quyết định bằng chứng nào liên quan. Ví dụ: Khiếu nại: \"Mobile checkout fails after coupon entry.\" (Thanh toán trên mobile lỗi sau khi nhập coupon). Nguồn có thể dùng: tìm kiếm ticket, incident tracker, release notes, tóm tắt metrics. Đầu ra yêu cầu: nguyên nhân khả dĩ, link bằng chứng, ghi chú mức độ không chắc chắn. Đường tìm kiếm không biết trước khi bắt đầu. Pattern triển khai nào phù hợp nhất?", "se": "A product team wants Claude to investigate intermittent customer complaints. The path varies by case: it may need to inspect release notes, query incident summaries, compare support tickets, and decide which evidence is relevant. Task sample: Complaint: \"Mobile checkout fails after coupon entry.\" Possible sources: ticket search, incident tracker, release notes, metrics summary. Required output: likely cause, evidence links, uncertainty notes. Search path is not known before the task starts. Which implementation pattern is most appropriate?", "oe": ["A fixed workflow that queries every source in a preset order", "An agent loop with planning, tool actions, observations, and stopping criteria", "A static prompt that asks Claude to infer the cause without tools", "A memory-only assistant that relies on previously stored incidents"], "ov": ["Một workflow cố định truy vấn mọi nguồn theo thứ tự định sẵn", "Một agent loop gồm lập kế hoạch, tool action, observation và tiêu chí dừng", "Một prompt tĩnh yêu cầu Claude suy ra nguyên nhân mà không dùng tool", "Một trợ lý chỉ dựa vào memory, dùng các sự cố đã lưu trước đó"], "on": ["Sai — thứ tự cố định không thích ứng với bằng chứng mới phát hiện và lãng phí khi truy vấn cả những nguồn không liên quan.", "Đúng — bài toán cần lập kế hoạch động, chọn tool theo observation và lặp lại cho đến khi đủ bằng chứng, kèm tiêu chí dừng rõ ràng.", "Sai — không có tool thì Claude không thể truy cập ticket, sự cố hay release notes thực tế, dẫn đến suy đoán thiếu căn cứ.", "Sai — chỉ dựa vào sự cố cũ không phát hiện được nguyên nhân mới và không tạo ra link bằng chứng cho trường hợp hiện tại."], "c": [1], "x": "Đây là câu đối xứng với câu release notes: khi đường đi KHÔNG biết trước, cần chọn tool linh hoạt và lập luận lặp lại dựa trên kết quả, thì agent loop là pattern phù hợp. \"Building effective agents\" định nghĩa agent là hệ thống trong đó LLM tự điều khiển quá trình và việc dùng tool, phù hợp với bài toán mở mà số bước không thể đoán trước.\n\nVới khiếu nại \"Mobile checkout fails after coupon entry\", agent có thể: lập kế hoạch → gọi ticket search tìm các ticket tương tự → thấy chúng bắt đầu từ ngày 12 → tra release notes quanh ngày đó → phát hiện thay đổi trong coupon service → đối chiếu metrics summary → dừng khi đủ bằng chứng và trả về nguyên nhân, link bằng chứng, ghi chú không chắc chắn. Mỗi bước sau phụ thuộc vào observation của bước trước. Một agent loop tốt cần state, quyết định của model, tool action, observation, và tiêu chí dừng hoặc escalate rõ ràng (để tránh lỗi lặp vô hạn như câu Q057).\n\nBẫy: chọn workflow cố định vì \"an toàn hơn\". Workflow truy vấn mọi nguồn theo thứ tự cố định sẽ lãng phí và không thích ứng được. Mẹo: \"search path is not known before the task starts\" là tín hiệu rõ ràng của agent loop.", "k": ["agent loop", "dynamic planning", "tool use", "stopping criteria"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Agents", "n": "Agent phù hợp với bài toán mở khi khó hoặc không thể dự đoán số bước cần thiết, và cần stopping conditions để giữ kiểm soát."}, {"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", "t": "Tool use with Claude", "s": "", "n": "Mô tả cách Claude gọi tool, nhận kết quả và tiếp tục suy luận trong vòng lặp tool use."}], "f": "", "ke": ["An agentic loop fits because the task requires dynamic planning, adaptive tool selection, and iterative reasoning over observations. The loop should include state, model decisions, tool actions, observations, and explicit stopping or escalation criteria."], "ap": ["D1X#9"]}, "Q063": {"d": 1, "sv": "Một startup đang xây dựng agent vận hành đầu tiên dùng Claude. Trích ADR: Cần task state, lập kế hoạch lặp lại, dispatch action và kết thúc vòng lặp. Team có hai backend developer và thời gian hạn chế. Không có ràng buộc hạ tầng đặc biệt. Khả năng bảo trì quan trọng hơn quyền kiểm soát orchestration tùy biến. Lựa chọn triển khai PHÙ HỢP NHẤT là gì?", "se": "A startup is building its first Claude-powered operations agent. ADR excerpt: Needs task state, iterative planning, action dispatch, and loop termination. Team has two backend developers and limited time. No unusual infrastructure constraints. Maintainability is more important than custom orchestration control. What is the MOST appropriate implementation choice?", "oe": ["Use the Claude Agent SDK or a fitting agent framework for common loop concerns.", "Build a fully custom agent harness to maximize low-level orchestration control.", "Avoid an agent loop and implement only a one-shot Claude completion step.", "Use durable memory as the main orchestration mechanism for all actions."], "ov": ["Dùng Claude Agent SDK hoặc một agent framework phù hợp để xử lý các mối quan tâm chung của vòng lặp.", "Tự xây toàn bộ agent harness để tối đa quyền kiểm soát orchestration ở mức thấp.", "Tránh agent loop và chỉ triển khai một bước gọi Claude một lần (one-shot).", "Dùng durable memory làm cơ chế orchestration chính cho mọi action."], "on": ["Đúng — SDK/framework xử lý sẵn state, vòng lặp, dispatch action và kết thúc, phù hợp team nhỏ ưu tiên khả năng bảo trì.", "Sai — custom harness tốn công xây và bảo trì, chỉ đáng khi cần kiểm soát mức thấp tối đa, điều mà ADR nói là không ưu tiên.", "Sai — ADR yêu cầu lập kế hoạch lặp và dispatch action, một lần gọi one-shot không đáp ứng được.", "Sai — memory lưu thông tin bền vững, không phải cơ chế điều phối vòng lặp và dispatch action."], "c": [0], "x": "Câu này kiểm tra quyết định \"build vs buy\" cho hạ tầng agent. Claude Agent SDK cung cấp sẵn agent loop đã được dùng trong Claude Code: quản lý context, gọi tool, xử lý vòng lặp, permission, hook, subagent... Khi nhu cầu là các khả năng agent loop tiêu chuẩn (state, lập kế hoạch lặp, dispatch action, kết thúc vòng lặp) và team ưu tiên khả năng bảo trì, SDK hoặc framework phù hợp giúp giảm boilerplate và rủi ro.\n\nĐọc kỹ ADR: team nhỏ (2 dev), thời gian ít, không có ràng buộc hạ tầng bất thường, và \"maintainability is more important than custom orchestration control\". Mọi tín hiệu đều chỉ về dùng SDK. Ví dụ, thay vì tự viết vòng lặp kiểm tra `stop_reason == \"tool_use\"`, thực thi tool, ghép `tool_result` và giới hạn số turn, team gọi SDK với danh sách tool và cấu hình giới hạn turn, tập trung thời gian vào logic nghiệp vụ.\n\nLưu ý cân bằng: \"Building effective agents\" khuyên hiểu rõ những gì framework làm bên dưới và có thể bắt đầu bằng gọi API trực tiếp; custom harness hợp lý khi cần kiểm soát tối đa hoặc có ràng buộc đặc biệt. Nhưng đề này đã loại các điều kiện đó. Bẫy: chọn one-shot vì \"đơn giản\" trong khi ADR yêu cầu rõ iterative planning.", "k": ["Claude Agent SDK", "agent framework", "agent harness", "maintainability"], "r": [{"u": "https://code.claude.com/docs/en/agent-sdk/overview", "t": "Agent SDK overview", "s": "", "n": "Giới thiệu Claude Agent SDK cung cấp agent loop, tool, quản lý context và các thành phần đã dùng trong Claude Code để xây agent nhanh."}, {"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "When and how to use frameworks", "n": "Thảo luận lợi ích và đánh đổi của framework, khuyên hiểu rõ những gì framework làm bên dưới."}], "f": "", "ke": ["When a team needs standard agent-loop capabilities and prioritizes maintainability over low-level control, an SDK or agent framework can reduce boilerplate for state, orchestration, and action dispatch. A custom harness is better reserved for cases requiring maximum control."], "ap": ["D1X#10"]}, "Q064": {"d": 5, "sv": "Phát biểu nào về các tier model của Claude nhìn chung là đúng?", "se": "Which statement about the Claude model tiers is generally true?", "oe": ["All tiers cost the same", "Larger models are always faster", "Smaller models are faster and cheaper; larger models handle more complex tasks", "Smaller models have no token limits"], "ov": ["Mọi tier có giá như nhau", "Model lớn hơn luôn nhanh hơn", "Model nhỏ hơn nhanh hơn và rẻ hơn; model lớn hơn xử lý được tác vụ phức tạp hơn", "Model nhỏ hơn không có giới hạn token"], "on": ["Sai — giá theo token khác nhau đáng kể giữa các tier; tier lớn như Opus đắt hơn Haiku nhiều lần.", "Sai — model lớn thường chậm hơn do tính toán nhiều hơn; từ \"always\" là dấu hiệu phương án sai.", "Đúng — đây là đánh đổi cơ bản: tier nhỏ tối ưu tốc độ và chi phí, tier lớn tối ưu năng lực cho tác vụ phức tạp.", "Sai — mọi model đều có giới hạn context window và giới hạn số token đầu ra."], "c": [2], "x": "Nguyên tắc cốt lõi: chọn model là bài toán đánh đổi giữa ba yếu tố năng lực (capability), tốc độ (latency) và chi phí (cost). Các dòng Claude được chia tier: Haiku là tier nhỏ, nhanh và rẻ nhất; Sonnet cân bằng giữa năng lực và chi phí; Opus là tier mạnh nhất cho suy luận phức tạp, coding khó, agent dài hạn, nhưng giá theo token cao hơn và thường chậm hơn.\n\nVí dụ thực tế: phân loại hàng nghìn ticket hỗ trợ thành 5 nhóm thì Haiku thường đủ tốt, phản hồi nhanh và tiết kiệm; còn phân tích kiến trúc hệ thống lớn hay refactor nhiều file thì Sonnet/Opus đáng đồng tiền hơn. Tài liệu \"Choosing a model\" gợi ý bắt đầu bằng model phù hợp với độ phức tạp tác vụ, đo bằng eval, rồi điều chỉnh lên hoặc xuống tier.\n\nBẫy thường gặp: các phương án chứa từ tuyệt đối như \"always\", \"no limits\", \"same cost\" gần như luôn sai. Model nào cũng có context window và giới hạn `max_tokens` đầu ra; giá khác nhau rõ rệt giữa các tier (xem trang pricing). Mẹo nhớ: \"nhỏ = nhanh + rẻ, lớn = thông minh + đắt\", và luôn chọn bằng dữ liệu eval chứ không theo cảm tính.", "k": ["model tiers", "Haiku", "Sonnet", "Opus", "cost/latency trade-off"], "r": [{"u": "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model", "t": "Choosing the right model", "s": "", "n": "Hướng dẫn cân nhắc năng lực, tốc độ và chi phí khi chọn model, kèm gợi ý tier cho từng loại tác vụ."}, {"u": "https://platform.claude.com/docs/en/models/overview", "t": "Models overview", "s": "", "n": "Bảng so sánh các model về năng lực, độ trễ tương đối, context window và giá."}, {"u": "https://platform.claude.com/docs/en/about-claude/pricing", "t": "Pricing", "s": "", "n": "Liệt kê giá input/output theo từng model, cho thấy chênh lệch chi phí giữa các tier."}], "f": "", "ke": ["Model choice is a trade-off between capability, speed and cost."], "ap": ["M1#2"]}, "Q065": {"d": 6, "sv": "Bạn đưa ba tài liệu nguồn cho Claude. Bạn nên cấu trúc chúng như thế nào?", "se": "You pass three source documents to Claude. How should you structure them?", "oe": ["Wrap each in its own <document> tag with its source and content in subtags", "Merge them into one block with no separators", "Put them in three separate API requests", "Put them after the question, unlabelled"], "ov": ["Bọc mỗi tài liệu trong một thẻ <document> riêng, với nguồn và nội dung đặt trong các thẻ con", "Gộp chúng thành một khối không có dấu phân cách", "Đưa chúng vào ba API request riêng biệt", "Đặt chúng sau câu hỏi, không gán nhãn"], "on": ["Đúng — thẻ `<document>` riêng kèm source và content giúp Claude tách bạch các tài liệu và trích dẫn chính xác nguồn.", "Sai — gộp không phân cách khiến Claude khó biết thông tin nào thuộc tài liệu nào, dễ trộn lẫn và trích dẫn sai.", "Sai — tách ba request làm mất khả năng đối chiếu, tổng hợp thông tin giữa các tài liệu trong cùng một lần suy luận.", "Sai — không gán nhãn làm mất ranh giới tài liệu, và khuyến nghị là đặt tài liệu dài trước, câu hỏi ở cuối."], "c": [0], "x": "Câu này kiểm tra kỹ thuật XML tags và long context prompting. Tài liệu \"Long context tips\" của Anthropic khuyên: khi có nhiều tài liệu, bọc mỗi tài liệu trong thẻ `<document>` với các thẻ con `<source>` và `<document_content>` (hoặc metadata khác như ngày), đồng thời đặt tài liệu dài ở đầu prompt, câu hỏi ở cuối.\n\nVí dụ cấu trúc: `<documents><document index=\"1\"><source>bao_cao_q1.pdf<\/source><document_content>...<\/document_content><\/document><document index=\"2\">...<\/document><\/documents>` rồi mới đến câu hỏi. Nhờ thẻ rõ ràng, Claude phân biệt được ranh giới từng tài liệu, không trộn lẫn dữ kiện, và có thể trích dẫn chính xác \"theo tài liệu 2 (bao_cao_q2.pdf)...\". Thẻ XML cũng giúp bạn dễ chỉnh sửa prompt và dễ parse đầu ra.\n\nBẫy: \"đặt tài liệu sau câu hỏi\" ngược với khuyến nghị (đặt câu hỏi ở cuối có thể cải thiện chất lượng đáng kể với input dài). \"Ba request riêng\" làm Claude mất khả năng so sánh, tổng hợp giữa các tài liệu. Mẹo nhớ: nhiều tài liệu → mỗi cái một thẻ `<document>` có metadata, tài liệu ở trên, câu hỏi ở dưới.", "k": ["XML tags", "long context", "document structuring", "metadata"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#long-context-prompting", "t": "Prompting best practices — Long context prompting", "s": "Structure document content and metadata with XML tags", "n": "Khuyên bọc mỗi tài liệu trong thẻ `<document>` với `<source>` và `<document_content>`, và đặt tài liệu dài ở đầu prompt."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#structure-prompts-with-xml-tags", "t": "Prompting best practices — Structure prompts with XML tags", "s": "", "n": "Giải thích lợi ích của XML tags: rõ ràng, chính xác, linh hoạt và dễ parse."}], "f": "", "ke": ["Tagging each document with its content and metadata helps Claude keep them apart and refer to them accurately."], "ap": ["M1#3", "PD#33"]}, "Q066": {"d": 1, "sv": "Trong một prompt chain, mục đích của một gate (cổng kiểm tra) giữa hai bước là gì?", "se": "In a prompt chain, what is the purpose of a gate between two steps?", "oe": ["To make the chain run in parallel", "To check programmatically that the intermediate output is acceptable before the chain continues", "To encrypt the output", "To switch models at random"], "ov": ["Để chain chạy song song", "Để kiểm tra bằng code rằng kết quả trung gian chấp nhận được trước khi chain tiếp tục", "Để mã hóa đầu ra", "Để chuyển đổi model một cách ngẫu nhiên"], "on": ["Sai — prompt chaining vốn là tuần tự; chạy song song thuộc pattern parallelization, không phải chức năng của gate.", "Đúng — gate là kiểm tra bằng code trên kết quả trung gian, chỉ cho chain đi tiếp khi kết quả đạt yêu cầu.", "Sai — gate không liên quan đến mã hóa; nó là cơ chế kiểm soát chất lượng giữa các bước.", "Sai — gate không chọn model ngẫu nhiên; việc chọn model theo loại đầu vào là của routing và không ngẫu nhiên."], "c": [1], "x": "Prompt chaining là workflow chia tác vụ thành chuỗi bước, mỗi lần gọi LLM xử lý đầu ra của bước trước. \"Building effective agents\" mô tả rằng bạn có thể thêm các programmatic check (gọi là gate) ở bất kỳ bước trung gian nào để đảm bảo quá trình vẫn đi đúng hướng.\n\nVí dụ: chain viết tài liệu marketing gồm Bước 1 tạo dàn ý, Bước 2 viết bài theo dàn ý. Gate giữa hai bước là đoạn code kiểm tra dàn ý có đủ 5 mục bắt buộc, độ dài không quá 300 từ, và là JSON hợp lệ dạng `{\"sections\": [...]}`. Nếu không đạt thì dừng, retry bước 1 hoặc báo lỗi, thay vì để bước 2 xây trên nền móng hỏng. Gate giúp phát hiện lỗi sớm, tránh lỗi lan truyền qua các bước và giúp debug dễ hơn vì biết chính xác bước nào thất bại.\n\nBẫy: nhầm prompt chaining với parallelization. Chain là tuần tự; chạy song song là pattern khác (sectioning/voting). Mẹo nhớ: \"gate = trạm kiểm soát chất lượng giữa dây chuyền\", luôn là kiểm tra trung gian, thường bằng code, trước khi cho đi tiếp.", "k": ["prompt chaining", "gate", "programmatic check", "workflow"], "r": [{"u": "https://www.anthropic.com/engineering/building-effective-agents", "t": "Building effective agents", "s": "Workflow: Prompt chaining", "n": "Mô tả prompt chaining và việc thêm programmatic check (gate) ở các bước trung gian để giữ quá trình đúng hướng."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#chain-complex-prompts", "t": "Prompting best practices — Chain complex prompts", "s": "", "n": "Hướng dẫn chia tác vụ phức tạp thành các prompt nối tiếp và kiểm tra đầu ra từng bước."}], "f": "", "ke": ["A gate is a programmatic check on an intermediate result that keeps the process on track."], "ap": ["M1#6", "PD#13"]}, "Q067": {"d": 5, "sv": "Bạn thêm `cache_control` vào một system prompt dài 200 token, nhưng không có gì được cache. Vì sao?", "se": "You add cache_control to a 200-token system prompt, but nothing is ever cached. Why?", "oe": ["Caching needs the Batch API", "The prefix is shorter than the minimum cacheable length", "Caching only works on images", "The API key lacks permission"], "ov": ["Caching cần dùng Batch API", "Prefix ngắn hơn độ dài tối thiểu có thể cache (minimum cacheable length)", "Caching chỉ hoạt động với hình ảnh", "API key thiếu quyền"], "on": ["Sai — prompt caching hoạt động với Messages API thông thường; Batch API là tính năng riêng, có thể kết hợp nhưng không bắt buộc.", "Đúng — 200 token thấp hơn ngưỡng tối thiểu của mọi model, nên request được xử lý bình thường mà không cache và không báo lỗi.", "Sai — caching áp dụng cho text, system prompt, tool definitions, hình ảnh, tài liệu...; không chỉ riêng hình ảnh.", "Sai — vấn đề quyền sẽ trả về lỗi rõ ràng; ở đây request thành công nhưng không cache, đúng hành vi khi prefix quá ngắn."], "c": [1], "x": "Prompt caching chỉ áp dụng khi phần prefix tính đến cache breakpoint đạt độ dài tối thiểu, và mức tối thiểu này phụ thuộc từng model. Theo tài liệu hiện hành, mức thấp nhất là 512 token (các model đời mới), các model khác là 1.024, 2.048 hoặc 4.096 token (ví dụ Claude Haiku 4.5, Opus 4.5). 200 token nhỏ hơn mọi ngưỡng nên không bao giờ được cache.\n\nĐiểm then chốt để đi thi: khi prefix quá ngắn, API KHÔNG báo lỗi. Request vẫn được xử lý bình thường, chỉ là không cache. Cách nhận biết là xem trường `usage` trong response: nếu `cache_creation_input_tokens` và `cache_read_input_tokens` đều bằng `0` thì không có gì được ghi hay đọc từ cache. Ví dụ: `\"usage\": {\"input_tokens\": 215, \"cache_creation_input_tokens\": 0, \"cache_read_input_tokens\": 0}`.\n\nCách khắc phục: đặt breakpoint sau một khối lớn hơn, ví dụ gộp system prompt với định nghĩa tool, tài liệu tham chiếu hoặc few-shot examples cho đủ ngưỡng. Bẫy: nghĩ caching cần Batch API (thực tế hai tính năng dùng độc lập và có thể kết hợp), hoặc nghĩ do quyền API key (lỗi quyền sẽ trả về lỗi rõ ràng như `permission_error`, không \"im lặng\").", "k": ["prompt caching", "cache_control", "minimum cacheable length", "cache breakpoint", "usage fields"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "t": "Prompt caching", "s": "Cache limitations", "n": "Liệt kê độ dài tối thiểu có thể cache theo từng model và nêu rõ request ngắn hơn được xử lý không cache, không trả lỗi."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "t": "Prompt caching", "s": "Tracking cache performance", "n": "Hướng dẫn dùng `cache_creation_input_tokens` và `cache_read_input_tokens` để kiểm tra cache có hoạt động."}], "f": "Ngưỡng tối thiểu tùy model theo tài liệu hiện hành: 512 token (model đời mới như Opus 5/5.5, Sonnet 5.5, Haiku 5.5), 1.024 (Sonnet 4.5/4.6, Sonnet 5, Opus 4.8...), 2.048 (Opus 4.7...), 4.096 (Opus 4.5/4.6, Haiku 4.5). Tài liệu cũ hay ghi 1.024/2.048; 200 token vẫn dưới mọi ngưỡng nên đáp án không đổi.", "ke": ["Each model has a minimum cacheable prompt length. Shorter prefixes are processed normally, without an error."], "ap": ["M1#9", "PD#35"]}, "Q068": {"d": 2, "sv": "Người dùng cần kiểm chứng từng nhận định Claude đưa ra về một tài liệu đã tải lên. Tính năng nào giúp ích nhiều nhất?", "se": "Users need to verify each claim Claude makes about an uploaded document. Which feature helps most?", "oe": ["Streaming", "A higher temperature", "A larger max_tokens", "Citations enabled on the document, which link answers to exact passages"], "ov": ["Streaming", "Tăng temperature", "Tăng `max_tokens`", "Bật citations trên tài liệu, giúp liên kết câu trả lời với đúng đoạn văn nguồn"], "on": ["Sai — streaming chỉ gửi kết quả từng phần để giảm độ trễ cảm nhận, không cung cấp thông tin nguồn để kiểm chứng.", "Sai — temperature cao làm đầu ra đa dạng, ngẫu nhiên hơn, không giúp kiểm chứng mà còn có thể giảm độ chính xác.", "Sai — `max_tokens` chỉ giới hạn độ dài đầu ra, không liên kết nhận định với nguồn.", "Đúng — citations trả về vị trí và đoạn trích nguyên văn của nguồn cho từng nhận định, giúp người dùng kiểm chứng trực tiếp."], "c": [3], "x": "Tính năng Citations của Claude API cho phép model trích dẫn chính xác đoạn văn trong tài liệu nguồn hỗ trợ cho từng nhận định. Bạn bật bằng cách thêm `\"citations\": {\"enabled\": true}` vào content block loại `document` (PDF, plain text hoặc custom content). Khi đó response sẽ chia thành các text block, mỗi block có mảng `citations` chỉ ra vị trí nguồn: với plain text là `char_location` (chỉ số ký tự), với PDF là `page_location` (số trang), kèm `cited_text` là đoạn trích nguyên văn.\n\nVí dụ: Claude trả lời \"Doanh thu Q2 tăng 15%\" và block này kèm citation trỏ đến trang 4, `cited_text`: \"Revenue grew 15% quarter-over-quarter\". Người dùng có thể bấm vào để đối chiếu ngay. Điều này rất quan trọng trong các lĩnh vực pháp lý, tài chính, y tế nơi cần khả năng kiểm chứng; nó cũng giúp giảm hallucination vì câu trả lời được neo vào nguồn. Lưu ý `cited_text` không tính vào output token.\n\nBẫy: streaming chỉ thay đổi cách nhận dữ liệu (từng phần), temperature làm tăng tính ngẫu nhiên (ngược với nhu cầu kiểm chứng), `max_tokens` chỉ giới hạn độ dài. Mẹo: \"verify each claim\" + \"document\" → citations.", "k": ["citations", "document content block", "cited_text", "grounding"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/citations", "t": "Citations", "s": "", "n": "Mô tả cách bật citations trên document và cấu trúc response với `char_location`, `page_location` và `cited_text`."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations", "t": "Reduce hallucinations", "s": "", "n": "Khuyến nghị yêu cầu trích dẫn nguồn để xác minh nhận định và giảm hallucination."}], "f": "", "ke": ["With citations enabled, the response points to the specific passages of the source that support each statement."], "ap": ["M1#10", "PD#36"]}, "Q069": {"d": 2, "sv": "HAI lỗi nào nhìn chung đáng được tự động retry với backoff?", "se": "Which TWO errors are generally worth retrying automatically with backoff?", "oe": ["429 rate_limit_error", "404 not_found_error", "401 authentication_error", "400 invalid_request_error", "529 overloaded_error"], "ov": ["429 `rate_limit_error`", "404 `not_found_error`", "401 `authentication_error`", "400 `invalid_request_error`", "529 `overloaded_error`"], "on": ["Đúng — vượt rate limit là tạm thời; chờ theo `retry-after` hoặc backoff rồi thử lại thường sẽ thành công.", "Sai — resource hoặc endpoint không tồn tại sẽ vẫn không tồn tại khi retry; cần sửa đường dẫn hoặc ID.", "Sai — API key sai hoặc thiếu sẽ thất bại mãi cho đến khi sửa credential.", "Sai — request sai định dạng hoặc tham số sẽ bị từ chối lại y hệt; cần sửa request trước.", "Đúng — API quá tải tạm thời; retry với exponential backoff và jitter là cách xử lý chuẩn."], "c": [0, 4], "x": "Nguyên tắc cốt lõi: chỉ retry các lỗi tạm thời (transient), tức lỗi có khả năng tự hết nếu thử lại sau một lúc. Hai lỗi đúng là 429 `rate_limit_error` (bạn vượt rate limit của tổ chức; response thường kèm header `retry-after` cho biết nên chờ bao lâu) và 529 `overloaded_error` (API đang quá tải tạm thời do lưu lượng cao trên toàn hệ thống). Cả hai đều có thể thành công nếu chờ và thử lại.\n\nCách retry đúng là exponential backoff có jitter: chờ 1s, 2s, 4s, 8s... cộng thêm một khoảng ngẫu nhiên để tránh nhiều client cùng retry một lúc (thundering herd), tôn trọng `retry-after` nếu có, và đặt số lần retry tối đa. Các SDK chính thức của Anthropic mặc định đã tự retry một số lỗi (như 429, 5xx, lỗi kết nối) 2 lần với backoff, có thể chỉnh bằng `max_retries`.\n\nCác lỗi còn lại là lỗi phía client, sẽ thất bại mãi cho đến khi bạn sửa: 400 do request sai định dạng/tham số, 401 do API key sai hoặc thiếu, 404 do resource/model không tồn tại. Retry chúng chỉ lãng phí và có thể làm bạn chạm rate limit. Mẹo nhớ: 429 và 5xx (500, 529) thì retry; 4xx khác thì sửa request.", "k": ["rate_limit_error", "overloaded_error", "exponential backoff", "jitter", "retry-after"], "r": [{"u": "https://platform.claude.com/docs/en/api/errors", "t": "Claude API errors", "s": "HTTP errors", "n": "Liệt kê các mã lỗi 400, 401, 403, 404, 413, 429, 500, 529 và ý nghĩa từng loại."}, {"u": "https://platform.claude.com/docs/en/api/rate-limits", "t": "Rate limits", "s": "", "n": "Giải thích lỗi 429 khi vượt rate limit và header `retry-after` cho biết thời gian chờ."}, {"u": "https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter", "t": "Timeouts, retries, and backoff with jitter", "s": "", "n": "Giải thích vì sao nên kết hợp exponential backoff với jitter khi retry để tránh dồn tải."}], "f": "", "ke": ["Rate limit and overload errors are transient. 400, 401 and 404 will fail again until the request or credential is fixed."], "ap": ["M1#13"]}, "Q070": {"d": 2, "sv": "Stop reason nào cho biết model đang chờ bạn chạy một hàm và trả về kết quả của nó?", "se": "Which stop reason tells you the model is waiting for you to run a function and return its output?", "oe": ["end_turn", "max_tokens", "tool_use", "stop_sequence"], "ov": ["`end_turn`", "`max_tokens`", "`tool_use`", "`stop_sequence`"], "on": ["Sai — `end_turn` nghĩa là model đã hoàn thành câu trả lời một cách tự nhiên, không chờ kết quả tool nào.", "Sai — `max_tokens` nghĩa là đầu ra bị cắt do chạm giới hạn token, không liên quan đến gọi hàm.", "Đúng — `tool_use` báo response có lời gọi tool mà ứng dụng phải thực thi rồi trả `tool_result` về.", "Sai — `stop_sequence` nghĩa là model đã sinh ra một chuỗi dừng tùy chỉnh mà bạn cung cấp."], "c": [2], "x": "Trường `stop_reason` trong response của Messages API cho biết vì sao model dừng sinh. Khi giá trị là `\"tool_use\"`, response chứa một hoặc nhiều content block loại `tool_use` (mỗi block có `id`, `name`, `input`), và code của bạn phải thực thi tool đó rồi gửi kết quả lại trong message `user` tiếp theo dưới dạng block `tool_result` có `tool_use_id` khớp với `id` của lời gọi.\n\nVí dụ: model trả về `{\"type\": \"tool_use\", \"id\": \"toolu_01A\", \"name\": \"get_weather\", \"input\": {\"city\": \"Hanoi\"}}` với `stop_reason: \"tool_use\"`. Ứng dụng gọi API thời tiết, rồi gửi `{\"type\": \"tool_result\", \"tool_use_id\": \"toolu_01A\", \"content\": \"28°C, có mây\"}`. Đây chính là nhịp cơ bản của agent loop: lặp chừng nào `stop_reason` còn là `tool_use`, dừng khi thành `end_turn`.\n\nPhân biệt các giá trị khác: `end_turn` là model hoàn thành tự nhiên; `max_tokens` là chạm giới hạn token đầu ra bạn đặt (câu trả lời có thể bị cắt); `stop_sequence` là model sinh ra một chuỗi trong `stop_sequences` bạn cung cấp. Ngoài ra còn có `pause_turn` (server tool chạy lâu, cần gửi lại để tiếp tục) và `refusal`. Bẫy: nhầm `end_turn` với \"đang chờ\"; thực ra `end_turn` nghĩa là xong lượt.", "k": ["stop_reason", "tool_use", "tool_result", "agent loop"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons", "t": "Stop reasons and fallback", "s": "", "n": "Giải thích từng giá trị `stop_reason` (`end_turn`, `max_tokens`, `stop_sequence`, `tool_use`, `pause_turn`, `refusal`) và cách xử lý."}, {"u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools", "t": "Define tools", "s": "", "n": "Hướng dẫn thực thi tool khi nhận `tool_use` và trả kết quả bằng block `tool_result` với `tool_use_id` khớp."}], "f": "", "ke": ["tool_use means the response contains one or more tool calls that your code must execute."], "ap": ["M1#14"]}, "Q071": {"d": 2, "sv": "Sau khi tạo một message batch, làm sao bạn biết khi nào kết quả đã sẵn sàng?", "se": "After you create a message batch, how do you know when the results are ready?", "oe": ["Results are emailed to the account owner", "Wait exactly one minute", "Poll the batch until its processing_status is ended", "The create call blocks until every request is done"], "ov": ["Kết quả được gửi email cho chủ tài khoản", "Chờ đúng một phút", "Poll batch cho đến khi `processing_status` là `ended`", "Lệnh tạo batch sẽ block cho đến khi mọi request hoàn tất"], "on": ["Sai — API không gửi email kết quả; ứng dụng phải chủ động truy vấn trạng thái batch.", "Sai — thời gian xử lý thay đổi, thường dưới 1 giờ nhưng có thể đến 24 giờ; chờ cố định một phút là không đáng tin cậy.", "Đúng — batch xử lý bất đồng bộ nên phải poll đến khi `processing_status` là `ended`, rồi tải kết quả qua `results_url`.", "Sai — lệnh tạo batch trả về ngay với trạng thái `in_progress`, không block chờ toàn bộ request hoàn tất."], "c": [2], "x": "Message Batches API là cơ chế xử lý bất đồng bộ (asynchronous): bạn gửi nhiều request trong một batch, nhận về ngay một đối tượng batch có `id` và `processing_status: \"in_progress\"`, rồi hệ thống xử lý dần trong nền. Đổi lại việc không có kết quả tức thì, batch được giảm 50% chi phí so với gọi thường, rất hợp cho các tác vụ không gấp như eval hàng loạt, phân loại dữ liệu lớn.\n\nĐể biết khi nào xong, bạn poll (truy vấn định kỳ) endpoint retrieve batch, ví dụ `client.messages.batches.retrieve(batch_id)` mỗi 60 giây, cho đến khi `processing_status` là `\"ended\"`. Lúc đó đối tượng batch có `results_url` và `request_counts` (succeeded, errored, canceled, expired). Bạn tải kết quả dạng JSONL; mỗi dòng có `custom_id` bạn đặt khi tạo để ghép kết quả với request gốc, vì thứ tự kết quả không đảm bảo trùng thứ tự request.\n\nBẫy: nghĩ lệnh tạo sẽ block chờ (không, nó trả về ngay), hoặc chờ một khoảng cố định. Phần lớn batch xong trong vòng 1 giờ nhưng có thể mất đến 24 giờ; request chưa xử lý xong sau 24 giờ sẽ hết hạn (`expired`). Mẹo nhớ: batch = async + poll `processing_status` + ghép theo `custom_id`.", "k": ["Message Batches API", "processing_status", "polling", "custom_id", "results_url"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/batch-processing", "t": "Batch processing", "s": "", "n": "Mô tả vòng đời batch, việc poll `processing_status` đến `ended`, tải kết quả JSONL và dùng `custom_id` để ghép kết quả."}, {"u": "https://platform.claude.com/docs/en/about-claude/pricing", "t": "Pricing", "s": "", "n": "Ghi nhận mức giảm giá 50% cho Batch API so với gọi thường."}], "f": "", "ke": ["Batches are asynchronous. You retrieve the batch until processing has ended, then fetch the results."], "ap": ["M2#7", "PD#52"]}, "Q072": {"d": 2, "sv": "Một response kết thúc với `stop_reason: \"stop_sequence\"`. Điều gì đã xảy ra?", "se": "A response ends with stop_reason: \"stop_sequence\". What happened?", "oe": ["The model ran out of output tokens", "The model requested a tool", "The request was refused", "The model generated one of the custom stop sequences you supplied"], "ov": ["Model hết token đầu ra", "Model yêu cầu dùng một tool", "Request bị từ chối", "Model đã sinh ra một trong các stop sequence tùy chỉnh mà bạn cung cấp"], "on": ["Sai — hết token đầu ra sẽ cho `stop_reason` là `max_tokens`, không phải `stop_sequence`.", "Sai — khi model yêu cầu tool, `stop_reason` là `tool_use`.", "Sai — từ chối được báo bằng `stop_reason` là `refusal`, không liên quan đến stop sequence.", "Đúng — `stop_sequence` nghĩa là đầu ra khớp một chuỗi trong tham số `stop_sequences`; trường `stop_sequence` cho biết chuỗi nào."], "c": [3], "x": "Tham số `stop_sequences` trong Messages API cho phép bạn cung cấp danh sách chuỗi tùy chỉnh; khi model sinh ra một trong các chuỗi đó, quá trình sinh dừng lại ngay. Lúc này response có `stop_reason: \"stop_sequence\"` và trường `stop_sequence` cho biết chính xác chuỗi nào đã khớp. Bản thân chuỗi dừng không được đưa vào nội dung trả về.\n\nVí dụ: bạn yêu cầu Claude viết một đoạn mô tả sản phẩm trong thẻ XML và đặt `\"stop_sequences\": [\"<\/description>\"]`. Khi model viết đến `<\/description>`, nó dừng; response có `\"stop_reason\": \"stop_sequence\", \"stop_sequence\": \"<\/description>\"`. Kỹ thuật này hữu ích để cắt đầu ra đúng chỗ, tiết kiệm token và tránh model viết thêm phần không cần thiết.\n\nPhân biệt các stop reason dễ nhầm: hết token đầu ra là `max_tokens`; yêu cầu tool là `tool_use`; model từ chối vì lý do an toàn là `refusal`; hoàn thành tự nhiên là `end_turn`. Bẫy: nghĩ \"stop\" nghĩa là bị dừng do lỗi hay bị chặn. Mẹo nhớ: tên stop reason khớp với tên tham số `stop_sequences` mà bạn tự cung cấp.", "k": ["stop_reason", "stop_sequences", "stop_sequence"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons", "t": "Stop reasons and fallback", "s": "", "n": "Giải thích ý nghĩa `stop_sequence` cùng các stop reason khác và cách xử lý từng trường hợp."}, {"u": "https://platform.claude.com/docs/en/api/messages", "t": "Messages - Claude API Reference", "s": "", "n": "Định nghĩa tham số `stop_sequences` và trường `stop_sequence` trong response."}], "f": "", "ke": ["stop_sequence means generation stopped because the output matched an entry in your stop_sequences parameter."], "ap": ["M2#15", "PD#43"]}, "Q073": {"d": 2, "sv": "Làm thế nào để đưa một ảnh chụp màn hình vào request Messages API?", "se": "How do you include a screenshot in a Messages API request?", "oe": ["Images are not supported", "As an HTTP header", "As an image content block with a base64 or URL source", "As a file path written in the text"], "ov": ["Hình ảnh không được hỗ trợ", "Dưới dạng một HTTP header", "Dưới dạng một image content block với source là base64 hoặc URL", "Dưới dạng đường dẫn file viết trong text"], "on": ["Sai — Claude hỗ trợ vision, có thể phân tích ảnh chụp màn hình, biểu đồ và ảnh tài liệu.", "Sai — header HTTP dùng cho xác thực và metadata như `x-api-key`, `anthropic-version`, không dùng để truyền ảnh.", "Đúng — ảnh được gửi trong content block `image` với source `base64` hoặc `url` (hoặc `file` qua Files API), cạnh các block text.", "Sai — API không truy cập được file trên máy bạn; đường dẫn trong text chỉ là chuỗi ký tự, không phải dữ liệu ảnh."], "c": [2], "x": "Claude có khả năng vision: đọc hiểu hình ảnh như ảnh chụp màn hình, biểu đồ, tài liệu scan. Trong Messages API, hình ảnh được gửi dưới dạng content block loại `image` nằm trong mảng `content` của message `user`, đặt cạnh các block `text`. Source có thể là `base64` (kèm `media_type` như `image/png`, `image/jpeg`, `image/gif`, `image/webp`), `url` (link ảnh công khai), hoặc `file` (tham chiếu `file_id` từ Files API).\n\nVí dụ: `{\"role\": \"user\", \"content\": [{\"type\": \"image\", \"source\": {\"type\": \"base64\", \"media_type\": \"image/png\", \"data\": \"iVBORw0...\"}}, {\"type\": \"text\", \"text\": \"Lỗi gì đang hiển thị trên màn hình này?\"}]}`. Tài liệu khuyên đặt hình ảnh trước câu hỏi để có kết quả tốt hơn, và lưu ý giới hạn kích thước/số lượng ảnh mỗi request; ảnh quá lớn sẽ bị thu nhỏ, làm tăng độ trễ mà không cải thiện chất lượng.\n\nBẫy: \"viết đường dẫn file trong text\" sai vì API chạy trên server Anthropic, không thể đọc file trên máy bạn; Claude chỉ thấy chuỗi ký tự đường dẫn. Header HTTP dùng cho xác thực và metadata (`x-api-key`, `anthropic-version`), không chứa dữ liệu ảnh. Mẹo nhớ: mọi dữ liệu đa phương thức (ảnh, PDF) đều đi qua content block.", "k": ["vision", "image content block", "base64", "media_type", "content blocks"], "r": [{"u": "https://platform.claude.com/docs/en/build-with-claude/vision", "t": "Vision", "s": "", "n": "Hướng dẫn gửi ảnh qua content block `image` với source base64, URL hoặc file, kèm giới hạn kích thước và mẹo đặt ảnh trước text."}, {"u": "https://platform.claude.com/docs/en/build-with-claude/files", "t": "Files API", "s": "", "n": "Cho phép upload ảnh một lần rồi tham chiếu bằng `file_id` trong các request sau."}], "f": "", "ke": ["Images are sent as image content blocks alongside text blocks in the user message."], "ap": ["M2#18", "PD#24"]}, "Q074": {"d": 2, "sv": "Team của bạn đã thay đổi system prompt và một tool schema của ứng dụng Claude dùng để hoàn tiền (refund) cho khách hàng. Phiên bản mới vượt qua mọi test trong môi trường phát triển, và product owner muốn chuyển toàn bộ traffic production sang phiên bản này ngay hôm nay. Một thay đổi lỗi sẽ khiến khách hàng thật nhận tiền hoàn sai. Bước tiếp theo tốt nhất cho bản release này là gì?", "se": "Your team changed the system prompt and one tool schema of a Claude application that issues customer refunds. The new version passed every development test, and the product owner wants to switch all production traffic to it today. A faulty change would send wrong refunds to real customers. What is the best next step for this release?", "oe": ["Switch all traffic to the new version today, since it passed every one of the development tests.", "Switch all traffic, then watch token usage and API error rates on a daily dashboard.", "Edit the live prompt in place so that any problem can be fixed without a new deployment.", "Send a small share of traffic to the new version, check its refunds, and keep rollback ready."], "ov": ["Chuyển toàn bộ traffic ngay hôm nay, vì phiên bản đã vượt qua mọi test phát triển.", "Chuyển toàn bộ traffic, sau đó theo dõi lượng token và tỷ lệ lỗi API trên dashboard hằng ngày.", "Sửa trực tiếp prompt đang chạy để có thể khắc phục mọi vấn đề mà không cần deploy mới.", "Chuyển một phần nhỏ traffic sang phiên bản mới, kiểm tra các khoản hoàn tiền của nó và sẵn sàng rollback."], "on": ["Sai — test phát triển không bao phủ hết dữ liệu production; chuyển toàn bộ traffic ngay sẽ để mọi khách hàng chịu rủi ro nếu có lỗi.", "Sai — vẫn chuyển toàn bộ traffic cùng lúc, và token hay lỗi API không phát hiện được việc hoàn sai số tiền.", "Sai — sửa prompt trực tiếp trên production bỏ qua test, version và rollback, làm tăng rủi ro thay vì giảm.", "Đúng — canary giới hạn số khoản hoàn bị ảnh hưởng, theo dõi đúng kết quả refund và có rollback sẵn sàng nếu phát hiện bất thường."], "c": [3], "x": "Câu này kiểm tra quy trình release an toàn cho ứng dụng LLM: thay đổi system prompt hay tool schema cũng là thay đổi code, có thể làm thay đổi hành vi theo cách test phát triển không bắt được, vì dữ liệu production đa dạng hơn nhiều. Khi hậu quả là tiền thật (hoàn tiền sai), cần triển khai dần dần (canary/staged rollout), giám sát kết quả nghiệp vụ, và có sẵn đường lui (rollback).\n\nCách làm cụ thể: định tuyến 5% traffic sang phiên bản mới, so sánh các chỉ số nghiệp vụ như số tiền hoàn trung bình, tỷ lệ hoàn bị từ chối, số trường hợp vượt ngưỡng cần duyệt tay giữa hai phiên bản; nếu ổn định thì tăng lên 25%, 50%, 100%; nếu bất thường thì rollback ngay về phiên bản cũ (prompt và schema được version hóa). Canary giới hạn số khách hàng bị ảnh hưởng nếu có lỗi và cung cấp bằng chứng để quyết định promote hay rollback.\n\nBẫy: phương án 2 có giám sát nhưng sai ở hai điểm: chuyển toàn bộ traffic ngay và theo dõi chỉ số kỹ thuật (token, lỗi API) chứ không theo dõi kết quả refund. Một prompt sai vẫn trả về HTTP 200 nhưng hoàn sai tiền. Mẹo: rủi ro cao + production → canary + metric nghiệp vụ + rollback.", "k": ["canary release", "rollback", "production monitoring", "prompt versioning"], "r": [{"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "", "n": "Nhấn mạnh việc xây dựng eval sát với dữ liệu thực tế; kết quả test phát triển chưa đủ đại diện cho production."}, {"u": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "t": "Define success criteria and build evaluations", "s": "", "n": "Khuyên xác định tiêu chí thành công cụ thể, đo được gắn với kết quả nghiệp vụ, ví dụ độ chính xác của khoản hoàn tiền."}], "f": "", "ke": ["A change that can send wrong refunds should reach production gradually, with monitoring of refund results and a ready way back, rather than all at once. A small monitored release limits how many refunds a faulty change can affect and gives evidence for either promoting the version or rolling it back."], "ap": ["M20#1"]}, "Q075": {"d": 6, "sv": "Một ngân hàng chạy hai agent Claude cùng lúc, mỗi agent hỗ trợ một analyst điều tra một khách hàng khác nhau. Cả hai agent cần cùng một bộ hướng dẫn điều tra dài. Một developer đề xuất chạy cả hai cuộc điều tra trong một conversation chung để hướng dẫn chỉ phải viết một lần. Thiết kế nào giữ dữ liệu của mỗi khách hàng tách khỏi cuộc điều tra còn lại mà vẫn tái sử dụng được hướng dẫn?", "se": "A bank runs two Claude agents at the same time, each helping an analyst investigate a different customer. Both agents need the same long set of investigation instructions. A developer proposes running both investigations in one shared conversation so the in
