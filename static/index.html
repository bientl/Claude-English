<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Tutor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem; font-size: 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    #answer { white-space: pre-wrap; margin-top: 1.5rem; line-height: 1.5; }
    #meta { margin-top: 1rem; color: #666; font-size: .85rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>English Tutor</h1>
  <form id="form">
    <input id="word" placeholder="Nhập một từ hoặc cụm từ, ví dụ: resilient" autofocus>
    <button>Giải nghĩa</button>
  </form>
  <div id="answer"></div>
  <div id="meta"></div>

  <script>
    const form = document.getElementById("form");
    const answer = document.getElementById("answer");
    const meta = document.getElementById("meta");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const word = document.getElementById("word").value.trim();
      if (!word) return;
      answer.className = "";
      answer.textContent = "Đang hỏi Claude...";
      meta.textContent = "";

      try {
        const res = await fetch("/api/explain", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ word }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        answer.textContent = data.text;
        // Hiện stop_reason và usage để quan sát đúng thứ đề thi hỏi.
        meta.textContent =
          `stop_reason: ${data.stop_reason} · input_tokens: ${data.usage.input_tokens} · output_tokens: ${data.usage.output_tokens}`;
      } catch (err) {
        answer.className = "error";
        answer.textContent = err.message;
      }
    });
  </script>
</body>
</html>
